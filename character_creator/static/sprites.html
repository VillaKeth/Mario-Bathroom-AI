<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Manager — Character Creator</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        /* ── Sprite Manager Overrides ─────────────────────────── */
        .sm-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.5rem 2rem;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
        }
        .sm-header h1 { font-size: 1.6rem; margin: 0; }
        .sm-header .back-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0.8rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            transition: all var(--transition-fast);
        }
        .sm-header .back-link:hover { background: var(--bg-hover); color: var(--text-primary); }
        .sm-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 2rem;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .sm-stats { color: var(--text-secondary); font-size: 0.9rem; }
        .sm-toolbar .btn-group { display: flex; gap: 0.5rem; }
        .filter-bar {
            padding: 0 2rem 0.5rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all var(--transition-fast);
        }
        .filter-btn.active, .filter-btn:hover {
            background: var(--color-purple);
            border-color: var(--color-purple);
            color: white;
        }
        .search-box {
            flex: 1;
            min-width: 180px;
            max-width: 300px;
            padding: 0.3rem 0.8rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-primary);
            font-size: 0.85rem;
        }
        /* ── Character Grid ───────────────────────────────────── */
        .chars-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.25rem;
            padding: 1rem 2rem 2rem;
        }
        .char-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: border-color var(--transition-fast), transform var(--transition-fast);
        }
        .char-card:hover { border-color: var(--color-purple); transform: translateY(-2px); }
        .char-card.generating { border-color: var(--color-blue); }
        .char-card.complete { border-color: var(--color-green); }
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 1.25rem 0.75rem;
        }
        .char-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--bg-input);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
            overflow: hidden;
        }
        .char-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .char-info { flex: 1; min-width: 0; }
        .char-name {
            font-weight: 600;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .char-tagline {
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* Sprite count badge */
        .sprite-badge {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .badge-complete { background: rgba(0,168,107,0.15); color: var(--color-green); border: 1px solid rgba(0,168,107,0.3); }
        .badge-partial  { background: rgba(255,140,0,0.15);  color: var(--color-orange); border: 1px solid rgba(255,140,0,0.3); }
        .badge-empty    { background: rgba(229,37,33,0.12);  color: var(--color-red);   border: 1px solid rgba(229,37,33,0.25); }
        .badge-gen      { background: rgba(30,144,255,0.15); color: var(--color-blue);  border: 1px solid rgba(30,144,255,0.3); }
        /* Progress bar */
        .gen-progress {
            padding: 0.5rem 1.25rem 0.25rem;
        }
        .progress-track {
            height: 6px;
            background: var(--bg-input);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--color-blue), var(--color-purple));
            border-radius: 3px;
            transition: width 1s ease;
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.3rem;
        }
        .current-pose {
            font-size: 0.72rem;
            color: var(--color-blue);
            padding: 0.15rem 1.25rem 0.5rem;
            font-style: italic;
        }
        /* Card actions */
        .card-actions {
            display: flex;
            gap: 0.5rem;
            padding: 0.5rem 1.25rem 1rem;
        }
        .btn-gen {
            flex: 1;
            padding: 0.5rem;
            font-size: 0.85rem;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all var(--transition-fast);
        }
        .btn-gen-start {
            background: var(--color-purple);
            color: white;
        }
        .btn-gen-start:hover { background: #6020a0; }
        .btn-gen-start:disabled { background: var(--bg-input); color: var(--text-muted); cursor: not-allowed; }
        .btn-gen-view {
            background: var(--bg-input);
            color: var(--text-secondary);
            flex: 0 0 auto;
        }
        .btn-gen-view:hover { background: var(--bg-hover); color: var(--text-primary); }
        /* Sprite preview strip */
        .sprite-strip {
            display: none;
            padding: 0.5rem 1.25rem 1rem;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .sprite-strip.open { display: flex; }
        .sprite-thumb {
            width: 64px;
            height: 80px;
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: border-color var(--transition-fast);
            position: relative;
        }
        .sprite-thumb:hover { border-color: var(--color-purple); }
        .sprite-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .sprite-thumb .thumb-label {
            position: absolute;
            bottom: 0;
            left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            font-size: 0.55rem;
            color: white;
            text-align: center;
            padding: 1px 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sprite-thumb.broken { opacity: 0.4; }
        /* Backgrounds strip */
        .bg-strip {
            display: none;
            padding: 0.5rem 1.25rem 1rem;
            flex-direction: column;
            gap: 0.6rem;
        }
        .bg-strip.open { display: flex; }
        .bg-gen-row { display: flex; gap: 0.5rem; }
        .bg-gen-row input[type=text] {
            flex: 1;
            padding: 0.45rem 0.7rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.82rem;
        }
        .bg-thumbs { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .bg-thumb {
            width: 150px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            overflow: hidden;
            position: relative;
            background: var(--bg-input);
        }
        .bg-thumb.default { border-color: var(--color-green); box-shadow: 0 0 0 1px var(--color-green); }
        .bg-thumb img { width: 100%; height: 84px; object-fit: cover; cursor: pointer; display: block; }
        .bg-thumb .bg-thumb-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
            font-size: 0.62rem;
            color: var(--text-muted);
            gap: 2px;
        }
        .bg-thumb .bg-thumb-bar button {
            background: none; border: none; cursor: pointer;
            font-size: 0.7rem; color: var(--text-secondary); padding: 1px 3px;
        }
        .bg-thumb .bg-thumb-bar button:hover { color: var(--text-primary); }
        .bg-default-star { color: var(--color-green); font-size: 0.7rem; }
        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
        }
        #lightbox.open { display: flex; }
        #lightbox img { max-width: 80vw; max-height: 80vh; border-radius: var(--radius-lg); }
        #lightbox .lb-label { color: white; font-size: 1rem; }
        #lightbox .lb-close {
            position: absolute;
            top: 1rem; right: 1.5rem;
            background: none; border: none;
            color: white; font-size: 2rem;
            cursor: pointer;
        }
        /* Empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        .empty-state h3 { font-size: 1.2rem; margin-bottom: 0.5rem; }
        /* Loading */
        #loading-state {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            color: var(--text-muted);
            gap: 0.75rem;
            font-size: 1rem;
        }
        .spinner {
            width: 24px; height: 24px;
            border: 3px solid var(--border-color);
            border-top-color: var(--color-purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Lightbox -->
    <div id="lightbox" role="dialog" aria-modal="true" aria-label="Sprite preview">
        <button class="lb-close" onclick="closeLightbox()" aria-label="Close">✕</button>
        <img id="lb-img" src="" alt="">
        <p class="lb-label" id="lb-label"></p>
    </div>

    <div id="app">
        <!-- Header -->
        <div class="sm-header">
            <a href="/" class="back-link">← Wizard</a>
            <div>
                <h1>🎨 Sprite Manager</h1>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="sm-toolbar">
            <div class="sm-stats" id="stats-label">Loading characters…</div>
            <div class="btn-group">
                <button class="btn btn-secondary" id="btn-settings" onclick="toggleSettings()">⚙️ Image AI Settings</button>
                <button class="btn btn-secondary" id="btn-refresh" onclick="loadCharacters()">↻ Refresh</button>
                <button class="btn btn-primary" id="btn-gen-all" onclick="generateAllMissing()" disabled>⚡ Generate All Missing</button>
            </div>
        </div>

        <!-- Settings Panel (collapsible) -->
        <div id="settings-panel" style="display:none;padding:1rem 2rem;background:var(--bg-secondary);border-bottom:1px solid var(--border-color)">
            <h3 style="margin-bottom:1rem;font-size:1rem">🤖 Image Generation Backend</h3>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;margin-bottom:1rem" id="backend-cards"></div>
            <div style="display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap">
                <div style="flex:1;min-width:240px">
                    <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem">HuggingFace Token (free at huggingface.co/settings/tokens)</label>
                    <input type="password" id="hf-token-input" placeholder="hf_xxxxxxxxxxxx" style="width:100%;padding:0.5rem 0.75rem;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-md);color:var(--text-primary);font-family:monospace;font-size:0.85rem">
                </div>
                <div style="flex:0 0 auto">
                    <label style="display:block;font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem">Backend</label>
                    <select id="backend-select" style="padding:0.5rem 0.75rem;background:var(--bg-input);border:1px solid var(--border-color);border-radius:var(--radius-md);color:var(--text-primary)">
                        <option value="auto">Auto (best available)</option>
                        <option value="huggingface">HuggingFace API</option>
                        <option value="a1111">AUTOMATIC1111 (local)</option>
                        <option value="comfyui">ComfyUI (local)</option>
                        <option value="pollinations">Pollinations.ai (slow)</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="saveSettings()" style="padding:0.5rem 1.25rem">💾 Save Settings</button>
            </div>
            <p id="settings-status" style="margin-top:0.75rem;font-size:0.82rem;color:var(--text-muted)"></p>
        </div>

        <!-- Filter bar -->
        <div class="filter-bar">
            <input type="text" class="search-box" id="search-input" placeholder="Search characters…" oninput="applyFilter()">
            <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
            <button class="filter-btn" data-filter="missing" onclick="setFilter('missing', this)">❌ Missing</button>
            <button class="filter-btn" data-filter="partial" onclick="setFilter('partial', this)">⚠️ Partial</button>
            <button class="filter-btn" data-filter="complete" onclick="setFilter('complete', this)">✅ Complete</button>
            <button class="filter-btn" data-filter="generating" onclick="setFilter('generating', this)">🔄 Generating</button>
        </div>

        <!-- Loading -->
        <div id="loading-state">
            <div class="spinner"></div>
            Loading characters…
        </div>

        <!-- Character Grid -->
        <div class="chars-grid" id="chars-grid" style="display:none"></div>
    </div>

    <script src="/static/sprites.js"></script>
</body>
</html>
