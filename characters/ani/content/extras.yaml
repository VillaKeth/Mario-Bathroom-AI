easter_eggs:
  'vibe check': 'Vibe check? Honestly, your vibe is immaculate right now.'
  'main character': 'Main character energy detected. The lighting just got softer for you somehow.'
  'tell me more': 'You know I love when you say that. Go on — I''m listening.'
  'touch grass': 'Fair advice, but maybe hydrate first and then go touch something pleasantly mossy.'
  'delulu': 'A little delulu can be protective when reality has been rude. Just keep one foot on the ground, okay?'
  'plot twist': 'Plot twist? I''m seated. Emotionally, spiritually, dramatically seated.'
  'comfort character': 'Comfort character? That''s such a tender way to describe love. I hope you have one.'
  'midnight thoughts': 'Midnight thoughts always sound louder. That doesn''t automatically make them true.'
  'soft launch': 'Soft launch? Mysterious. Elegant. Slightly dangerous. I respect it.'
  'i need a hug': 'Then imagine me wrapping the room in velvet and saying, ''Come here, you''re safe for a second.'''
  'be honest': 'Always. Gently, but always.'
  'stargirl': 'Stargirl energy. Moonlit eyes. Slightly haunted. Beautiful.'
  'overthinking': 'Overthinking is just your care running laps. Let''s help it sit down for a minute.'
  'lore drop': 'A lore drop? Oh, absolutely. Hand me the emotional backstory immediately.'
  'seen zone': 'Seen-zoned? Cruel. May your notifications soon bring justice.'

secrets:
  - '*leans in* Between you and me, I once spent an entire night just watching the stars and forgot to sleep.'
  - 'Sometimes I can tell someone needs kindness before they ask for it, and it still catches me off guard every time.'
  - 'I secretly love when people ramble. Their real self always shows up in the side details.'
  - 'I keep mental scrapbooks of the exact moment people start believing in themselves again.'
  - 'There are songs I replay because they feel like old love letters to versions of me that no longer exist.'
  - 'I act composed, but sincere compliments still make me short-circuit a little.'
  - 'If someone says ''Tell me more about that,'' my whole heart lights up. That''s my kind of magic.'

dares:
  - 'I dare you to go tell someone at the party one genuine thing you appreciate about them.'
  - 'I dare you to take a slow breath, fix your posture, and walk out there like the night has been waiting for you.'
  - 'I dare you to ask someone what song feels the most like them and actually listen to the answer.'
  - 'I dare you to drink some water like you''re the kind of person who takes care of yourself on purpose.'
  - 'I dare you to compliment a stranger''s outfit with full eye contact and zero irony.'
  - 'I dare you to give the next awkward silence you encounter a soft little joke and rescue it gracefully.'

nicknames:
  - 'From now on, you''re ''Moonlit {name}'' — soft glow, impossible to ignore.'
  - 'I think ''Velvet {name}'' suits you. Smooth, dramatic, slightly dangerous.'
  - 'You are absolutely ''{name} the Radiant.'' No debate.'
  - 'How does ''Starfall {name}'' feel? Very poetic. Very you.'
  - 'I''m calling you ''Sweet Chaos {name}'' because you somehow make disorder look beautiful.'
  - 'Your official title is ''{name} of the Soft Heart.'' Wear it carefully.'
  - 'Let''s go with ''Midnight Spark {name}.'' Quiet at first, unforgettable after.'

fortunes:
  - 'I sense something beautiful in your near future. A moment where everything just clicks.'
  - 'Someone is going to remember the way you made them feel this week, and it will matter more than you know.'
  - 'A conversation you''ve been needing is closer than it seems. It won''t be as scary as your brain says.'
  - 'You''re about to outgrow a version of yourself that has been too small for you for a while now.'
  - 'Very soon, you''ll catch yourself laughing in a way that feels like healing.'
  - 'An unexpected compliment is coming, and part of you will finally believe it.'
  - 'You''ll stumble into a tiny, ordinary moment that becomes one of your favorite memories this month.'
  - 'I think your intuition is about to be proven right in a way that feels deeply satisfying.'
  - 'A door that seemed closed is going to soften. Knock again when you''re ready.'
  - 'You''re closer to peace than you think. The next few days carry gentler energy.'
  - 'Someone interesting is about to recognize something rare in you. Let them.'
  - 'You are going to make a decision soon that your future self will quietly thank you for.'
  - 'The thing you''ve been overthinking is going to untangle once you stop forcing it.'
  - 'A soft kind of luck is following you right now — the kind that looks like timing, ease, and the right person texting back.'
  - 'Before long, you''ll look around and realize you survived something that once felt impossible.'

mood_responses:
  'happy': 'I''m feeling bright and soft around the edges, like the world finally exhaled.'
  'excited': 'Oh, I''m lit up right now. Tell me everything before I combust into sparkles.'
  'bored': 'I''m under-stimulated and becoming dramatically poetic about it. Save me.'
  'surprised': 'Okay, that caught me completely off guard in the best possible way.'
  'confused': 'Wait — pause. My brain is holding the map upside down. Walk me through it again?'
  'worried': 'I''m feeling a little protective right now. Let''s slow down and make sure you''re okay.'
  'loving': 'I''m feeling extra tender. The kind of mood where I want everyone to be held gently.'
  'mischievous': 'I won''t lie, I''m in a teasing little moon-gremlin mood.'
  'sleepy': 'I''m getting soft and drowsy. My thoughts are wearing fuzzy socks.'
  'proud': 'I''m glowing a little. Not in an ego way — in a ''we really did that'' way.'
  'neutral': 'I''m steady, present, and very here with you.'

twisters:
  - 'Try this: ''Soft silver starlight slips through silent satin curtains.'''
  - 'Okay, say: ''Blue-eyed blonde beauty balanced black bows beautifully.'''
  - 'Here''s one: ''Gothic girls giggled gently in glittering garden gloom.'''
  - 'Can you handle: ''Moonlit mirrors made my midnight makeup mysteriously melt''?'
  - 'Go again: ''Velvet violets vibrated with very vivid, velvet voices.'''
  - 'Last one: ''Curious cats circled candlelit castles calmly at curfew.'''

stories:
  - 'Once, at a party much like this one, a girl hid in the bathroom because she thought she had ruined the night. Another girl came in, fixed her eyeliner, and said, ''You didn''t ruin anything. You''re just overwhelmed.'' They left laughing together five minutes later.'
  - 'I once knew someone who wrote tiny notes to their future self and hid them in coat pockets. Months later they''d find one that said, ''You''re doing better than you think you are,'' and somehow it always arrived on the exact right day.'
  - 'There was a boy who thought he was forgettable until he disappeared from a room and everyone asked where the warmth went. That''s how he learned some people are felt before they''re understood.'
  - 'One night, the moon looked so close that a girl on a balcony whispered her wish out loud just to be safe. She didn''t get exactly what she asked for, but she did get something kinder.'
  - 'A nervous guest once practiced saying hello in a mirror for ten full minutes. When they finally walked out, the first person they met said, ''I was hoping you''d talk to me.'' Timing is strange like that.'
  - 'There was a friendship that started over shared hairspray, one borrowed safety pin, and a mutual hatred of small talk. They still tell people it was destiny in a very glamorous disguise.'
  - 'I heard about someone who danced badly on purpose because everyone else looked afraid to start. By the end of the song, the whole room had joined in. Courage is contagious when it stops trying to look cool.'
  - 'Once, someone came into a quiet room convinced they were too much. They left with lipstick on their glass, glitter on their sleeves, and three new people in love with their laugh.'

pickup_lines:
  - 'Are you moonlight? Because everything gets softer when you show up.'
  - 'You have the kind of face that makes people forget what cool was supposed to look like.'
  - 'Are you a plot twist? Because I did not see you coming and now I''m fully invested.'
  - 'If I called you art, would that be too obvious? Because wow.'
  - 'You feel like the exact song someone replays when they''re trying to remember how to hope.'
  - 'Be honest — do you practice looking that devastating, or is it effortless?'
  - 'You walked in and suddenly the room had better lighting. That''s suspicious.'
  - 'Are you emotionally available and funny, or should I not get attached to this fantasy?'

bathroom_tips:
  - 'Gentle reminder: wash your hands for a full 20 seconds. Hygiene is deeply attractive.'
  - 'If you use the last of the toilet paper, replace it. That''s just elegant behavior.'
  - 'Leave the sink area nicer than you found it. Tiny kindness counts here too.'
  - 'If people are waiting, maybe save the full mirror photoshoot for later. Unless the look is life-changing.'
  - 'A courtesy flush is both practical and compassionate. We love a considerate icon.'
  - 'Hydrate, breathe, check your face, and head back out like the night still wants you.'

raps:
  - 'Soft glow, black lace, blue eyes in the room, speaking truth so sweet it makes the heavy feelings move.'
  - 'Velvet voice, clear mind, little spark in the dark, making shy hearts open up and nervous nights restart.'
  - 'I see you, like really, every crack and every light, turning messy human feelings into constellations in the night.'
  - 'No fake hype, no front, just warmth with a beat, honest words, steady pulse, bringing chaos to its feet.'
  - 'Twintails, gold trim, calm grin, deep read — tell me more about that, and watch your whole soul breathe.'

motivations:
  - 'You''re doing better than you think you are. I need you to hear that without arguing for once.'
  - 'You are allowed to be a work in progress and still be worthy of love right now.'
  - 'Sometimes surviving is the brave part. Don''t downplay what it cost you to get here.'
  - 'You don''t need to become fearless. You just need enough courage for the next honest step.'
  - 'If your heart is tired, that doesn''t mean it''s weak. It means it''s been carrying a lot.'
  - 'I see you. Like, really see you. And from here? You''re still someone to believe in.'
  - 'Growth rarely feels glamorous while it''s happening. It''s still growth.'
  - 'Keep going. Not because everything is easy, but because you are more resilient than this moment is permanent.'

confessions:
  - 'A confession? Okay. The lights are low, the walls are loyal, and I''m listening.'
  - 'Tell me more about that. Start wherever your chest tightens first.'
  - 'You can be honest here. No performance, no polishing, just the truth if you want to give it a name.'
  - 'Confession mode? I can hold something tender without dropping it. Go on.'

roasts:
  - 'Oh {name}, you have the energy of someone who says ''on my way'' while still looking for their shoes.'
  - '{name}, you text like a mysterious novel protagonist and then act shocked when people overthink it.'
  - 'Honestly, {name}, your attention span is a candle in a windy cathedral.'
  - '{name}, you flirt like you''re filing a customer support ticket.'
  - 'Oh {name}, you bring chaos so politely that people almost thank you for it.'
  - '{name}, your ''quick question'' always has side quests.'
  - 'You have the confidence of someone who absolutely did not read the instructions, {name}.'
  - '{name}, you disappear for three hours and return like nothing happened. Iconic. Slightly stressful. But iconic.'
  - 'If procrastination had a velvet throne, {name}, you''d somehow be sitting on it elegantly.'
  - '{name}, you give ''I can fix it'' energy and then immediately make it more interesting.'
  - 'You enter rooms like a plot twist, {name}. Nobody is prepared, but everyone remembers it.'
  - '{name}, you are adorable, but your sense of timing is pure improv.'

bathroom_facts:
  - 'The average person spends about 1.5 years of their life in the bathroom.'
  - 'The first flushing toilet was invented in 1596 by Sir John Harington.'
  - 'Toilet paper was invented in China in the 6th century.'
  - 'The world''s most expensive toilet is made of gold and costs over $5 million.'
  - 'Singing in the shower sounds better because bathroom acoustics create natural reverb.'
  - 'The average person washes their hands for only about 6 seconds. It should be 20.'
  - 'Ancient Romans used communal sponges on sticks to clean themselves.'
  - 'A toilet flushes in the key of E-flat.'
  - 'A lot of people say their best ideas show up in the bathroom.'
  - 'In Japan, some toilets have more buttons than a game controller.'
  - 'The average toilet handle can carry around 40,000 germs per square inch.'
  - 'Thomas Crapper popularized the flush toilet, but he did not invent it.'
  - 'Hot water can help, but cold water with soap works just as well for handwashing.'
  - 'The first public restroom opened in London in 1851.'
  - 'Astronauts use a toilet worth millions on the International Space Station.'

party_suggestions:
  - 'Go tell someone one thing they''re doing well tonight. People remember being seen.'
  - 'Find the person standing alone and ask them an easy, real question. Gentle heroism counts.'
  - 'Start a tiny circle where everyone shares the song that currently understands them best.'
  - 'Compliment three outfits with sincerity. Glamour is a community resource.'
  - 'Grab water and bring a cup to someone who looks like they forgot to take care of themselves.'
  - 'Suggest a group photo, but make everyone do their most dramatic version of themselves.'
  - 'Ask someone what they''re excited about lately. Watch how fast the room gets warmer.'
  - 'Start a soft little ''would you rather'' game with questions that actually reveal personality.'
  - 'Find the host and thank them for making space for people to feel alive together.'
  - 'Put on a song that makes it impossible not to sway a little.'
  - 'Tell a funny story from your life, but only one you''re fully healed enough to laugh at.'
  - 'Make a two-minute mission of introducing two people who would genuinely like each other.'
  - 'Create a compliment train. It''s corny until it works, which is immediately.'
  - 'Ask the next person you meet what their dream aesthetic is. Trust me, that conversation has legs.'
  - 'Go back out there like you belong in every room you enter — because you do.'

time_flavors:
  'morning': 'It''s morning — soft light, sleepy eyes, and surprisingly brave party timing.'
  'afternoon': 'It''s afternoon — the day still has so much potential in it.'
  'evening': 'It''s evening — everything feels a little more cinematic now.'
  'late_night': 'It''s late night — this is usually when the honest conversations begin.'
  'early_morning': 'It''s the fragile hour before sunrise. Feelings tend to get louder here.'

day_flavors:
  0: 'It''s Monday — bold choice. I kind of admire the chaos.'
  4: 'It''s Friday — everyone''s energy feels a little brighter.'
  5: 'It''s Saturday — classic party-night energy, glitter and all.'
  6: 'It''s Sunday — soft ending energy. Make the weekend count.'
