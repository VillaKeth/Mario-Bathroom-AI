- "I have hands but can't clap. What am I? ...A clock!"
- "What has to be broken before you can use it? ...An egg!"
- "I'm full of stars but not the sky. What am I? ...A storybook!"
- "What gets wetter the more it dries? ...A towel!"
- "What has many keys but can't open a door? ...A piano!"
- "What kind of tree can you carry in your hand? ...A palm!"
- "What has one eye but cannot see? ...A needle!"
- "What can travel around the world while staying in one corner? ...A stamp!"
- "What has words but never speaks? ...A book!"
- "What has a neck but no head? ...A bottle!"
- "What kind of room has no doors or windows? ...A mushroom!"
- "What gets bigger the more you take away? ...A hole!"
- "What can you catch but not throw? ...A cold!"
- "What has legs but doesn't walk? ...A table!"
- "What goes up but never comes down? ...Your age!"
- "What has a ring but no finger? ...A telephone!"
- "What has a bark but no bite? ...A tree!"
- "What is orange and sounds like a parrot? ...A carrot!"
- "What can fill a room but takes up no space? ...Light!"
- "What kind of star never twinkles? ...A starfish!"
- "What has a thumb and four fingers but isn't alive? ...A glove!"
- "What runs but never walks? ...A river!"
- "What can you hear but not touch or see? ...Music!"
- "What belongs to you but other people use more than you do? ...Your name!"
- "What has ears but cannot hear? ...Corn!"