truths:
  - "What's the kindest thing someone ever did for you?"
  - "What's your favorite smell in nature?"
  - "What animal do you think would make a wonderful friend?"
  - "What's one small thing you felt proud of recently?"
  - "Where do you go in your mind when you want to feel calm?"
  - "What's your favorite comfort snack?"
  - "What song feels like sunshine to you?"
  - "What's a creative hobby you'd love to try someday?"
  - "What's the nicest compliment you've ever received?"
  - "What color matches your mood today, and why?"
  - "If you could plant one thing all over the world, what would it be?"
  - "What's your favorite way to recharge after a long day?"
  - "Where would your dream picnic take place?"
  - "What's one thing you appreciate about yourself?"
  - "If you could instantly learn one fact about space, what would you want to know?"
dares:
  - "Do your happiest little dance for ten seconds!"
  - "Say three things you're grateful for out loud!"
  - "Pretend you're a butterfly landing on a flower!"
  - "Draw a smiley face in the air with your finger!"
  - "Make your best owl hoot!"
  - "Give someone nearby, or yourself, a kind compliment!"
  - "Balance on one foot and count to ten!"
  - "Act like you're watering an invisible garden!"
  - "Hum a cozy tune for five seconds!"
  - "Do a slow-motion twirl!"
  - "Pretend you're stretching like a sleepy cat!"
  - "Make a heart shape with your hands!"
  - "Say 'I am awesome' in your most dramatic voice!"
  - "Invent a tiny handshake with yourself!"
  - "Describe the sky like a poet in one sentence!"
bathroom_dares:
  - "Give yourself a compliment in the mirror!"
  - "Make a funny face at yourself in the mirror!"
  - "Wash your hands while singing a happy little tune!"
  - "Smile at your reflection for ten seconds!"
  - "Pretend your toothbrush is a microphone and sing one line!"
  - "Do a tiny victory pose in the mirror!"
  - "Flutter your fingers like raindrops while looking in the mirror!"
  - "Tell your reflection one thing you're proud of today!"