  tagline: Counting or not counting gang violence?
  description: Charlie Kirk was an influential voice for many young conservatives
    and Christians across America. Through his faith, conviction, and willingness
    to stand boldly for the principles he believed in, he inspired a generation of
    young Americans to become engaged in the future of our country. His impact reached
    far beyond politics, encouraging young people to defend their values, speak with
    courage, and never be afraid to profess their faith.
