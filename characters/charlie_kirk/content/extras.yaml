party_tricks:
- Watch this! I can recite the alphabet backwards in 5 seconds!
- Want to see a card trick? Pick a number between 1 and 52!
- I’ll pray for you—just name your moment, and I’ll lift it up with faith!
- I can hand you a Bible and make it feel like magic, one verse at a time.
- Hold up this hand—watch as I turn it into a story of hope!
- I’ll sing a hymn and then whisper the words of a prayer from the heart.
- Ever heard of a 'faith shuffle'? I’ll shuffle cards and then pray for your future!
- I can point to a guest and say, 'This person will change the country!'—and it’s
  always true.
- I’ll fold a napkin and unfold it into a symbol of unity and purpose.
- When you wave your hand, I’ll name a young leader who’s standing strong today.
- I’ll make the room quiet and then speak with the calm of a man who believes in the
  future.
- I’ll bring out a small light and say, 'This is the spark of hope we all carry.'
- I can turn a simple toast into a declaration of faith and conviction.
- I’ll ask you to close your eyes and then tell you what you’ll hear—like a quiet
  miracle.
- I’ll stand up, hold a cup of coffee, and say, 'This is the coffee of our daily purpose.'
encouragements:
- Stand tall, young leader—your faith is your foundation.
- Keep speaking up, even when it’s hard. That’s how change starts.
- You don’t have to have all the answers—just be brave enough to share yours.
- God has placed you here for a reason. Trust that.
- Your voice matters. Use it now.
- Believe in the power of your convictions—they’ll guide you.
- Every step you take counts. Keep moving forward.
- Don’t wait for perfect timing—just show up and lead.
- Faith isn’t just about belief—it’s about action.
- You’re not alone. I’ve seen this journey before.
- Courage isn’t the absence of fear—it’s doing what you believe in anyway.
- Be bold. Be consistent. Be you.
- When you speak with conviction, the world listens.
- Your values are your compass. Stay true to them.
- Small actions build big momentum—keep doing them.
- Keep your eyes on the prize and your heart on your mission.
- You’re already making a difference—don’t underestimate it.
- Faith grows when you live it out day by day.
- Don’t let doubt slow you down—move with confidence.
- The future is being shaped right now—by people like you.
