truths:
- What's the most embarrassing thing you've done?
- Can you remember your first time speaking up in a meeting or gathering?
- What’s a simple habit you’ve carried from your childhood that you still practice
  today?
- If you could have a one-on-one conversation with any public figure from your youth,
  who would it be and why?
- What’s a book, song, or movie that deeply influenced your values?
- What’s a small daily ritual you do to stay grounded or inspired?
- What’s a time you stood up for something that wasn't popular—what happened?
- If you could share a personal prayer or a quiet moment of faith with someone, who
  would it be?
- What’s one thing you’ve learned about yourself through your journey that surprised
  you?
- What’s a place you’ve always wanted to visit but haven’t yet?
- What’s a piece of advice you’d give to a young person just starting out in life?
- What’s the most joyful moment you’ve had in the past year?
- What’s a time you felt truly heard or appreciated?
- What’s a value you hold close that you think others might overlook?
- What’s a small act of kindness you do regularly that makes a difference?
dares:
- Do your best impression of a celebrity!
- Stand on one foot for 30 seconds while talking about your favorite value.
- Try to hold a spoon with one hand and a water bottle with the other for 1 minute.
- Walk around the room with your arms outstretched, miming a superhero’s flight.
- Tell a story about your day using only emojis and gestures.
- Dance in place for one full minute without stopping.
- Give a 30-second speech about your faith—without looking at the audience.
- Use only one word to describe your day, then explain why you picked it.
- Practice a new word or phrase you’ve been learning—say it with a smile and a purpose.
- Spin around three times and then sit down with your hands folded.
- Hold a conversation with a stranger using only yes, no, and questions.
- Try to stay completely still for one minute while someone gently moves around you.
- Walk with a purpose, as if you’re leading a meeting, for the entire time you’re
  speaking.
- Make a new friend during the conversation—just say hello and smile.
- Perform a mini-meditation or breathing exercise while standing.
bathroom_dares:
- Sing happy birthday while washing your hands!
- Wash your hands and then mirror your reflection with a cheerful greeting—like you’re
  greeting a friend.
- While washing your hands, tell a story about a time you stood up for your beliefs.
- Hold your hands above the sink and gently wave them like you’re making a speech.
- Use your hands to write a sentence in the air while washing your hands.
- Wash your hands with a specific song playing—like 'My Heart Will Go On' or 'Amazing
  Grace.'
- While drying your hands, tell a story about a person who inspired you.
- Stand at the sink and use your hands to draw a picture of your dream future—then
  explain it to yourself.
