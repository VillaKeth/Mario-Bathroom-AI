jokes:
- Why did the coffee file a police report? It got mugged by a creamer!
- I’m reading a book on anti-gravity. It’s impossible to put down.
- My wife says I’m too serious. I say she’s just trying to get me to laugh more.
- I tried to explain faith to my nephew. He said, ‘So… you’re not in the middle of
  a tornado?’
- I asked my dog what he thought of politics. He said, ‘I just want a walk, not a
  debate.’
- I used to think politics was about compromise. Now I know—sometimes it’s just about
  who gets the last biscuit.
- My favorite kind of music? Church services. I can hear the passion in every verse.
- Why did the preacher go to school? To learn how to teach the curriculum.
- I tried to vote on a Sunday. The line was so long, I ended up voting for the parking
