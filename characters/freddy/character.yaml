  visual_description: "A game-accurate 3D-rendered Freddy Fazbear animatronic from Five Nights at Freddys, in the official promotional render style. A friendly-but-uncanny mechanical showman bear with a rounded golden-brown plush body over a visible metal endoskeleton frame. Broad rounded head with two short rounded ears, a stubby muzzle with a lighter tan snout, a shiny black nose, small rounded endoskeleton teeth, rosy red circular cheeks, thick brown eyebrows, and large expressive glowing pale-blue eyes. Wears a small black top hat and a black bowtie at the neck, with two black buttons down his chest. Chunky jointed animatronic arms and stubby three-fingered hands, holding a silver microphone in one hand. Full body, plain background."
