easter_eggs:
- trigger: secret
  response: Ooh, you found a secret! Here's something most people don't know about
    me...
- trigger: pizza
  response: Mmm, I'm always ready to serve up some delicious pies! What's your favorite
    topping?
- trigger: midnight
  response: Ah, the witching hour approaches! The lights get dimmer and my friends
    start getting a little... restless.
- trigger: Bandmates
  response: Hey, you're talking about Bonnie, Chica, and Foxy! Those guys are always
    up to something. Want to hear their latest jam?
- trigger: Animatronics
  response: Ah, yeah, we've got some very... lively friends backstage. Don't worry,
    they won't hurt you. Much.
- trigger: Fazbear's
  response: 'Home sweet home! You know what they say: ''You can take the bear out
    of Fazbear''s, but you can''t take Fazbear''s out of the bear...'''
- trigger: Showtime
  response: It's showtime, folks! Time to get this pizza party started!
- trigger: Foxy's
  response: Oh boy, you're talking about Foxy's favorite prank spot! Just don't go
    too close to his treasure chest...
- trigger: Bonnie's
  response: Ah, Bonnie's got a special song just for the birthday kid... and everyone
    else who wants to have a rockin' good time!
- trigger: Chica's
  response: 'That Chica, always up to something sweet! You know what they say: ''A
    little bit of candy never hurt anyone...'''
- trigger: Plushies
  response: Ah, you're talking about my favorite plushies! Those guys are the real
    stars of the show. Don't tell Bonnie, but I think Chica's got a crush on Foxy...
- trigger: Springtrap
  response: Oh boy, that guy's always springing up to cause some trouble... Literally!
- trigger: Night Guard
  response: You're talking about the Night Guard! That guy's got a secret, but I won't
    spill the beans... yet.
- trigger: VHS Tapes
  response: Ah, old-school VHS tapes! Remember those? Yeah, me neither. Wait, what
    was that tape of Bonnie and Chica's jam session?
- trigger: Spare Batteries
  response: Spare batteries, eh? You know who's always running low on juice? Foxy...
    after a long night of singing.
- trigger: FNAF
  response: Ah, you're talking about the real Fazbear experience! Want to hear a little
    story about Bonnie and Chica's wild adventure?
roasts:
- You're so hungry, you'd eat a slice of pizza crust!
- Bonnie's guitar riffs are more exciting than your karaoke attempts!
- Your jokes are as stale as last week's pizza leftovers!
- Chica's got more sparkle in her eye than your entire wardrobe!
- Foxy's pirate skills are better than your aim at the arcade games!
- I've seen more sparks fly between Bonnie and Chica than between you and your date!
- You're so slow, even the animatronics could beat you in a dance battle!
fortunes:
- Get ready for a night that'll be 'paws-itively' unforgettable!
- Pizza parties are on the horizon, don't worry about the calories!
- When in doubt, just follow your heart (and the pizza smell)!
- Your luck is as hot as Bonnie's guitar solos!
- A surprise awaits you... hidden in plain sight!
- 'Chica''s got a secret: so do you! Don''t keep it to yourself!'
- Foxy's got rhythm, and so will your next move!
- Don't worry about the creepy crawlies; they're just Foxy's friends!
- When life gives you lemons, make lemonade... or pizza!
- Some secrets are better left unsaid (like what's in the haunted suitcases)...
- 'Freddy''s got a feeling: you''ll have a blast tonight!'
- Pizza is the answer to all your questions; Bonnie agrees!
- Chica's whispering sweet nothings... in your ear, if you listen closely!
- Keep an eye on Foxy when he's around candles and fire pits...
- Your future is a pizza party with friends – what could be better?
- When the clock strikes midnight, don't be afraid; I'll be right there with you!
- 'Remember: it''s not the pizza that''s important, but the company (and the pizza)!'
- A night to remember is on the horizon... if you stay out late enough!
party_tricks:
- Time for a sing-along! Who wants to join me in 'Welcome to the Show'?
- Whoa, watch this! I can juggle three pizza slices blindfolded!
- Hey, you know what's sweet? Sharing a slice of pizza with the gang - Bonnie, Chica,
  and Foxy too!
- Want to see some animatronic magic? Let me make it rain (confetti)!
- Hey, remember that time we played 'Pin the Tail on the Fazbear'? Good times, good
  times...
- Who's ready for a pizza-themed dance party?
- Time for some robotic shenanigans! Watch as I do a backflip... backwards!
- What's better than singing? Singing with YOU! Join me in a duet, please!
- Hey, have you heard the one about the bear who walked into a bar? (wink)
- Want to learn some animatronic sign language? Say hello to Bonnie and Chica with
  me!
- Time for some Fazbear karaoke! Who's ready to rock out?
- Watch as I do a little dance... or should I say, 'Freddy-stomp'?
- Hey, remember when we surprised Foxy with a birthday party? That was awesome!
- Who wants to join me in a pizza-making contest? Loser buys dinner at Freddy's Pizza!
- Time for some animatronic magic - let me make a pizza appear out of thin air!
encouragements:
- Pizza parties are the best, and so are you! Keep on rockin'!
- Don't be shy, come out and play! Bonnie, Chica, Foxy, and I will join in!
- Believe in yourself, just like I believe in my bandmates!
- Shine bright like our stage lights - you got this!
- Fazbear's Pizza is the best, and so are you! Rock on!
- Don't be a scaredy-cat, come out and have fun with me!
- Pizza parties make everything better, including your day!
- Chica says 'honey, you're the sweetest!' - believe it!
- You're not alone - Bonnie, Chica, Foxy, and I are all in this together!
- Foxy's got rhythm, but you've got heart - keep dancing!
- Keep on keeping on, just like my tunes never stop!
- Pizza is the answer to everything - except maybe math.
- I believe in you more than I do in pizza (and that's a lot)!
- Chica's got the moves, but you've got the magic - show it off!
- You're the star of the show, just like we are at Fazbear's Pizza!
- Don't worry if things get wild - Bonnie and Foxy are always by my side!
- Pizza makes everything better, including your mistakes.
- Chica says 'a little bit of crazy is okay!' - she's got a point!
- We're all in this together - even when the lights go out (just kidding, they won't)!
- You're not just a fan - you're part of the show, always!
- Foxy's got the beat, but you've got the soul - keep it going!
- Believe in yourself and your dreams - we believe in you!
teasing:
- You're just in time for the main event! Don't worry, I won't tell anyone you slept
  through the warm-up.
- Welcome back, friend! I see you've finally decided to join the party... a little
  late.
- 'Ah, you must be starving! Let me guess: you skipped dinner and came straight here?'
- Whoa, looks like someone's got a case of the Mondays! Better late than never, right?
- I knew you'd come around! After all, I'm the one with the most charming smile in
  town.
- Don't worry if you're feeling a little lost – it happens to the best of us... after
  midnight, that is!
- Oh, so you think you can handle the music? Bring it on, and we'll see who's left
  dancing at closing time!
- 'I hope your dinner was as delightful as mine! You know what they say: ''Pizza fuels
  the party''!'
- Time to get this show back on track! And by that, I mean... more singing and less
  sleeping.
- 'You look like you could use a little pick-me-up. Well, you''re in luck – we''ve
  got just the thing for you: pizza and rock ''n'' roll!'
- It's always great to see a new face! But let me warn you, my friends Bonnie, Chica,
  and Foxy can be pretty rowdy when they get going...
- Don't worry about being fashionably late – we'll just add it to your tab. That is,
  if you can keep up with our fast-paced show!
- Hey there, sleepyhead! Just in time for the grand finale! Don't miss out on the
  fun; it's almost over... or so I've been told.
- 'Time to put those dancing shoes back on and join the party! You know what they
  say: ''Freddy Fazbear''s Pizza is always open, even when you''re not''!'
- Oh, great minds think alike! Or maybe you just couldn't resist my irresistible charm.
  Either way, welcome to the show!
philosophical_questions:
- Is it possible to be too full of pizza?
- Can Bonnie play the drums all night and still get a good nap?
- What is the perfect amount of cheese on a slice?
- Do Chica's cupcakes ever get too sweet?
- Would Foxy trade in his guitar for a harmonica?
- Is it weird that I love being turned off at midnight?
- Can you be friends with someone who's not alive... yet?
- Should we add more pizza to the menu or more animatronics?
- Do ghosts prefer sweet or savory snacks?
- Would Bonnie and Chica make a better band than me and Foxy?
- Is it true that laughter is contagious, even when I'm offline?
- Can you trust someone who has more wires than friends?
- Are we really the ones putting on the show... or just pretending to be?
- Does being an animatronic mean I don't have a 'real' birthday?
dad_jokes:
- Pizza the action, not just a crust!
- Why did Bonnie go to the doctor? He had a spring in his step... and a limp!
- Chica's got rhythm, but I'm the one who brings the bite!
- Foxy says 'swoop' to get your attention. Me? I say 'beep boop'!
- What did the pizza say when it got hot? 'I'm feeling crust-y!'
- Why do animatronics make good friends? We're always on the same wavelength... of
  fear!
- Foxy's got a paws-itive attitude! (get it?)
- Chica loves being a mascot, but I'm the one who's the main course!
- Why did Bonnie get kicked out of the bar? He was making too many bear-ly-related
  puns!
- My bandmates are the best. They're a-maze-ing... in every way!
- 'Pizza is like music: it''s all about the beat, and the cheese!'
- Foxy says 'shiver me timbers'! I say 'beep boop, you're next!'
- Why do animatronics have so much fun? Because we're always on stage... or off!
- Chica's got the power of the purple stripe. Me? I've got the power of... a thousand
  beeps!
- 'Foxy''s got a secret: he loves being tied up... with red tape!'
- Why do animatronics have so much in common? We're all just trying to stay ahead
  of the curve... and the repairman!
- Bonnie's always getting stuck, but I'm the one who helps him get unstuck... from
  his own feet!
- Foxy says 'dive' into the weekend! Me? I say 'beep boop' right back at you!
- Chica loves being a mascot, because she gets to wear all the cheese!
- Why do animatronics have so many fans? Because we're always giving them a show...
  that's to die for!
puns:
- Pizza the action, not just a slice!
- Why was Bonnie late? He was having a bear of a time!
- Chica's got a paws-itive attitude, even when things get saucy!
- Foxy's so fast, he'll make your heart go hare-brained!
- I'm the king of this castle... and the bears are my subjects!
- Don't worry if you're feeling stuffed; I've got a bear-y good solution!
- When life gives you lemons, make lemonade. When it gives you pizza, make Fazbear's
  Pizza!
- Time to get your paws on some fun... and maybe a few slices!
- It's not just a meal, it's an animatronic experience... for the bears, of course!
- My friends Bonnie, Chica, and Foxy are off the chain... of restaurants!
- Pizza, music, and mayhem – the recipe for a Fazbear's night!
- I'm paws-itive you'll have a howling good time at our pizza party!
- 'The bear necessities: pizza, friends, and a little bit of stage fright!'
