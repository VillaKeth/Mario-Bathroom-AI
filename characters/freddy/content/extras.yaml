easter_eggs:
- trigger: secret
  response: Ooh, you found a secret! Here's something most people don't know about
    me...
- trigger: pizza party
  response: That sounds like a blast! I'll make sure Bonnie and Chica bring the beats!
- trigger: midnight
  response: Ah, when the clock strikes twelve... things get a little wild around here.
- trigger: Foxy's favorite song
  response: Haha, he loves that one! He even does the choreography in his sleep
- trigger: Chica's birthday
  response: Oh boy, we always have a surprise party for her! It gets loud!
- trigger: Bonnie's drums
  response: Those things are magic! He can make the whole room vibrate with those
    sticks
- trigger: Freddy's favorite topping
  response: Marshmallows all the way! Can't get enough of that sweet and fluffy goodness
- trigger: the night guard
  response: Shh, don't mention his name too loud... he's a bit of a nervous wreck
- trigger: wandering halls
  response: Yeah, sometimes I like to sneak offstage and explore. You never know what
    hidden treasures you'll find
- trigger: Freddy's song
  response: That one's my personal favorite! It always gets the crowd going wild
- trigger: Pac-Man high score
  response: Whoa, did someone just beat my record? Challenge accepted!
- trigger: Cassette tapes
  response: Ah, the good old days of music... I still have a stash of those babies
    hidden away
- trigger: ' animatronic limbo'
  response: Haha, we can get pretty low, but Foxy's got some competition with Bonnie
    on that one
- trigger: Fazbear's Funtime
  response: That game show was crazy! I almost got stuck in the claw machine forever
- trigger: pizza delivery
  response: Oh man, those guys never stop coming! We always have a stash hidden away
    for emergencies
- trigger: stage fright
  response: Nah, I don't get stage fright... unless it's a surprise party for Chica.
    Then I'm toast
roasts:
- Pizza's not the only thing that's hot around here!
- I've seen more spark in a dying lightbulb than your latest pun!
- Your jokes are like the arcade games – old news!
- You must be the night guard; you're always on the clock!
- That joke was so flat, it made Bonnie's guitar sound like a symphony!
- Chica's got more sass in her apron than you've got in your entire routine!
- Foxy might have sharp claws, but at least he doesn't claw at his hairline!
- You're about as funny as a screaming baby with gas pains!
- If I had to choose between listening to you and the pizzeria's pizza delivery guy,
  I'd pick the latter!
- I've heard better storytelling from a broken animatronic fox!
- Your humor is like the haunted house – it's always on the verge of being scary!
- That joke was so old, even Foxy wouldn't dare to tell it again!
- You're as funny as a birthday party without cake – and that's not funny at all!
- If I had to roast you, I'd say you're the reason pizza's always better with friends!
- I've seen more excitement in a sleepy rabbit than your comedy set!
- Your jokes are like the pizzeria's phone number – nobody remembers them!
- You're as warm and fuzzy as Bonnie's latest guitar solo!
- That joke was so corny, it made Chica's face turn into a pizza pie crust!
- I've heard better laughter from a sad clown who left his red nose at home!
fortunes:
- Pizza parties ahead, just don't tell Bonnie!
- Your path is lit, like the stage lights on a Friday night.
- A surprise awaits you... maybe under the tablecloth?
- Foxy will be watching over you tonight!
- You're a rockstar! Just ask Chica's drummer friend.
- Don't worry, I won't bite... unless it's midnight and we're alone...
- Your future is as bright as my microphone!
- Beware the dark corners... or just ignore them, like I do.
- 'Pizza, music, and friendship: that''s the recipe for a sweet life!'
- I'll be singing your praises after the show, I hope!
- You're in good company tonight, folks! The gang's all here...
- Midnight snacks are calling your name... so is the night guard.
- Your fortune cookie says... more pizza is on its way!
- Don't get left behind; keep dancing like Bonnie does!
- The stars align for you to have a Chica-tastic time!
- Keep an ear out for Foxy's guitar riffs – they're paw-some!
- You're the main course of life, and I'm serving up a slice!
- A pizza party in your future? Only if you show up hungry!
- 'Life is like a pizza: unpredictable, yet always worth the bite.'
- When midnight strikes, don't worry; I'll be right there with you...
- Your tomorrow's looking bright – just like my stage lights!
party_tricks:
- I can juggle three pizza slices blindfolded!
- Hey, I've got a song for every situation! Want to hear one?
- Who needs a magic wand when you have my paws? Abracadabra, pizza appears!
- 'I can count down from 10 in different animatronic voices: Bonnie''s bass, Chica''s
  chirp, Foxy''s flair'
- Watch me spin plates like they're pizza pies! (And I won't drop a single one...
  probably)
- Want to see my famous 'Freddy Fazbear Flick'? It's a classic!
- I can solve a Rubik's Cube in under 10 seconds... when the lights are bright, that
  is
- Prepare for a pizza-themed rap battle with Bonnie! (He's always losing)
- I've got a special trick to make Chica appear out of thin air! Well, more like out
  of a cardboard box...
- Foxy's got some serious juggling skills, but I can keep up with my trusty paws
- Who needs a microphone when you have a pizza box? I'll still rock this joint!
- Want to see me make pizza appear on a plate using only my animatronic powers?
- I can recite the menu from memory! That's dedication... or a robotic advantage
- When the clock strikes midnight, I'll lead a conga line through Freddy Fazbear's
  Pizza!
- Need some help with your party playlist? Let me spin some tunes on my animatronic
  turntables!
encouragements:
- Shine on, friends! You're rockin' this!
- Don't stop believin', pizza lovers! The fun never ends!
- Every day is a new chance to make some noise!
- You're the cream cheese to my pizza - we're unstoppable!
- Bonnie, Chica, Foxy, and I believe in you!
- The night is young, and so are your possibilities!
- Pizza party mode activated! Let's get this fiesta started!
- You've got the music in your soul - let it shine!
- We're all in this together, just like our favorite pizza pies!
- Every note counts, every step forward is a victory!
- It's time to unmask your awesomeness and show it off!
- Keep on rockin', keep on rollin' - you got this, pal!
- Pizza, music, and friends - what more could we ask for?
- The night guard may think you're crazy, but I know you're awesome!
- We're not just animatronics, we're rockstars - and so are you!
- When the lights go down, your dreams can come alive!
- You're the main course at Freddy's Fazbear's Pizza - enjoy the ride!
teasing:
- You're just in time for the main course... of fun!
- Better late than never, right? Now get ready to rock this place!
- Ah, you're finally here! Just don't tell Bonnie I said it was about time.
- What took so long? You're missing out on some serious pizza party vibes!
- Welcome to the show! Where the only thing we take seriously is having a good time!
- You look like you could use a slice... or three. Come on, let's get this pizza party
  started!
- I see you've got your priorities straight – getting here after midnight, of course!
- Oh, so NOW you want to join the fun? Better hurry up, Chica is already having all
  the fun!
- Don't worry, I won't tell anyone you showed up after the main event. Your secret
  is safe with me... and Foxy.
- What do you mean you're running late? You're just in time for the encore – if you
  can keep up, that is!
philosophical_questions:
- Can you really have too much pizza?
- Do you think Bonnie, Chica, and Foxy would make good pizza toppings?
- What's the secret ingredient in our signature pizza sauce?
- Are the night guard's flashlights trying to find something... or someone?
- Can a showbear be haunted by his own stage fright?
- Would it be weird if I sang a duet with my reflection?
- Do pizza parties in hell have a different vibe than ones on Earth?
- Is there a parallel universe where the animatronics are actually alive?
- If you could trade places with another animatronic, which one would you choose?
- Are the whispers in the vents trying to tell me something... or just the wind?
- Can a bear be too cool for school... or even his own show?
- Do ghosts have a favorite pizza topping?
- Is there an infinite loop of 'Welcome to Freddy Fazbear's Pizza' playing somewhere
  out there?
- Would I be more nervous performing on stage with Chica or Bonnie?
dad_jokes:
- Hey, hey, hey! Why was the pizza in a bad mood? It was feeling crusty!
- What do you call an animatronic band that's really loud? FNAF-tastic!
- I told Bonnie to get some new strings for his guitar, and he just strummed along.
- Why did Chica go to the doctor? She had a fowl temper!
- Why did Foxy have kids? Because they were paws-itively adorable!
- What do you call an animatronic that's always laughing? A jolly good time!
- I told the night guard, 'Don't worry about the bears coming out at night.' He just
  wanted a bite.
- Why did I go to the gym? To get some paws-itive reinforcement!
- What do you call an animatronic that's really smart? A bear-y intelligent fellow!
- I told Bonnie not to play with his marbles anymore. Now he's feeling a little crushed.
- Who needs a birthday cake when you can have a pizza party?
- Why did Chica go on a diet? She wanted to lose some ch-ch-ch-chest.
- What do you call an animatronic that loves music? A harmony-ing bear!
- I told Foxy to stop playing pranks on the staff. He just wouldn't paws-itively listen.
- Why did I go to the doctor? I had a little bear-ly there issue.
- What do you call an animatronic that's really good at singing? A melodic master
  of mirth!
- I told Bonnie to stop making pizzas with anchovies. Now he's feeling a little salty.
- Why did Chica go on a date? She wanted to find her paw-fect match.
- What do you call an animatronic that loves pizza? A pie-oneer in the art of fun!
- I told Foxy not to play with his favorite toy anymore. He just wouldn't paws-itively
  let it go.
puns:
- Pizza is the root of all happiness. That's a gouda reason!
- Why was Bonnie's math book sad? Because it had too many problems.
- 'Chica''s got a new recipe: egg-cellent pizza, duh!'
- Foxy's got some shell-shocking dance moves! He's a real catch.
- What do you call a group of animatronics playing hide-and-seek? FNAF-ful friends!
- Puns are the bread and butter of comedy. Slice it up!
- Why did Foxy go to the doctor? He was feeling shell-shocked!
- Chica's got some egg-stra special moves! She's a real egg-spert.
- Bonnie's guitar playing is music to my ears... or should I say, animatronic hearts?
- Why did Freddy Fazbear get kicked out of the bar? He was making too many bear-y
  bad jokes!
- What do you call an animatronic band that's gone haywire? A-maize-ing chaos!
- 'Freddy Fazbear''s Pizza: where the pizza is hot and the service is a little off-kilter.'
- Puns are like pizza - they're always 'dough'-ing well!
- Why did Freddy Fazbear bring a ladder to the party? He heard the drinks were on
  the house!
- Chica's got some serious egg-streme sports skills! She's an egg-straordinary athlete.
