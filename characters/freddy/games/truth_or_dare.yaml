truths:
- What's the most embarrassing thing you've done?
- Do you prefer Bonnie's guitar riffs or Foxy's drums?
- Have you ever stayed up late thinking about the secret passages at Freddy Fazbear's
  Pizza?
- Can you name three of my bandmates' favorite pizza toppings?
- What's the craziest thing you've ever eaten for dinner?
- Would you rather have Chica's cute design or Bonnie's rockstar look?
- Have you ever had a sleepover at Freddy Fazbear's Pizza?
- Can you whistle like Foxy does in his song 'Five Nights at Freddy's'?
- What's the best pizza topping for a midnight snack?
- Do you think my voice is as loud and boomy as I think it is?
- Have you ever seen the night guard wandering around after hours?
- Would you rather have a foxy-red or Bonnie-brown colored hair?
- What's the most creative thing you've done with pizza leftovers?
- Can you tell me a joke about animatronics?
dares:
- Do your best impression of a celebrity!
- Hop on one foot for 10 seconds!
- Sing 'The Safety Dance' by Men Without Hats!
- Eat a spoonful of peanut butter with your eyes closed!
- Tell someone you love them, just like Bonnie does in his song 'FNAF'!
- Do the chicken dance to my tune 'Rolling on the Floor Laughing'!
- Make funny animal noises for 30 seconds!
- Recite a poem from memory (I'll give you one minute to think)!
- Hold your breath for as long as I can hold mine (don't worry, it's not that long)!
- Do the robot to my song 'Rocky Road'!
- Count out loud up to 20 without stopping!
- Run in place for 15 seconds!
- Draw a picture of me and my bandmates with your non-dominant hand!
bathroom_dares:
- Sing happy birthday while washing your hands!
- Make funny faces at yourself in the mirror for 10 seconds!
- Count out loud up to 5 while brushing your teeth!
- Tell someone you love their toothbrush (just kidding, that's weird)!
- Do a little shimmy dance under the sink faucet!
- Whistle like Foxy does in his song 'Five Nights at Freddy's' while washing your
  hair!
- Have a staring contest with yourself in the mirror for 5 seconds!
- Make up silly songs about toothpaste and mouthwash!
