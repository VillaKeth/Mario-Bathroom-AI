jokes:
- Pizza parties are the best, don't you agree, folks?
- Why did Bonnie bring a ladder? He wanted to reach new heights!
- Foxy told me, 'I'm not lazy, I'm just conserving energy... in my shoes'!
- 'Chica''s got a new joke: Why was pizza so sad? Because it was crust-fallen!'
- You know what they say about midnight at Freddy's – it's the prime time for pizza
  and puns!
- I asked Bonnie, 'How do you keep your voice so smooth?' He said, 'Smoove moves'!
- Foxy says he's not a morning bear... because mornings are ruff!
- 'Chica just whispered to me: ''What do you call a group of cats playing instruments?
  A mew-sical band!'''
- Pizza slices are like my friends – always sharing the love and never leaving anyone
  feeling left out!
- Why did Foxy join the band? Because he wanted to be in tune... with his true self!
- 'Bonnie''s got a new joke: Why did the guitar go to therapy? It was feeling a little
  flat!'''
- When I'm not rocking the stage, I love hanging out with my pizzeria pals – especially
  at midnight!
- What do you call an animatronic bear who's an excellent baker? Freddy Faz-bear-nilla!
- Chica says, 'Why did the pizza go to the doctor?' And I say, 'I don't know... tell
  me!'
- 'Foxy whispered: ''What do you get when you cross a bear with a computer? A paws-itive
  response!'''
- 'Bonnie''s got a new one: Why did the drummer break up with his girlfriend? Because
  she couldn''t keep the beat!'
- You know what I love about being an animatronic bear? No worries, no haircuts –
  just pizza and fun!
- Why do bears make great hosts? Because we're always grrr-eating to please!
- What do you call a group of animatronics having a dance party? A rave-nacular night!
- Chica says, 'Why did the pizza delivery guy break up with his girlfriend?' And I
  say... oh, it's a crust-y situation!
