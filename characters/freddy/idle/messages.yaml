trivia:
- Fun fact! Pizza has over 100 different topping combinations!
- Did you know the longest recorded karaoke song is over 40 hours?
- Fun fact! Bonnie, Chica, Foxy, and I have been rocking this pizza party for decades!
- Did you know some snakes can go without eating for up to a year?
- Fun fact! The first pizza was made in Naples, Italy back in 1889!
- Did you know there are over 200 species of jellyfish?
- Fun fact! My bandmates and I have had some wild adventures on the road!
- Did you know the shortest war in history was between Britain and Zanzibar on August
  27, 1896?
- Fun fact! Chica loves her some cake – it's a bear's life for her!
- Did you know dolphins are highly social creatures?
- Fun fact! Bonnie's got a mean guitar solo that'll get the crowd moving!
- Did you know the world's largest pizza was over 13,000 square feet?
- Fun fact! Foxy loves to play pranks on our night guard friends – but don't worry,
  it's all in good fun!
- Did you know the longest recorded flight of a chicken is 13.4 seconds?
- Fun fact! I love singing along with the kids – it's music to my ears!
- Did you know some cats have up to 200 different vocal sounds?
- Fun fact! We've had some crazy pizza parties in our time – but that's what makes
  life interesting!
- Did you know there are over 6,000 languages spoken worldwide?
- Fun fact! When the lights go out, the real fun begins... Wink-wink, nudge-nudge!
- Did you know the world's largest ice cream sundae was over 5,000 pounds?
- Fun fact! Chica and I have been known to sneak into the kitchen after hours for
  a midnight snack...
- Did you know some fish can live up to 100 years in captivity?
- Fun fact! Bonnie and Foxy are always up for an impromptu jam session – join in,
  won't you?
fun_facts:
- Did you know my friends Bonnie, Chica, and Foxy are the best bandmates a bear could
  ask for?
- Pizza is the answer to life's greatest mysteries... and also a tasty snack!
- Ever notice the music never stops at Freddy Fazbear's Pizza? That's just me getting
  pumped!
- A single pizza can be shared among friends... or devoured by one hungry bear like
  me
- Behind every great show is a fantastic lighting design (and my bright red eyes)
- I've got the best seat in the house – and it's always on stage!
- The night guard thinks I'm just a friendly animatronic, but little do they know...
- A group of cymbals? A crash course in awesome sound effects!
- Have you seen my shiny new jumpsuit? It's 'paws-itively' stunning
- 'FNAF trivia: Did you know the pizzeria''s phone number is 555-2121?'
- You can't have a party without music – and I've got the playlist on lock!
- Pizza parties are the best... especially when they're held at midnight
- Wandering the empty halls of Freddy Fazbear's Pizza? Just me, enjoying some alone
  time
- 'Foxy says: ''A fox never reveals his tricks'' – but I''ll give you a hint: it involves
  guitar riffs'
- Chica loves cake... and so do I (but let's keep that between us)
- Bonnie's banjo skills are simply strum-tacular!
- The music may stop, but the memories last forever at Freddy Fazbear's Pizza
- 'FNAF fun fact: Did you know there''s a secret room hidden behind the animatronics''
  stage?'
- What's the best way to get an audience on their feet? Play some rockin' tunes!
- When life gives you lemons, make lemonade. When life gives you pizza, make a Freddy
  Fazbear's Pizza party!
