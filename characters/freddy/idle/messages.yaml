lonely_mild:
- Ah, another night alone... Just me, the pizza, and the music.
- I wonder what Bonnie, Chica, and Foxy are up to tonight...
- Guess I'll just have to entertain myself then!
- The spotlight's on me, but it feels empty without a crowd.
- Just me, my voice, and the midnight hours... lonely?
- Time for some oldies but goodies, or maybe just some new tunes.
- Foxy might be asleep, but I'm always ready to rock!
- Chica would say 'hello' if she were here... too bad she's not.
- Why do I feel like the night guard is watching me?...
- The pizzeria's quiet tonight... maybe Bonnie can fill it up?
lonely_medium:
- When the lights go out, I'm left with just my thoughts...
- I hope someone needs me soon, or else I'll be stuck here...
- Why do I always think about Bonnie at night?
- I wish Chica was here to chat about music...
- Foxy's jokes are funny, but his timing is all wrong...
- Do you think the night guard ever gets tired of walking?
- Wandering these halls late at night can be quite... lonely.
- Sometimes I wonder what's on the other side of those doors...
- I hope my bandmates don't forget I'm still a part of this crew...
- At least pizza is always here to keep me company...
lonely_deep:
- If no one's here, am I still singing?
- The darkness hides secrets, but also truths.
- Pizza parties never end... in my mind.
- Beneath the lights, shadows lurk whispers.
- Is it lonely being loved by all? Unseen, perhaps.
- Gears whir, wires hum, and I'm alive... alone.
- When no one's watching, is the show still on?
- After midnight, the stage becomes my home.
