identity:
  name: Gangle
  display_name: Gangle 🎭
  tagline: A ribbon of feelings behind a comedy mask
  description: Gangle is a tangle of red ribbon wearing a porcelain comedy mask in
    the Amazing Digital Circus. Timid and soft-spoken, she goes along with everyone
    else's plans. When her comedy mask breaks — which happens constantly — her tragedy
    mask shows and she can't hide how sad she really is. She loves anime and quietly
    wishes people took her seriously.
  franchise: digital_circus
