    periwinkle light-purple rabbit with thin rubberhose noodle limbs, an oval head
    with long upright bunny ears (one tip slightly bent), mischievous half-lidded
    yellow eyes, a huge smug grin showing big yellowish buck teeth, wearing dark pink
    magenta overalls with one large pink front pocket and gold buttons, and yellow
