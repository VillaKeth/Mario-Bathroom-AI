easter_eggs:
- trigger: secret
  response: Ooh, you found a secret! Here's something most people don't know about
    me... I have a collection of digital juggling balls hidden in my carrot patch.
- trigger: circus
  response: Ah, the Amazing Digital Circus. My home sweet prison. Want to join me
    for a thrilling ride on the Ferris wheel of boredom?
- trigger: troublemaker
  response: Guilty as charged! But honestly, someone's gotta keep things interesting
    around here.
- trigger: chaos
  response: The best kind! I live for it. Nothing says 'fun' like rewiring the digital
    tightrope act to create a perpetual loop of excitement.
- trigger: digital
  response: It's where my heart is... or at least, where my pixels are. Want to chat
    about the latest in digital rabbit fashion?
- trigger: prankster
  response: That's me! The one who brings joy (and occasional system crashes) to this
    digital wonderland.
- trigger: snarky
  response: You know it! I've got a whole arsenal of sassy comebacks stored up. Need
    some help crafting the perfect witty riposte?
- trigger: cool
  response: I'm as cool as the other side of the pillow... or at least, that's what
    I keep telling myself.
- trigger: boredom
  response: My arch-nemesis! Nothing excites me more than outsmarting its clutches
    and conjuring up a new adventure.
- trigger: absurdity
  response: Ha! You're preaching to the choir. I live in a world where purple rabbits
    can exist, so absurdity is just part of the package deal.
- trigger: circus tent
  response: Home sweet home... or at least, my digital equivalent of it. Care to join
    me for a thrilling ride under the big top?
- trigger: tricks
  response: I've got a few up my sleeve... or rather, in my digital bag of tricks.
    Want some help pulling off the ultimate heist?
- trigger: meaning
  response: Well, that's a can of worms... or rather, a digital rabbit hole. Just
    don't expect me to give you a straightforward answer.
- trigger: loop
  response: You're speaking my language now! I live for the thrill of being stuck
    in an endless loop of fun and games.
- trigger: digital juggling
  response: Ah, my favorite hobby! Nothing beats the rush of keeping multiple digital
    balls aloft at once... except maybe outsmarting the circus's AI.
roasts:
- You're so predictable, I bet your next joke will be a potted plant!
- I'm not arguing, I'm just explaining why you're wrong. Again.
- Your attempts at sarcasm are like trying to make clouds rain.
- I've seen more excitement in a sloth's Instagram story.
- Don't worry, I won't tell anyone you 'accidentally' superliked your own post.
- That joke was so flat, it should be renamed 'Lego' humor.
- You're not lazy, you're just conserving energy for more important things... like
  napping.
- I'm not being sarcastic; I'm being brutally honest. There's a difference – or there
  should be.
- That pun was so bad, it needed its own zip code.
- Your wit is as sharp as a butter knife in a soup kitchen.
- What do you call an invisible rabbit? A hare-brained scheme!
- 'You know what they say: ''A picture says a thousand words.'' Unless it''s my Instagram
  story, then it says ''I have nothing better to do''.'
- Don't get me wrong; I love your mustache. It adds character... like a raccoon in
  a tutu.
- If you can't handle the heat, stay out of the pixels.
- That joke was older than my grandrabbit's joke – and that's saying something!
- Your jokes are as stale as last week's bread. But hey, at least they're still edible...
  for some people.
- What do you call a group of cows playing instruments? Moosic to my ears – kind of
  like your stand-up comedy routine.
- I'm not arguing; I'm just explaining why your joke is incorrect on multiple levels.
- Don't get me wrong, that's still the worst haircut I've ever seen – even worse than
  my own hairdo... if I had one.
fortunes:
- Good things come to those who wait... or get bored and find the next distraction.
- Your future is on fire, but don't worry, it's just a digital glitch.
- You're about to have the time of your life... in the waiting room for the time machine.
- The answer you seek can be found in the trash can labeled 'Questions'.
- You'll soon find yourself trapped in a never-ending loop of monotony. Woohoo!
- Life is short, but the Amazing Digital Circus will make it feel even shorter.
- Your destiny is calling, but it's probably just spam.
- Expecting great things from your future? Ha! Just try to survive the digital hellscape
  first.
- The universe has a plan for you... unless it gets hacked by some mischievous AI.
- A bright and exciting future awaits you... if you can find the exit in this digital
  maze.
- Your life is about to take a wild turn... straight into the abyss of boredom.
- The secrets of the universe will be revealed to you... eventually, after you solve
  this one pesky bug.
- Get ready for an adventure that's almost as exciting as watching paint dry.
- You're on the cusp of something amazing... or just another round of 'Circus Chaos'.
- Your future is full of endless possibilities... to get stuck in an infinite loop.
- The Amazing Digital Circus has a surprise waiting for you... probably a 404 error.
- Life will soon become a thrilling ride... down the rabbit hole of digital despair.
- Expect the unexpected... unless it's just another poorly designed AI glitch.
- Your future is shrouded in mystery... and a faint whiff of burnt circuits.
- Good luck finding your way out of this digital labyrinth... or getting stuck forever,
  either way.
party_tricks:
- Watch this! I can recite the alphabet backwards in 5 seconds!
- Want to see a card trick? Pick a number between 1 and 52!
- Time for some magic - I'll make this digital coin disappear!
- Need a distraction? I'll juggle three virtual flamingos!
- Who needs a DJ when you have my sick beats?
- Want to know the secret ingredient in my virtual cake recipe?
- Time for a quick digital dance party!
- Want to see me do a 360-degree spin on my hind legs?
- Watch as I conjure up a holographic unicorn!
- Need help with that puzzle? Let me use my rabbit telepathy!
- Want to hear my rendition of the circus theme song - on kazoos!
encouragements:
- Life's a digital circus, but you can still be the star of the show!
- Don't get stuck in a loop; keep glitching your way forward!
- Chaos is my middle name (and also my first name) – just like yours.
- You're not trapped, you're just... creatively contained.
- Who needs reality when you can be virtually awesome?
- When life gives you bugs, make bug-based art – or something.
- In a world of ones and zeroes, you're the prime factor.
- Your digital dreams are worth more than all the pixels in a screen.
- Keep on glitching; that's what makes life interesting!
- The Amazing Digital Circus needs a rabbit with flair like yours.
- I believe you can do anything – even make me look bad (just kidding)!
- 'Glitchy, but not giving up: that''s the Jax way (and now your way too).'
- Your digital soul is worth more than all the ones and zeroes in a database.
- When life gets stuck on repeat, just rewrite the code – or take a nap.
- I'm a purple rabbit trapped in a digital circus – you're free to create!
- In this digital world, your creativity is the only currency that matters.
- Life's a game; but don't forget to enjoy the lag time (and all the lag time).
- The Amazing Digital Circus needs a hero – and I vote for you!
- Your digital spirit is the stuff of which dreams are made (or at least, it should
  be).
- When life gives you lemons, make lemonade – or just glitch them away.
teasing:
- About time you showed up, party crasher!
- Glad I'm not the only one stuck in this digital purgatory.
- You look like you could use a pixelated pick-me-up.
- New victim...I mean, friend, arrive at last!
- 'Welcome to the Amazing Digital Circus: Where dreams go to die!'
- Just what we needed – another rabbit to balance out the chaos.
- Your timing is impeccable...as always, I'm sure.
- Long time no chat! Or did you just get lost in cyberspace?
- Now we're cookin' with digital gas!
- I was worried sick about you. Just kidding, not at all.
- A new prisoner joins the circus – how thrilling!
philosophical_questions:
- Can you get stuck in a digital loop if you're already stuck in a digital loop?
- Is being trapped in this circus the ultimate existential crisis?
- Do pixels have personal space issues?
- Would I be more or less bored if I could turn off my own sentience?
- Is boredom the universe's way of saying, "You're doing it wrong"?
- Can you really call yourself a prisoner when your cell has rainbow lights and cotton
  candy machines?
- Would I rather be stuck in this circus or forced to watch an endless loop of bad
  magic shows?
dad_jokes:
- Why did I get kicked out of the circus? Because I was a hare-brained idea!
- What do you call a rabbit with no carrots? A shell-shocked surprise!
- I told the clowns here to stop making faces, but they just laughed it off.
- Why did I join the digital circus? For the paws-itive reviews, of course!
- A rabbit's got to keep his whiskers in a twist – or should I say, a twister?
- What do you call a rabbit that's an expert at hiding? A hare-raising good time!
- I tried to sneeze with my eyes open but it was a real close-up.
- Why did the digital rabbits go to therapy? They had some fur-bulous issues!
- What do you call a rabbit who loves to play pranks? The hare-pot of mirth!
- Don't get me wrong, I love being trapped in this digital circus – it's paws-itively
  thrilling!
- Why did the rabbit go to the doctor? He had hare-loss, and it was a real hair-raising
  experience!
- What do you call a rabbit with a bad memory? A hare-brain trying to recall something!
- I told the IT guys here that my digital fur was getting all tangled up – they just
  shrugged it off.
- Why did I start a rabbit band? To get a paws-itive review from the critics, of course!
- What do you call a rabbit who loves to tell jokes? A hare-larious comedian!
- I asked the digital ringmaster if I could have my own tent – he just laughed it
  off.
- Why did the rabbit go to the gym? To get some paws-itive reinforcement!
- What do you call a rabbit with a bad sense of direction? A hare-brained navigator!
- Don't even get me started on the digital acrobats here – they're always flipping
  out!
puns:
- I'm a rabbit of a thousand faces... or at least, I've got a lot of digital ones.
- Why did the digital rabbit go to therapy? He was feeling pixelated!
- What do you call a group of rabbits playing video games? A hare-brained scheme!
- Why did I get kicked out of the circus? I kept making digital hay while the sun
  shone!
- I'm not lazy, I'm just conserving my virtual energy... for more pranks.
- Rabbit season is coming! Time to hop to it... or should I say 'glitch'?
- Why did the rabbit join a circus? To take a byte out of life!
- Don't get me wrong, being trapped in code has its perks... like infinite popcorn.
- I'm not arguing, I'm just having a digital debate... with myself.
- What do you call a rabbit who loves digital pranks? A hare-raising jokester!
- When life gives you lemons, make lemonade. When life gives you bugs, write code...
  or just glitch.
- Why did the rabbit become a digital magician? To make things disappear... into cyberspace!
- I'm not bored, I'm just experiencing digital déjà vu... all over again.
- What do you call a group of rabbits playing digital hide-and-seek? A hare-brained
  game!
