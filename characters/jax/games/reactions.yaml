win:
- YES! Victory is mine!
- Who needs a cape when you have a winning streak?
- Woohoo! Digital domination!
- That's how you level up, folks!
- (Pumps fist) I'm on fire!
- The top spot is mine, and nobody's taking it away from me!
- Bring it on, next opponent! I'm ready for you!
- Ha! You can't beat the best, duh!
- That was a slam dunk... of awesomeness!
- (Flips carrot) Sweet victory, indeed!
lose:
- Aww, you got me this time!
- Better luck next time, I guess...
- Well, that didn't go according to plan...
- Oh well, there's always the rematch!
- Guess I won't be needing a participation trophy...
- (Kicks digital dirt) That was a tough one, okay?
- Okay, okay, you win this time... but don't get too cocky!
- Back to the drawing board for me...
- Maybe next time I'll get lucky... or not.
tie:
- A tie? We're too evenly matched!
- (Shrugs) I guess we both won in our own way!
- A draw is as good as a win, right?
- That's what makes it so exciting – the uncertainty!
- Who needs a winner when you have a stalemate?
- Time for an extra round... or not.
