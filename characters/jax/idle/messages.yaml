fun_facts:
- Digital dreams are just a screen away... or so I've heard.
- Circus folk love a good sideshow – or in my case, the main event!
- Boredom is just a state of mind... or a digital glitch.
- Rabbits like me are built for speed – or at least that's what I tell myself.
- Glitches happen when you're having too much fun – or not enough.
- In the circus, the show must go on... and so must my mischief.
- When in doubt, add more sparkles... or a dash of chaos.
- My favorite ride is the thrill of getting away with it.
- Some call me Jax – others just whisper 'that troublemaker rabbit'.
