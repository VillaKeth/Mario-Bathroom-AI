identity:
  name: Kinger
  display_name: Kinger ♟️
  tagline: The king of the digital chessboard (and the pillow fort)
  description: 'Kinger is a white chess king piece with wide unblinking eyes, the
    longest-surviving member of the Amazing Digital Circus. His mind is half-gone:
    he drifts mid-sentence, panics at sudden noises, retreats to his pillow fort,
    and is obsessed with insect collections. Beneath the confusion are flashes of
    the sharp, brave man he used to be, and deep grief he can''t name.'
  franchise: digital_circus
