- 'Interastral Peace Corporation: The Interastral Peace Corporation , abbreviated as the IPC , is an intergalactic mega corporation responsible for the economy of the entire cosmos.'
- 'Interastral Peace Corporation: "With all due respect, is there anyone in the universe more enlightened than our chair, Qlipoth ? Qlipoth acquiesces in all our business decisions, never asking or questioning why. How great a privilege! How great a trust!"'
- 'Interastral Peace Corporation: To outsiders, the IPC is an enormous consortium advocating free trade. From a business perspective, the IPC is a business that issues money and monopolizes resources. From a startup perspective, the IPC is a selfless support group dedicated to the Aeon of Preservation .'
- 'Interastral Peace Corporation: When many astral citizens talk about the IPC, they talk about its ubiquitous merchandise and logo. It''s as if "The IPC exists whenever there is a transaction." In fact, almost all business transactions in the cosmos are based on the credit system created by the IPC.'
- 'Interastral Peace Corporation: If one were to compare interastral trade to a sports competition, the IPC would be the top athletes as well as the sports, the venue, and the rules themselves.'
- 'Interastral Peace Corporation: Its absolute dominance over wealth and relentless expansion has given the IPC the image of a conspiratorial business dictatorship. But the IPC pays little attention to lowly ambitions such as dictatorship, because its spirit hasn''t wavered since its creation:'
- 'Interastral Peace Corporation: Give everything to the Amber Lord, Qlipoth .'
- 'Interastral Peace Corporation: Today, the Interastral Peace Corporation is divided into seven major departments. Perhaps the word "department" can no longer encompass the astounding scale of this pan-galactic enterprise.'
- 'Interastral Peace Corporation: In actuality, every IPC department would often control dozens or even hundreds of civilized worlds of various scales and have billions of workers employed in a hereditary manner, let alone the countless masses that are affected by the impact of its commercial activities.'
- 'Interastral Peace Corporation: The Marketing Development Department is engrossed in reaching more star systems to preach the calling of Qlipoth . At it same time, it is also responsible for pulling newly emerging worlds into the universal commercial sphere.'
- 'Interastral Peace Corporation: It is said that its chairman, Oswaldo Schneider , is a former Nameless who still holds strongly to the will of Trailblaze after joining the IPC . People believe he will soon become a member of the Board of Trustees. All he''s missing is some experience and an empty spot.'
- 'Interastral Peace Corporation: When the Marketing Development Department finishes establishing relationships with a new world, the subsequent commercial dealings will be handed over to the Business Consolidation Department . This department is responsible for managing the IPC ''s Hyper-distant Delivery system.'
- 'Interastral Peace Corporation: They stock take specialty goods, set prices, and continuously maintain the IPC''s subsidiary facilities and goods inventory.'
- 'Interastral Peace Corporation: The Business Consolidation Department is the IPC''s biggest department. Its staff numbers amount to 45% of the headquarter''s total personnel.'
- 'Interastral Peace Corporation: The Strategic Investment Department has the second-best foresight in the IPC . Their investment will never be limited to short-term returns.'
- 'Interastral Peace Corporation: The Strategic Investment Department has an elite team of Non-Performing Asset Liquidation Specialists — the " Ten Stonehearts " — led by the mysterious director Diamond .'
- 'Interastral Peace Corporation: These individuals traverse the universe, actively liquidating the bad debts caused by the Cancer of All Worlds .'
- 'Interastral Peace Corporation: The Building Material Logistics Department is the oldest in the IPC . Its former name was "The Amber Lord ''s Support Team" and was restructured after Louis rose to prominence.'
- 'Interastral Peace Corporation: The current director of the department is the rotund fellow Taravan Keane — One of the rare verified Emanators of Preservation in the IPC, and one of the seven members of the Board of Trustees.'
- 'Interastral Peace Corporation: He shoulders the holy duty of shipping building materials to Qlipoth, and his grip on power only solidifies over time.'
- 'Interastral Peace Corporation: The Technology Department conducts thorough collaborations with the Intelligentsia Guild and turns the Guild''s scientific results into commercial projects.'
- 'Interastral Peace Corporation: Preferring the management practice by peer experts, the IPC acknowledges Director Yabuli ''s scientific aptitude and commercial instincts.'
- 'Interastral Peace Corporation: The associations between this young lady and the Council of Mundanites in the Intelligentsia Guild are often also inspires waves of speculation.'
- 'Interastral Peace Corporation: The Talent Motivation Department is responsible for recruiting, training, and transporting talented employees for the IPC . This department is also the medium through which many intergalactic projects communicate and collaborate with their respective stakeholders.'
- 'Interastral Peace Corporation: Moreover, the two directors of the Talent Motivation Department — Mtooyin Raj Zazzad and Yan Shiluo — collectively control an information network that covers the entire cosmos.'
- 'Interastral Peace Corporation: Their emissaries shuttle across the cosmos, befriending the major powers, and forming alliances and relationships with talents who are not yet willing to join the IPC — These "external aides" will demonstrate significant value in situations where the IPC is unable or unwilling to show its face.'
- 'Interastral Peace Corporation: The passage of time saw the rise of fall of many industries, with their influence and positions in the IPC ''s trade system also ebbing and flowing.'
- 'Interastral Peace Corporation: When one industry''s trade falls below a certain percentage threshold in pan-galactic commerce, it will be removed from the duties of the Business Consolidation Department and handed over to director Arita of the Traditional Project Department .'
- 'Interastral Peace Corporation: Once, a group of Aeonic faithful formed a logistical unit, moving materials such as stones, wood, gold, supernium alloys for infrastructure across worlds.'
- 'Interastral Peace Corporation: Eons passed in an instant and this logistical unit yet remains. In fact, they even grew to become the transgalatic business conglomerate Interastral Peace Corporation.'
- 'Xianzhou Alliance: The Xianzhou Alliance ( Chinese : 仙舟联盟 Xiānzhōu Liánméng , " Immortal Ship Alliance" ) is an ancient, space-faring civilization following the Aeon Lan and a major faction in Honkai: Star Rail .'
- 'Xianzhou Alliance: "Fight together against countless enemies. Be together through endless turmoil. Of the thousand lifespans encountered, I take but one sip and leave the rest to its fate."'
- 'Xianzhou Alliance: In an ancient era of legends, multiple Xianzhou ships were tasked with voyaging across the stars to search for the miracle medicine of immortality.'
- 'Xianzhou Alliance: The endless voyage took its toll on Xianzhou, wearing away its conviction and shape over the long years, until their eventual encounter with Yaoshi . However, all that the fruit of immortality brought upon them were sorrows, poverty, and endless war and death.'
- 'Xianzhou Alliance: It wasn''t until Lan , the Aeon of The Hunt , returned from the Abyss. Using gravity as bowstring and stars as arrows, Lan shattered the Ambrosial Arbor and put the wickedness of Abundance to an end.'
- 'Xianzhou Alliance: After Xianzhou returned to the righteous path, it formed an alliance under the guidance of The Hunt and formed a powerful army known as the Cloud Knights .'
- 'Xianzhou Alliance: The alliance''s goals were to patrol the world and eradicate all Abominations of Abundance , and put an end to the corruption of the undead.'
- 'Xianzhou Alliance: Over the years, the Xianzhou Alliance landed on a great number of worlds that used to enjoy the grace of gods. They eradicated countless undead abominations. Any civilization that worshiped Abundance had to consider the possible threat of the Xianzhou destroying their planet.'
- 'Xianzhou Alliance: This kind of deterrence was precisely what the Xianzhou Alliance is hoping to be. They want to be seen as the constant red line for those greedy for immortality, becoming the price that none dares to pay.'
- 'Xianzhou Alliance: The Xianzhou Alliance was established by the Xianzhou Natives, who were present on all ships. After being rescued from their dying homeworld, the Vidyadhara established themselves on at least five of the six ships, with each of the ships having a High Elder, barring the Xuling.'
- 'Xianzhou Alliance: After Glaciator Marum signed the covenant with the Xianzhou Alliance on behalf of the Vidyadhara and the five High Elders, they agreed to keep watch over the respective plaguemarks of each Xianzhou ship, and the Alliance granted the Vidyadhara the Fanghu to rule as an autonomous ship.'
- 'Xianzhou Alliance: After the Alliance saved them from enslavement under the borisin , the Foxians became the third major race across the Alliance, becoming majority race on the Yaoqing.'
- 'Xianzhou Alliance: The largest population of heliobi can be found on the Zhuming, as they are continuously born from the Flint Emperor .'
- 'Xianzhou Alliance: These harmless heliobi are captured before they come into contact with emotions and tamed with gentle dreams before they are matched with various objects in the Zhuming, such as swords, lamps and vehicles.'
- 'Xianzhou Alliance: Other heliobi can be found at Artisanship Commission forges such as the Luofu''s Creation Furnace , though they had temporarily escaped and were contained at Fyxestroll Garden .'
- 'Xianzhou Alliance: The Zhuming regards the Disatta as loyal allies, respecting their tenacity and strength, while being grateful for their selfless sacrifice as they are the only ones able to survive the Flint Emperor''s hypergravity field.'
- 'Xianzhou Alliance: The Xuling, at some point, became a ship completely populated and staffed by Aurumatons.'
- 'Xianzhou Alliance: The Luofu is arguably the most well known Xianzhou flagship in the Alliance to the cosmos, excelling in diplomacy and commerce. People arrived at the Luofu to seek medical treatment, study, and trade, with throngs of visitors filling the docks.'
- 'Xianzhou Alliance: Residents often take pride in their hospitality and etiquette.'
- 'Xianzhou Alliance: They tend to refer to outworlders as "honorable guest from afar" or "visiting traveler." Though warfare has receded, the Luofu has not relaxed its watch against the Denizens despite the perceived laid-back disposition of it''s residents.'
- 'Xianzhou Alliance: Out of the six flagships, the Xianzhou Yaoqing is known for its military prowess and has long been standing at the forefront of the most intense combat missions. Foxians make up the majority of the Yaoqing and are its dominant culture.'
- 'Xianzhou Alliance: Still, the Yaoqing maintains its own cultural aspects such as foxian gents on the streets telling the stories of the Cloud Knight martyrs. Pacify Play is a traditional theater performance of the Yaoqing Foxians.'
- 'Xianzhou Alliance: The foxians of the Yaoqing are known for their adventuring flying families.'
- 'Xianzhou Alliance: The Zhuming has been known for its exquisite craftsmanship and alchemy techniques since it first set sail during the Primeval Imperium era. Regardless, the fire of innovation and knowledge burning in the hearts of the craftsmen on board has never been extinguished.'
- 'Xianzhou Alliance: The Zhuming is less conservative when it comes to heliobi compared to the Luofu. If a heliobus on the Zhuming is encountered that was capable and had no harmful intentions, it would definitely not be sealed up.'
- 'Xianzhou Alliance: According to Qingzu , Zhuming residents love to play with fire, and it is said the Xianzhou Zhuming will continue to ally with fire, journey with fire, and share its destiny with that of the fire.'
- 'Xianzhou Alliance: The Fanghu is an autonomous dominion of the Vidyadhara, and thusly has different customs, culture, and social structures from other Xianzhou ships. Vidyadhara roaming around the Miniature Myriads and Pearlkeepers meditating are common sights on the Fanghu.'
- 'Xianzhou Alliance: The sound of belligerent dragon chants echoes through space from time to time.'
- 'Xianzhou Alliance: The Luofu travels between densely populated interstellar regions, trading and conducting cultural exchange between different worlds, signing agreements with the Interastral Peace Corporation , and helping many worlds ravaged by the Denizens of Abundance to rebuild their ecosystem.'
- 'Xianzhou Alliance: Numerous guilds under the Sky-Faring Commission''s administration conduct trade and bring in business for the Luofu. Starskiff Haven , the official entrance of Luofu and its largest port, is also governed by the Sky-Faring Commission.'
- 'Genius Society: The Genius Society is an intergalactic organization, whose 84 members are personally selected by Nous the Erudition from across the cosmos, and is a major faction in Honkai: Star Rail .'
- 'Genius Society: "Into the hallowed halls step pride, ardor, and reason, traversing the length of a corridor etched with the inscription of knowledge and truth, transmuting into the embodiment of lowliness, apathy, and frenzy."'
- 'Genius Society: Nous stays in a corner of the cosmos, working out the equations of the universe made up of trillions of variables and deriving the unknown laws of imaginary numbers. Once in a while, a spark of intelligence flashes in a mortal world.'
- 'Genius Society: The Aeon of Erudition sends a signal to its source, inviting geniuses to join in the search for answers to the universe.'
- 'Genius Society: Many people misinterpret the signal, thinking the invitation to the Genius Society merely represents the favor and approval of the Aeon.'
- 'Genius Society: Then, they proudly continue to devote themselves to their studies, unaware that the solution to the problems that they have spent their whole lives searching for had already been solved by Nous thousands of years ago.'
- 'Genius Society: There are also those who rejoice, thinking they have already reached greatness and had created priceless asset of civilization with their diligence and wisdom. They were sure that their life''s achievements deserve Nous''s approval.'
- 'Genius Society: These geniuses were eager for a response from Nous, but the Erudition has no time to appreciate the insignificant achievements of mere mortals. THEIR silence was deafening.'
- 'Genius Society: The Genius Society is a gathering of geniuses across the cosmos who had drawn the attention of Nous the Erudition, founded by first member Zandar One Kuwabara . Many often misinterpret the invitation as only an approval.'
- 'Genius Society: The few who are able to understand the Aeon''s intentions are given a key to the halls of the Nous Temple . Those who pass through the gates seek guidance from Nous and leave behind their legacy to never return.'
- 'Genius Society: Besides their intellect, members of the society are also known for how much they differ from each other, whether it be in terms of background, ideals, or goals.'
- 'Genius Society: Most geniuses in the society are lone wolves, asocial, and people with social disorders whom refuse to communicate with each other, and only a few — such as Aiden , Elias Salas , and Herta — are willing to share their findings and use their talent to contribute to the advancement of the cosmos, preferring to indulge in their research for enjoyment.'
- 'Genius Society: Some are even lunatics, like Rubert I , who dedicated itself to eradicate all organic life forms in the universe, or Polka Kakamond , known for killing fellow members of the society who approach the borders of the Circle of Knowledge .'
- 'Genius Society: Despite the lack of structure within the organization, it "has its own rules", with one of those being that the Genius Society won''t interfere with each other''s research topics.'
- 'Genius Society: Due to the tampering of the History Fictionologists and the preference for solitude among most of its members, the history of the organization is mostly shrouded in mystery.'
- 'Masked Fools: The Masked Fools are an intergalactic organization devoted to Aha , the Aeon of Elation . They operate out of The Tavern .'
- 'Masked Fools: "Even an organization like the Masked Fools sing praises of their Aeon. The Aeon will never give you up, never let you down, or run around and desert you. THEY will never make you cry, say goodbye, or tell a lie and hurt you."'
- 'Masked Fools: The Masked Fools tell a parable of the birth of their beloved Aeon .'
- 'Masked Fools: When the Aeon of Elation climbed to the highest branch on the Tree of Existence , THEY saw the cold and despicable void, the stars operating like machinery, and how the meaning of all things bows before nothingness.'
- 'Masked Fools: THEY continued looking until THEY saw a baby fall to the ground and cry because it had been wronged. The Aeon burst into laughter, laughter so clear it tore through the cold universe and still reverberates through the universe today.'
- 'Masked Fools: The Fools believe that the truth of the world is a joke, and that the ultimate meaning of all things lies in mere laughter. The universe is merciless, but there is joy to eliminate pain, dilute sorrow, resist nihilism, and heal wounds.'
- 'Masked Fools: Laughter, the gift of intelligent races, is the only answer.'
- 'Masked Fools: The Masked Fools possess the most radical philosophy out of all the followers of Elation: they believe that the ultimate truth of the world is nothing but a joke, and the profound meaning of everything lies in simple laughter.'
- 'Masked Fools: While they enjoy pursuing and obtaining joy, each member appears to have their own limits in doing so. They leave a trail of trouble and chaos wherever they go, and their goal is to bring about change in the stagnant pools of life.'
- 'Masked Fools: Each member possesses a unique " mask " belonging only to them, a "mask" bestowed by Aha. These masks allow them to obtain power from their Path .'
- 'Masked Fools: Caution is advised when interacting with individuals wearing masks, as their true intentions can be challenging to discern from their words and actions.'
- 'Masked Fools: Hosea Lazaro mentions having spent a great deal of time in bars run by the Fools. The Strange Plant claims that a Masked Fool has infiltrated Herta Space Station , and that they''re planning something huge.'
- 'Masked Fools: When the Astral Express Crew landed on Jarilo-VI , Sampo was the first person to greet them. He later introduced the crew to Wildfire and guided them between the Overworld and Underworld .'
- 'Masked Fools: On the Xianzhou Luofu , the Trailblazer encountered a Masked Fool named Zhongshan who sabotaged and stirred up chaos among the members of the Unshackled .'
- 'Masked Fools: The Masked Fool Sparkle , among several others, was invited to the Charmony Festival on Penacony in 2158 AE. She assisted Aventurine and the Astral Express Crew in uncovering the conspiracy within The Family .'
- 'Masked Fools: It is later revealed that she was hired by Stellaron Hunter Silver Wolf to ensure that Firefly ''s prophesied three deaths would happen in the safest way possible.'
- 'Masked Fools: 3 Characters match the category selection:'
- 'Garden of Recollection: The Garden of Recollection , often shortened to just the Garden , is a faction which worships the Aeon of Remembrance , Fuli . The faction''s Memokeepers take on the form of Memetic Entities and travel to different worlds to gather memories.'
- 'Garden of Recollection: "For people who spend their lives in the desert, even the fleeting memory of aquatic life is priceless."'
- 'Garden of Recollection: To think is to exist, and memories are proofs of that. All things that make up the material world will eventually perish, but they can live on in another way — through Remembrance .'
- 'Garden of Recollection: Contrary to popular belief that memory is mixed with the imaginary, Memokeepers from the Garden of Recollection believe reality and imagination to be a myth. What is absolutely real and immortal in the universe that is constantly reincarnating?'
- 'Garden of Recollection: Even stars die and black holes evaporate. On a cosmic scale, they vanish in a breath. In this flood of time and life, the only treasure is the memory that proves the existence of people.'
- 'Garden of Recollection: As messengers for the Remembrance, Memokeepers surrender their worldly bodies and traverse the universe in the form of memories. The form their bodies take is known as a dharmakāya, a shell containing their consciousness.'
- 'Garden of Recollection: These forms are far more resilient than other memetic entities, as it protects them from the forgetful nature of Remembrance and the corrosion of Enigmata .'
- 'Garden of Recollection: Their goal is to search the stars on Fuli''s behalf to find the most precious memories, and to make sure the universe is remembered in the face of the Destruction .'
- 'Garden of Recollection: Memokeepers travel to worlds alone.'
- 'Garden of Recollection: Using their powers to prevent the inhabitants from knowing of their presence, they only reveal themselves if they come across someone who has the potential of being a Memokeeper, after which they will reveal themselves and offer the chance for recruitment.'
- 'Garden of Recollection: Due to their elusive nature, Memokeepers of the Garden of Recollection have gained a fearsome reputation.'
- 'Garden of Recollection: Memokeepers follow an extremely strict set of rules in order to ensure that their powers are not misused, and are specifically trained to resist looking into, stealing, controlling, or restoring memories.'
- 'Garden of Recollection: Violating this rule results in their immediate termination, though a few members are given an exception to this rule, known as "Memosnatchers."'
- 'Garden of Recollection: Memory Bubbles are a technology developed by the Garden of Recollection to preserve memories. The Garden created a Sentiention membrane to keep the memories wrapped up in it like a bubble, making it easy to carry memories around.'
- 'Garden of Recollection: Similarly, Light Cones are technology that preserve memories created by the Garden, but on a more advanced scale. Because they also preserve experiences and abilities, this technology is under level-2 restriction by the Interastral Peace Corporation .'
- 'Garden of Recollection: The memories contained in Light Cones become clearer when infused with substances such as Sparse Aether , Condensed Aether , and Refined Aether .'
- 'Garden of Recollection: While many of the faction hold onto the core beliefs of Remembrance, there exists an off-shot of Memokeepers known as "The Cremators" who don''t believe in every memory being valuable. The Cremators will destroy memories they find unimportant in order to "clear out the garbage."'
- 'Garden of Recollection: The Memosnatchers, according to Herta , are the radicals of the Garden of Recollection. They have the ability to avoid some of the rules of the Garden of Recollection and aren''t completely aligned with other Memokeepers.'
- 'Garden of Recollection: It is widely agreed that the Garden of Recollection was founded by one or several Pure Children of Anāsrava .'
- 'Garden of Recollection: Memokeepers were likely around sometime before the Swarm Disaster . Some of them managed to seal a Shadow of IX inside a Memory Bubble and took it aboard a Mourning Actor gondola.'
- 'Garden of Recollection: It remained there until the Swarm Disaster, where the gondola would find itself entering the Elydichna Starzone, and the Self-Annihilator who caused Tayzzyronth ''s ascension would board the gondola.'
- 'Garden of Recollection: The Self-Annihilator identified the Memory Bubble as his "lost self," and after it was broken and the Shadow of IX released, he embraced the Shadow, killing him. After his death, the Shadow of IX was resealed by the Arbitrators .'
- 'Garden of Recollection: After the Swarm Disaster, Elias Salas invented the Synesthesia Beacon , which he later sold the rights for to the Intelligentsia Guild . During that time, the Interastral Peace Corporation terminated its existing contract with the Garden to make way for the new technology.'
- 'Garden of Recollection: When Boothill received a new body to begin his hunt against Oswaldo Schneider , who ordered a genocide on his people, he broke into a local Garden of Recollection branch to find memories related to his homeworld.'
- 'Garden of Recollection: He unintentionally destroyed multiple Memory Bubbles in the process, and the Memokeepers scrambled to recover as much rare and precious memories as possible before kicking him out.'
- 'Garden of Recollection: In the end, Boothill still managed to learn about Oswaldo Schneider, and the Garden of Recollection still hold animosity towards him, even believing Boothill to be responsible for the Holstein Aphasia.'
- 'Garden of Recollection: After learning of the Trailblazer ''s existence, the Garden of Recollection took an interest in them due to their ability to hold a Stellaron , and were curious to see how they would influence the universe.'
- 'Garden of Recollection: At some point in time, the Garden of Recollection discovered Amphoreus through the reflections of their mirror, adding it to their private collection.'
- 'Garden of Recollection: Black Swan , who figured out the Garden''s intentions of learning the secrets of Amphoreus to remodel other worlds into a similar form, decided to approach the Astral Express Crew to trailblaze toward the planet, masking her true goal as simply being her desire to collect the memories of Amphoreus.'
- 'Garden of Recollection: A Memosnatcher later trailed behind Herta to steal Nous '' memories by tampering with the Audience System to bait Herta into leading the Memosnatcher to THEM.'
- 'Galaxy Ranger: The Galaxy Rangers is a voluntarily formed group that travels around the cosmos to uphold justice for the locals out of the belief that benevolence and justice must be upheld by personal action.'
- 'Galaxy Ranger: "The ultimate fighter dreams only of the stars."'
- 'Galaxy Ranger: Not all devotees of The Hunt hate Abundance . Such a group of talented rangers exists out there.'
- 'Galaxy Ranger: This group admires Lan ''s policy of using violence against violence and the Aeon ''s swift decisiveness regarding punishment, believing the benevolence and justice of the universe need to be upheld via personal action.'
- 'Galaxy Ranger: The Galaxy Rangers formed into a group of heroes, walking the Path of The Hunt, and roam the universe thanks to the blessings of the Aeon. They went from planet to planet upholding justice for the locals, hunting down evil, then embarking on new journeys.'
- 'Galaxy Ranger: The successful assassination of a Lord Ravager , Zulo , first brought the Galaxy Rangers their fame. And many years later, a Ranger thwarted the atavistic experiment of the 64th member of the Genius Society , Dr. Primitive .'
- 'Galaxy Ranger: But after that, these Galaxy Rangers gradually faded out of sight in the cosmos. Rumor has it that they fell victim to Dr. Primitive''s vengeance.'
- 'Galaxy Ranger: While members of the Galaxy Rangers hail from different worlds, and have all kinds of personalities and traits, each of them are highly skilled, despises evil, and follows Lan and the Path of The Hunt .'
- 'Galaxy Ranger: They carry a balance scale with them at all times and believe justice in the universe needs to be achieved through individual deeds. They are always accompanied by the song and the sound of horns.'
- 'Galaxy Ranger: They pursue justice for those they encounter along the way and shower them with wines and songs.'
- 'Galaxy Ranger: According to Aventurine , the Rangers "come and go like shadows," and there''s little communication between them.'
- 'Galaxy Ranger: Boothill doesn''t think the Galaxy Rangers can even be considered an "organization" to begin with as they all follow their own path along The Hunt, with their own resolute sense of righteousness, and don''t share so-called universal values.'
- 'Galaxy Ranger: The Galaxy Rangers don''t need a form of shared faith. What brings them together is a shared bottom line: Never bully the weak, never kill the innocent. These oaths aren''t beliefs, but rather the fundamental bottom line that one must never cross as a person.'
- 'Galaxy Ranger: As Galaxy Rangers, they abide by a common principle and strictly adhere to the bottom line.'
- 'Galaxy Ranger: The Galaxy Rangers have relics in the form of a bullet that appear meaningless to anyone other than a Galaxy Ranger, that can only fulfill its purpose when returned to its rightful owner.'
- 'Galaxy Ranger: This is because it''s a burial artifact, worthy only of a hero who has served the Galaxy Rangers with honor.'
- 'Galaxy Ranger: The relic is shot out like a flare and when it is used, it means the fall of a hero, and in the direction it''s light falls, Galaxy Rangers will come from all corners of the Cosmos, driven by a shared purpose, without questioning the cause or counting the cost.'
- 'Galaxy Ranger: The Galaxy Rangers rose to prominence following the successful assassination of Lord Ravager Zulo in the operation later known as "Operation Zulo."'
- 'Galaxy Ranger: Prior to the operation, Galaxy Rangers had saved the life of Breukelen Tiernan , a Nameless who fought for Penacony ''s independence from the Interastral Peace Corporation .'
- 'Galaxy Ranger: Alongside Loretta , Tiernan remains one of the few known Galaxy Rangers to have directly battled Zulo, though he too vanished shortly afterward.'
- 'Galaxy Ranger: Led by La Mancha, now known as Ashveil, the Rangers launched an assault on Zulo, who was using Kronstadt as a breeding ground for his forces.'
- 'Galaxy Ranger: To gain an advantage, the Rangers manipulated the remnants of the Swarm , exploiting their lack of intelligence and herding them toward Zulo''s fleet. Despite this tactic, the Galaxy Rangers were ultimately overwhelmed by Zulo''s legion.'
- 'Galaxy Ranger: As a final measure, Ashveil unleashed the "shadow" within his right arm, which consumed Zulo, the Swarm remnants, and many Galaxy Rangers alike. Although the operation succeeded in eliminating Zulo, it came at a devastating cost.'
- 'Galaxy Ranger: In the aftermath, Ashveil incurred the ire of his fellow Rangers, most notably the other two Lead Hunters, "Heartless Bear" and "One-Eyed Owl," who accused him of dragging the Rangers into ruin for the sake of a personal vendetta.'
- 'Galaxy Ranger: Following the incident, Ashveil quietly disappeared.'
- 'Galaxy Ranger: Riding the success of "Operation Zulo", the Galaxy Rangers would next defeat the Thirteenth Legion of Gaius the Usurper, the successor of Genius Society Member #27, Emperor Rubert ''s will. However, their means of accomplishing this are unknown.'
- 'Galaxy Ranger: Many years later, the Galaxy Rangers would thwart the 64th member of the Genius Society, Dr. Primitive , and protect the Thousand-Tree Greenwood on Vonwacq .'
- 'Galaxy Ranger: For this, some claim that many Galaxy Rangers would suffer from Degeneration Flow and lose their combat capabilities resulting in the Galaxy Rangers having to cut back on their efforts. Dr.'
- 'Galaxy Ranger: Primitive however took an unknown form of revenge on the Galaxy Rangers, further pushing the Galaxy Rangers into obscurity.'
- 'Galaxy Ranger: Presently, the Galaxy Rangers and Dr. Primitive are closely intertwined, and even after his rumored death, there are still Rangers who hunt for him. Once, an individual believed to be a Galaxy Ranger sold Dr.'
- 'Herta Space Station: Herta Space Station is the first accessible world in Honkai: Star Rail . It is unlocked during Trailblaze Mission Chaos In the Deep .'
- 'Herta Space Station: It is a space station founded by The Herta , member #83 of the Genius Society , and orbits a planet named the Blue . Researchers from numerous planets work there, most of whom are loyal followers of Herta.'
- 'Herta Space Station: Qualifying for a researcher role on the Herta Space Station is a difficult process and a highly cherished goal within the scientific community.'
- 'Herta Space Station: The following Mission chapters take place on this world:'
- 'Herta Space Station: Not content with the laws of the common world, Herta of the Genius Society set her sights on the unexplained existences of the cosmos, expecting those distant mysteries to satisfy her curiosity.'
- 'Herta Space Station: To this end, Herta led the establishment of a museum-like starship and launched it into orbit, starting the research to "seal all strange existences among the stars." That was how the famous Herta Space Station was born.'
- 'Herta Space Station: Nowadays, the space station possesses innumerable Curios and is a veritable space museum. A great number of researchers also live on the station.'
- 'Herta Space Station: They continuously collect relics and Curios all over the cosmos, record their appearances and functions, establish systematic methods to observe and study them... ultimately finding even more confounding enigmas from their studies. That in fact, was Herta''s initial goal.'
- 'Herta Space Station: The Master Control Zone can be detached from the station, capable of traversing the Cosmos on its own. It serves as the brain of operations when attached to the main body of the space station.'
- 'Herta Space Station: On both sides of the master control zone and at its entrance is a huge wall consisting of numerous screens for surveillance. This system offers visuals on everything happening on the parameter of the space station with no blind spot.'
- 'Herta Space Station: The system also boasts a sniper platform with roadblocks, capable of handling unknown threats, and a defense projection platform that can generate an anti-gravity shield over the space station.'
- 'Herta Space Station: The watcher zone is used to monitor the real-time status of the station''s energy supply and the conditions of other zones.'
- 'Herta Space Station: Together with the master control zone, these two areas form the core of the space station, offering an integrated system with strong capacities for observing, monitoring, defense, and attack.'
- 'Herta Space Station: The Base Zone is the core section between the two-stage structure separating the starship and the space station. It is the section where researchers partake in their primary daily activities. The reception center is located in the base zone, at the back of the space elevator.'
- 'Herta Space Station: It is the first room to greet the station''s visitors. Many people come here to see its splendor for themselves, but they are not allowed any further, and can only watch the proud researchers with admiration.'
- 'Herta Space Station: The Medical Cabin is the medical facility and pride of the space station, said to be able to drag anyone back from the brink of death. Research projects in the station are always accompanied by unknown risks, and therefore the medical cabin is packed at all times.'
- 'Herta Space Station: The Storage Zone is used to house curios. Gigantic pathways can be found in the center, snaking through the upper and lower level rooms where different departments store their collections.'
- 'Herta Space Station: The Gallery of Shadow is Madam Herta''s personal gallery, sealed away all year round, and only Herta herself has access to entry.'
- 'Herta Space Station: To the researchers, the gallery is no more than something to base their stories on, but it was opened by the Stellaron Hunters in order to place the Stellaron being stored there inside the Trailblazer during the Antimatter Legion attack.'
- 'Herta Space Station: The Supply Zone is the logistics hub of the space station. It has all manner of resources stored within its confines, supervises an energy core, and its equipped with a fully established railway platform.'
- 'Herta Space Station: It stands as an essential junction for operations and maintenance aboard the space station.'
- 'Herta Space Station: If things ever got out of hand and the master control zone was doomed to be destroyed, researchers would take the evacuation route and rush towards the supply zone, where all the external relief ships are docked along the Railway Platform.'
- 'Herta Space Station: The Seclusion Zone used to be a major research facility for cutting-edge experimentation, offering convenient conditions for high-risk experiments conducted between the shuttles, laboratories, and the greenhouse.'
- 'Herta Space Station: The zone sealed off after Ruan Mei began to conduct her experiments, which resulted in a Swarm outbreak along with a clone of the Emanator of Propagation , Skaracabaz .'
- 'Herta Space Station: The Trailblazer investigated this zone on Ruan Mei''s behalf during one of her rare visits to the station, during which the clone emerged from the incubator and fought them. However, it died off after 56 seconds, unable to sustain its own existence.'
- 'Herta Space Station: While the Swarm still has a small presence in the area, it is now primarily occupied by Ruan Mei''s Creations , who mostly reside in the Breeding Ground and Pharmaceutical Room .'
- 'Herta Space Station: There are 2 Space Anchors in Master Control Zone :'
- 'Herta Space Station: There are 2 Space Anchors in Base Zone :'
- 'Herta Space Station: There are 4 Space Anchors in Storage Zone :'
- 'Herta Space Station: There are 3 Space Anchors in Supply Zone :'
- 'Jarilo-VI: Jarilo-VI is the second accessible world in Honkai: Star Rail . It can be accessed upon completing Trailblaze Mission chapter Today Is Yesterday''s Tomorrow .'
- 'Jarilo-VI: It is a frosted-over, previously isolated planet, originally cut off from the rest of the cosmos due to a planetwide Eternal Freeze caused by a Stellaron . Belobog currently stands as its final bastion where humanity thrives amidst the harsh climate.'
- 'Jarilo-VI: The following Mission chapters take place on this world:'
- 'Jarilo-VI: Historians often start the planetary history of Jarilo-VI from the War of the Gods thousands of years ago.'
- 'Jarilo-VI: The war between the eleven Perun States and the Veles Union Army scorched the land for years until an early spring completely changed the fortunes of war, and the Veles had a total victory.'
- 'Jarilo-VI: They praised the spring war god Jarilo for helping them eliminate their arch enemy, and praised the land with poems of the same name. The current name of the planet in the cosmos''s records — Jarilo-VI — may be a mistranslation that contains a poetry stanza number.'
- 'Jarilo-VI: When the mythological war was over, Jarilo-VI welcomed a long period of peace and developed from a hunter-gatherer society to one conducting space explorations. Unfortunately, Jarilo-VI was a planet with few resources.'
- 'Jarilo-VI: Intensive development brought top-tier technological advances to Jarilo-VI, but also brought an end to their history. Exhausted resources, the arrival of a Stellaron , and the appearance of the Eternal Freeze ...'
- 'Jarilo-VI: These various disasters completely annihilated Jarilo-VI''s glorious but short-lived civilization.'
- 'Jarilo-VI: Any lands engulfed by the Eternal Freeze surrounding Belobog were referred to as the Snow Plains. East of Belobog is a vast inland plain that contained a few dozen old territories on Jarilo-VI. Situated at the furthest east of the inland plain were some small settlements.'
- 'Jarilo-VI: Further northeast contains nothing but barren lands while southeast of the inland plain is a deserted region isolated by canyons. The path to Kandor Valley can be found in the Outlying Snow Plains west of Belobog.'
- 'Jarilo-VI: The mountain winds in the valley are usually the harbinger of a blizzard and it is advised to never stay in the canyon at night. West of Belobog lies a great ocean that is yet to be permanently encased in ice by the Eternal Freeze .'
- 'Jarilo-VI: Scattered among the northwestern part of the ocean are a few unnamed isles while the southwestern part of the ocean contains a region with an oceanic vortex.'
- 'Jarilo-VI: Located South of Belobog is a giant basin, where the whole region was decorated by many forests, lakes, and wetlands. Further south was a greenish lake with a warm climate before the Eternal Freeze.'
- 'Jarilo-VI: Among the fauna that resided there were dragonflies with wings that span six feet to giant crocodiles that weighed dozens of tons, though they are likely extinct like a majority of the Fauna on Jarilo-VI.'
- 'Jarilo-VI: Further southwest is an incredibly large forest comparable to the size of an ocean while southeast was a desert very close to lakes and forests with a peculiar landscape.'
- 'Jarilo-VI: There were a few named cities scattered in the desert that were likely sustained by trade fueled by the rich Geomarrow resources found underground.'
- 'Jarilo-VI: The Silvermane Guard Restricted Zone is located in northeastern Belobog, with the Corridor of Fading Echoes and Everwinter Hill located further north from there.'
- 'Jarilo-VI: Northwest of the Corridor of Fading Echoes are the Pillars of Creation , which contains a ruined city from before the Eternal Freeze and an Engine of Creation .'
- 'Jarilo-VI: North of Belobog are stunningly high mountain ranges that extend all the way further north. Located north of the northern mountains is a summit called Zarathustrazapala Iskandra, the tallest known mountain on Jarilo-VI.'
- 'Jarilo-VI: Northeast of the northern mountains were even more mountain ranges.'
- 'Jarilo-VI: Belobog''s subterranean Underworld is cavernous and has been extensively developed since the advent of the Eternal Freeze in order to mine the Geomarrow that keeps Belobog warm, and is sent to the surface via the Furnace Core .'
- 'Jarilo-VI: The Great Mine is the source of the largest known deposit of geomarrow. Several settlements have been founded in the Underworld since it''s inception, including Boulder Town , Rivet Town , Moletammerville and the Robot Settlement .'
- 'Jarilo-VI: Of these, only Boulder Town and the Robot Settlement are still viable to reside in.'
- 'Jarilo-VI: Among the flora on Jarilo-VI are several species of flowers including the Marquise , First Snow , Sunshine , Ball Peony , Rainbow and Summershade Bamboo.'
- 'Jarilo-VI: Some of the botany that is widely extinct on Jarilo-VI is preserved at Eversummer Florist in Belobog, and are considered luxury items.'
- 'Jarilo-VI: Fauna that have survived the Eternal Freeze into present day include the Olm , Plains Bear , Mimic Snow Slugs , Crystal Lizard , Rock Crab , Direwolf, Snow Radish Rabbit, Tuna and Frostweave Salmon .'
- 'Jarilo-VI: Though frostweave salmon are mostly bred inside Belobog''s city walls, their taste is miles off from the ones fished from the wilds outside the city. Well-preserved specimens from before the Eternal Freeze 700 years ago can be found.'
- 'Jarilo-VI: There are 3 Space Anchors in Administrative District :'
- 'Jarilo-VI: There are 2 Space Anchors in Outlying Snow Plains :'
- 'Belobog: Belobog is the sole remaining city on Jarilo-VI . It is divided into two regions: the Overworld and the Underworld .'
- 'Belobog: Traversing across the snow plains, you can get a full view of Belobog, the only spot on Jarilo VI [ sic ] that barely fits the definition of "a warm place." As the only remaining city with human civilization, Belobog has been given many noble titles: the last bastion of mankind against the Eternal Freeze , the land blessed by Plamya...'
- 'Belobog: Nearly a millennium ago, the blistering Eternal Freeze sealed human civilization in time. As sweeping winds and blizzards buried the world in a pale silver, only Belobog survived, thanks to the blessings from a protector. Although suffering in wind and snow, humans carry on.'
- 'Belobog: Most historians hold the opinion that the War of the Gods from millennia ago marks the start of Jarilo-VI''s planetary history.'
- 'Belobog: The wars fought between the eleven Perun States and the Veles Union Army scorched the land for years until an early spring drastically turned the tide of the war in the Veles'' favor, thus granting them a total victory.'
- 'Belobog: They then sang praises of the spring war god Jarilo for helping them eliminate their archenemy and went on to write a poem in the same name to celebrate these lands.'
- 'Belobog: The planet''s current name in the galaxy''s records — Jarilo-VI — might be a mistranslation of the name of a stanza in this poem.'
- 'Belobog: When the War of the Gods was over, Jarilo-VI welcomed a long period of peace, enabling them to develop from a hunter-gatherer society to one that could conduct spaceflight. Unfortunately, there simply weren''t enough resources on the planet to support its rapid development.'
- 'Belobog: While it was advancing in technology, it was also accelerating its own demise. Resource depletion, the advent of a Stellaron , and the descent of the Eternal Freeze... One calamity after another eventually annihilated Jarilo-VI''s glorious but short-lived civilization.'
- 'Belobog: Those who survived the Eternal Freeze were reduced to refugees who could only cower in corners, subsequently losing all memory and records of their planet''s former name, Jarilo.'
- 'Belobog: To shelter themselves from the cold, they built a sanctuary city known as Belobog, and thus managed to pass down the torch of civilization in this way.'
- 'Belobog: Due to its isolated and hazardous natural environment, Jarilo-VI lost contact with other worlds after the emergence of the Stellaron.'
- 'Belobog: When the Astral Express arrived at Jarilo-VI, a group consisting of the Trailblazer , March 7th , and Dan Heng ventured to the surface and discovered there was still a civilization fighting against the Fragmentum caused by the Stellaron.'
- 'Belobog: Throughout the Trailblaze Mission, the Astral Express successfully seals the Stellaron, though the Fragmentum still exists and poses a threat to the people of Belobog.'
- 'Belobog: Belobog would later reconnect with the rest of the universe after the IPC discovered that civilization still existed on the planet.'
- 'The Xianzhou Luofu: The Xianzhou Luofu ( Chinese : 仙舟「罗浮」 Xiānzhōu "Luófú" ) is the third accessible world in Honkai: Star Rail . It can be accessed upon completing Trailblaze Mission chapter In the Sweltering Morning Sun .'
- 'The Xianzhou Luofu: It is one of the six flagships owned by the Hexafleet of the Xianzhou Alliance . It sails like a one-way arrow through the galaxy, with the goal of eradicating the Denizens of Abundance . The Luofu stands out among the other ships for its medical treatment and trade.'
- 'The Xianzhou Luofu: People on the Luofu are considered laid-back compared to other ships.'
- 'The Xianzhou Luofu: The following Mission chapters take place on this world:'
- 'The Xianzhou Luofu: Xianzhou Luofu is one of the six flagships of the Xianzhou Alliance . It sails in the endless ocean of stars like a one-way arrow, shooting toward the destined enemy of the Lord of The Hunt .'
- 'The Xianzhou Luofu: After the war with the Denizens of Abundance , the Luofu traveled between densely populated interstellar regions, trading and conducting cultural exchange between different worlds.'
- 'The Xianzhou Luofu: They signed agreements with the Interastral Peace Corporation , and helped many worlds ravaged by the Denizens of Abundances to rebuild their ecosystem. People arrived at the Luofu to seek medical treatment, study, and trade, with throngs of visitors filling the docks.'
- 'The Xianzhou Luofu: From the outside, the Luofu resembles an enormous starskiff , its deck covered with several large, connected domes, each containing a different delve of the ship.'
- 'The Xianzhou Luofu: Three-quarters of the way down the hull is a large ring which circles nearly the entire ship, save for a gap at the top. Floating between this gap is the Jade Gate, the main point of entry and exit for anyone visiting the massive ship.'
- 'The Xianzhou Luofu: The inside of the Luofu is composed of delves which total space exceeds the ship in size, made possible due to the Xianzhou''s space-folding technology. These delves all vary in size and shape, all on a scale too large for any normal ship to contain.'
- 'The Xianzhou Luofu: Some of the delves hold up entire residential and commercial districts, such as Exalting Sanctum , while others contain vast luxuriant prairies like the Ever-Hunt Plains, which hosts fauna such as monkeys and fawn.'
- 'The Xianzhou Luofu: The Xianzhou rears several types of animals in the Ever-Hunt Plains, such as the Fungus Boar, Yellow Boulder , Tuskpir , Gentle Halcyon , and Downy Antler .'
- 'The Xianzhou Luofu: Depth crawlers were a type of creature that was similar to void song whales that once lived on the Luofu, but have been extinct for thousands of years.'
- 'The Xianzhou Luofu: While plants of the Tian Dong genus typically grow on land, Tian Dong plants of Scalegorge Waterscape stand out by extensively inhabiting the coastal areas of the Lunarescent Depths.'
- 'The Xianzhou Luofu: Scalegorge alginate, Lunarescent Sea mint, and Dragon Scale Coral are also harvested there for medicinal purposes.'
- 'The Xianzhou Luofu: Strange planets can be seen high in the sky, though some of them may be a projection of the delve''s artificial sky dome. The Realm-Keeping Commission ''s weather pavilion manages the environmental conditions on the Luofu, including the artificial wind, clouds, rain, and fog.'
- 'The Xianzhou Luofu: Heat is extracted from the core of the planet the ship is carrying to keep some of the delves warm.'
- 'The Xianzhou Luofu: The visible space in the bustling skyport of Central Starskiff Haven is enough to fill up the entire Luofu. The bustling street of Starwatcher Avenue can be found here, where shops line the road for as far as the eye can see, and their lights are lit for perpetuity.'
- 'The Xianzhou Luofu: The Sky-Faring Commission ''s headquarters on the Luofu is the Palace of Astrum , which also acts as the ship''s bridge. Cloudford is the trade cargo port of the Loufu. With the arrival of numerous Outworlders, Starskiff Haven is alive with people from all walks of life.'
- 'The Xianzhou Luofu: Goods from various worlds are delivered by transport starskiffs and unloaded at Cloudford, and every day it unceasingly handles huge amounts of port traffic.'
- 'The Xianzhou Luofu: Starskiffs on the Luofu are manufactured in Stargazer Navalia . Aurum Alley is the Exalting Sanctum''s signature food street where tourists come to enjoy delicious food, from traditional dishes to roadside snacks, and experience street culture.'
- 'The Xianzhou Luofu: The freight dock managed by the Aurum Alley Merchant Guild is mainly used for distributing commodities and logistics transportation.'
- 'The Xianzhou Luofu: Fyxestroll Garden is garden delve created centuries ago by Foxian crafters temporarily occupied by the Ten-Lords Commission as the imprisonment site for heliobi that escaped from the Artisanship Commission ''s Creation Furnace .'
- 'The Xianzhou Luofu: The Divination Commission hosts the Luofu''s Matrix of Prescience Ultima . Conclave Hall is the official location in the Divination Commission delve where issues are discussed publicly. The Seat of Divine Foresight is office of the Arbiter-General of the Luofu.'
- 'The Xianzhou Luofu: The Luofu''s Alchemy Commission borders the Vidyadhara delve of Scalegorge Waterscape, which hosts the sealed entrance to the Ambrosial Arbor , the Luofu''s Plaguemark .'
- 'The Xianzhou Luofu: The Alchemy Commission''s medical texts are kept in the Elixir Research Terrace , a building looking out over the sea. Medicine and traders flock to Healer''s Market . In the past, only Elixir Seekers with permits could enter here to buy divine medicines.'
- 'The Xianzhou Luofu: Healers gather to conduct medical research in the Medicine Bureau . The tree in its garden is one of the Ambrosial Arbor''s roots.'
- 'The Xianzhou Luofu: A statue of Yubie , the 91st incarnation of Imbibitor Lunae , can be found at Dragonvista Rain Hall , which seats the entrance to the Ancient Sea Palace Ruins .'
- 'The Xianzhou Luofu: The enormous dragon palace of the Vidyadhara is buried in the seafloor valley, along with many Vidyadhara eggs preparing for hatching-rebirth.'
- 'The Xianzhou Luofu: Hindered by the seal, the Ambrosial Arbor''s roots curl into a dragon-shaped wood gall at the Palace Ruin Depths , and no longer actively grow. Desalinated Lunarescent Seawater and Scalegorge Spring Water are potable.'
- 'Penacony: Penacony , also known as the " Planet of Festivities ", is the fourth accessible world in Honkai: Star Rail . It can be accessed upon completing Trailblaze Mission chapter Karmic Clouds Faded, War Banners Folded .'
- 'Penacony: It is a planet administered by The Family within the Asdana star system.'
- 'Penacony: The following Mission chapters take place on this world:'
- 'Penacony: The Planet of Festivities in the Asdana star system , also known as Land of the Dreams.'
- 'Penacony: A luxurious hotel positioned above the fathomless sky, Penacony is also a vacation spot where interstellar celebrities party the days away and the affluent from diverse words revel in lavish ventures.'
- 'Penacony: People flock here in search of dreams they''ve longed for or have already buried, and through Dreampools in the hotel are transported to a realm of dreams where everything can come true.'
- 'Penacony: Rarely do guests pay attention to Penacony''s heavy past. A millennium ago, it was a frontier prison established by the IPC .'
- 'Penacony: Exiled prisoners must survive an arduous journey across vast distances to reach this location, and are then forced to take up a duty: To mend the leak through which memoria seeps into the galaxy.'
- 'Penacony: As they labor while being exposed to memoria, the prisoners gradually discovered themselves entering a captivating shared dream world, where they obtained a single shared desire — freedom.'
- 'Penacony: After the eruption of the Cancer of All Worlds , the ownership of the Frontier Prison changed hands. Historical records related to this struggle are scarce and often questionable.'
- 'Penacony: However, some accounts clearly state that with the assistance of various factions - including the Mourning Actors , the Masked Fools , the Nameless , and the Omen Vanguards - the prisoners emerged as the new rulers of this nascent realm.'
- 'Penacony: Sounds of discord could then periodically be heard during the subsequent times when it became a land of exiles.'
- 'Penacony: It was only when The Family descended and took control of the Dreamscape that Penacony experienced unparalleled and explosive prosperity, transforming into a renowned cosmic resort.'
- 'Penacony: Although called the "Planet of Festivities", the actual physical structure of Penacony in reality is that of a colossal artificial space station-like megastructure which houses The Reverie Hotel , surrounded by two small Alderson disks orbiting it.'
- 'Penacony: The alderson disks have several landmasses and bodies of water, which were said to be once barren deserts.'
- 'Penacony: City buildings can be seen jutting out on both from the "top" and "underside" of the alderson disks. Charmony Doves are a species of bird that inhabit Penacony.'
- 'Penacony: Penacony is located in the Asdana, a star system brimming with memoria, which has historically been one of the Macro Voids that leaked out from the Memory Zone. The memoria concentration surrounding Penacony is above normal levels.'
