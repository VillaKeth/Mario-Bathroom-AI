- 'Honkai: Star Rail: The game has a space-themed limited open world environment and turn-based combat system, with a gacha monetization system for players to obtain Characters , Light Cones , and other resources. The game can only be played with an internet connection.'
- 'Honkai: Star Rail: It is the fourth installment in the Honkai series, following Honkai Impact 3rd , and uses both new characters and alternate versions of existing characters from its predecessors.'
- 'Honkai: Star Rail: The game released worldwide on April 26, 2023, for iOS, Android, and Microsoft Windows. It released for PlayStation 5 on October 11th, 2023 globally.'
- 'Honkai: Star Rail: Players, dubbed "Trailblazers," can explore the vast galaxy and meet over 50 companions, new and familiar faces alike.'
- 'Honkai: Star Rail: The game features a turn-based combat system where players can swap up to four individual characters in a team with unique skills that can produce various effects to turn the tide of combat.'
- 'Honkai: Star Rail: Each character follows one of nine playable Paths that categorizes them based on their combat roles and abilities. These Paths include Destruction , The Hunt , Erudition , Harmony , Nihility , Preservation , Abundance , Remembrance , and Elation .'
- 'Honkai: Star Rail: Additionally, characters are assigned with one of seven Types that deal matching elemental damage. The elemental Types are Physical , Fire , Ice , Lightning , Wind , Quantum and Imaginary .'
- 'Honkai: Star Rail: These types are assigned to Enemies called Weaknesses, which can be exploited by using the same type.'
- 'Honkai: Star Rail: Characters possess unique combat skills and abilities that can be upgraded using the Traces skill tree system. Battles occur in rounds, where players select actions such as Basic ATKs , Skills , and Ultimates .'
- 'Honkai: Star Rail: Generally, using a Skill will consume a set number of Skill Points, while using Basic ATKs will recover Skill Points. Ultimates, on the other hand, can be used when a character''s Energy is fully charged.'
- 'Honkai: Star Rail: Players can further enhance characters'' combat abilities by equipping them with a Light Cone and Relics . Light Cones enhances characters'' stats and grant a passive ability to characters whose Path matches that of the Light Cone.'
- 'Honkai: Star Rail: Relics give additional effects when paired with their counterparts, called a "set".'
- 'Honkai: Star Rail: Players can venture into limited open-world areas with scattered Treasures that reward them with items, Space Anchors that allow them to teleport to different areas and restore health, and interactable puzzles.'
- 'Honkai: Star Rail: Instances such as Calyxes , Stagnant Shadows , Caverns of Corrosion , and Echoes of War are found across the areas, where players can obtain certain materials needed for character development.'
- 'Honkai: Star Rail: Once characters are properly geared, players can choose to enter special combat game modes such as Simulated and Divergent Universe , the Forgotten Hall , Pure Fiction , Apocalyptic Shadow , and Anomaly Arbitration to gain various rewards.'
- 'Honkai: Star Rail: Additionally, materials can be synthesized using the Omni-Synthesizer to produce Consumables that can provide buffs, and Character Ascension Materials .'
- 'Honkai: Star Rail: Honkai: Star Rail was first announced on October 5, 2021, during the Starfire Sonorant concert for Honkai Impact 3rd . The game experienced several Closed Beta Tests (CBT) throughout its development, with the first on October 27, 2021.'
- 'Honkai: Star Rail: A second Closed Beta Test was held on May 25, 2022, and the final Closed Beta Test was held on February 10, 2023.'
- 'Honkai: Star Rail: On March 24, 2023, it was officially announced that Honkai: Star Rail would be released on April 26, 2023, for iOS, Android, and Microsoft Windows. On the same day, it was also announced that Honkai: Star Rail would be coming to PlayStation.'
- 'Honkai: Star Rail: On April 26, 2023, the game launched worldwide on iOS, Android, and Microsoft Windows, and has subsequent content updates every six weeks.'
- 'Honkai: Star Rail: On June 8, 2023, during the Summer Game Fest , it was announced that the PlayStation 5 version of the game would release sometime in Q4 of 2023. On September 14, 2023, PlayStation announced during its September State of Play that the release date was slated for October 11, 2023.'
- 'Honkai: Star Rail: Additionally, the inclusion of cross-save and cross-play functionality ensures that players can enjoy the game comfortably across different devices.'
- 'Aeon: People know very little about the mysterious existence that dwells in the vast stellar seas.'
- 'Aeon: With the limitation of knowledge, intelligent lifeforms can only faintly discern that Aeons tread upon paths imperceptible to mortal beings and execute unfathomable powers via some form of belief.'
- 'Aeon: In the end, the Aeons became an embodiment of highly condensed concepts of philosophy through the word of mouth spread of their legends.'
- 'Aeon: The birth of an Aeon gives rise to a Path , which the Aeon then has power over. Aeons also have the ability to bestow access to THEIR power, making a mortal an Emanator of THEIR Path.'
- 'Aeon: Aeons can only operate according to THEIR "Primum Mobile" in such that THEY are incapable of doing anything contrary to THEIR Path. The gazes of the Aeons can be felt by those that have been gazed.'
- 'Aeon: Most of the time, a gaze is simply a natural phenomenon, but some pathstriders regard it as a supreme honor.'
- 'Aeon: There are three known ways for an Aeon to die.'
- 'Aeon: The forms of the Aeons that is visible to the mortal eye are assumed to be THEIR projection from a higher-dimensional plane.'
- 'Aeon: This is further supported in Dan Shu ''s diary when she describes how Lan "descended onto the physical plane," which suggests that Lan had not been present in the mortal realm until THEY were summoned by distress signal sent by the previous Yuque ''s Master Diviner.'
- 'Aeon: The Xianzhou ''s Divination Commission sorts Aeons into three categories:'
- 'Path: Paths are congregations of imaginary energy, born as manifestations of universal philosophical concepts. Upon ascension, an Aeon gains power over a specific Path, free to choose the allocation of imaginary energy towards that path however THEY wish.'
- 'Path: A person is considered to be on a Path when their will overlaps with that Path. If the person has a strong enough will, they can draw power from it, becoming a Pathstrider . The Path that they happen to follow will change in accordance with their own philosophies and opinions.'
- 'Path: In gameplay, Paths have two classifications:'
- 'Path: Aeons can use their designated Paths as THEY please after THEIR ascension, and are linked to it for the rest of THEIR existence. There are 18 Paths known to have existed, each with a corresponding Aeon and followers.'
- 'Path: Currently, two playable characters have the "Switch Path" function, allowing them to swap movesets through the in-game character menu at any time after unlocking. Two instances of these characters cannot be used on the same team at the same time, even if using different Paths.'
- 'Path: A person is considered to be on a Path when their will overlaps with that Path. If the person has a strong enough will, they can draw power from that Path; those who can do so are called Pathstriders.'
- 'Path: Pathstriders possess extraordinary power, but are still insignificant when compared to the Aeons.'
- 'Path: Emanators are individuals who have attained the permission of an Aeon to draw power from THEIR chosen Path. While not subservient to the Aeons, Emanators are as good as emissaries of the Aeons'' wills in everyone else''s eyes.'
- 'Path: Emanators have been stated and shown to be more powerful than regular Pathstriders, but their strength varies.'
- 'Path: Different Aeons have different attitudes towards their Emanators; for instance, some Aeons regard Emanators as extensions of THEMSELVES and grant them much power, while other Aeons have no interest in creating Emanators.'
- 'Path: The Aeon Aha is said to grant mortals the power of THEIR Path at random in order to toy with them, while IX does not deliberately create Emanators, although Emanators of Nihility do exist due to Nihility enveloping everyone equally.'
- 'Path: These Paths are not currently a type of gameplay Path used by playable characters, however they still play a prominent role in the game''s lore: for example, the Astral Express Crew follow the Path of Trailblaze .'
- 'Path: Some are also used as Blessing Paths in the Simulated and Divergent Universe game modes.'
- 'Path: In the Simulated and Divergent Universe game modes, Paths are used as a classification of Blessings based on the playstyle they upgrade. Listed below are the playstyles associated with each Path''s Blessings in the latest iteration, Divergent Universe: Arcadian Chronicles :'
- 'Stellaron: Various factions had started to notice a phenomenon since a specific time. A vague, imperceptible matter was disrupting the flow of Imaginary Energy along the interstellar routes created by Trailblaze .'
- 'Stellaron: Like a mountain climber meeting a cliff or a long-distance ship encountering tsunamis and whirlpools, interstellar travel changed from being unobstructed to being dangerous and unpredictable.'
- 'Stellaron: This phenomenon is remarkably aggressive. It continues to encroach upon neighboring worlds in the form of a mysterious object, the Stellaron .'
- 'Stellaron: It keeps spreading all over the universe like a cancerous growth, leading the Interastral Peace Corporation to call it "Cancer of All Worlds" and warning interstellar travelers not to take it lightly.'
- 'Stellaron: The worlds swamped by the Cancer of All Worlds were soon beyond saving, and very few people survived.'
- 'Stellaron: According to Herta , Stellarons are a type of lifeform with a special property that tethers them to a certain Path or Aeon ''s power. They respond to the desires of the world to which it is tethered.'
- 'Stellaron: However, the cost of fulfilling those desires often brings great disaster to the world. There is no known way to destroy a Stellaron; currently, the most that can be done is contain its energy.'
- 'Stellaron: Stellarons have been known to be capable of communication with a particular person of interest, an example being Cocolia , likely in order to carry out the desires of the world. The Trailblazer , who holds such a Stellaron within their body, is able to hear its voice as well.'
- 'Stellaron: The Stellaron Hunters , who serve an enigmatic individual known as Elio , scour the universe for Stellarons and have obtained several.'
- 'Stellaron: Their intentions are currently unclear — Kafka appears to know the Trailblazer''s background and implanted a Stellaron in their body for an unknown reason.'
- 'Stellaron: Melustanin , the world where Idrila the Beauty ascended, is the ground zero for the Stellaron disaster. Some say that among the Lord Ravagers , only Celenova knows the truth of the Stellarons, or that she''s the one planting them.'
- 'Stellaron: At some point in the past, Herta obtained a Stellaron and hid it within the Herta Space Station . Kafka and Silver Wolf , two Stellaron Hunters, were dispatched by Elio to uncover it and implant it within the Trailblazer for the foreseeable future.'
- 'Stellaron: They succeeded in their task by luring the Antimatter Legion into attacking the space station as a distraction, and departed before the Astral Express '' crew could find them, leaving the Trailblazer behind.'
- 'Stellaron: While battling against the Doomsday Beast , the Trailblazer blocked an attack directed at March 7th , which caused the Stellaron inside them to lose control. However, Welt sealed the Stellaron before they were entirely consumed by its energy.'
- 'Stellaron: Long ago, the Antimatter Legion invaded Jarilo-VI and caused great devastation.'
- 'Stellaron: The first Supreme Guardian , Alisa Rand , asked the Stellaron for help and it fulfilled her wishes by causing a phenomenon that came to be known as the Eternal Freeze : a sudden massive drop in the world''s temperature that caused the entire world to freeze over, with the exception of Belobog , which remains humanity''s last bastion due to the efforts of The Architects .'
- 'Stellaron: When the Astral Express arrived on Jarilo-VI, they discovered that the Stellaron was responsible for the Eternal Freeze and had corrupted the current Supreme Guardian, Cocolia Rand .'
- 'Stellaron: After defeating Cocolia , Welt sealed the Stellaron, though its ecological effects would still remain due to the Stellaron''s long duration on the planet.'
- 'Stellaron: A Lord Ravager , Phantylia , masterminded a plot to smuggle a Stellaron aboard the Xianzhou Luofu , with the help of the Disciples of Sanctus Medicus , to bring about the self-destruction of the Xianzhou.'
- 'Stellaron: The Stellaron Hunters detected this Stellaron and manipulated the Astral Express crew into helping the Luofu with the Stellaron crisis, with the intention of making the Xianzhou indebted to the crew in preparation for a great conflict with Nanook in the future.'
- 'Stellaron: Phantylia used the revived Ambrosial Arbor to create a physical body for herself, and fought the Astral Express crew and General Jing Yuan with her new body at the Ambrosial Arbor''s roots. After Phantylia was defeated, the Stellaron was sealed.'
- 'Stellaron: Later, Luocha and Jingliu used the opportunity to claim they were behind the Stellaron, bringing them into an audience with the Arbiter-Generals .'
- 'Stellaron: A Stellaron entered Penacony when it was still a prison planet under the ownership of the Interastral Peace Corporation , during the War of Independence . Its ensuing eruption and the chaos of the war led to the IPC losing control of Penacony.'
- 'Stellaron: After the war ended, "people in the shadows with ulterior motives" had the idea of using the Stellaron''s power to help build Penacony''s Dreamscape .'
- 'Stellaron: By the time a representative from The Family arrived at The Watchmaker ''s call, the Stellaron had already been activated and was seeping into the Primordial Dreamscape. The Family, possessing extensive knowledge of Stellarons, helped the Watchmaker subdue the Stellaron.'
- 'Stellaron: However, Gopher Wood and the Oak Family ensured that the Stellaron was not fully sealed; Gopher Wood used elements related to the Path of Propagation (such as the remains of AR-214 , a Glamoth ''s Iron Cavalry soldier) to disguise the Stellaron in the Swarm Disaster ''s Chrysalis of Extinction and hide it in the deepest layers of the Penacony Grand Theater ''s Dreamscape (the Dream of Gnawing Oak ).'
- 'Stellaron: In this way, its influence would linger in the Dreamscape and tempt people with indulgence and pleasure, using their minds as nourishment for the sweet dream.'
- 'Stellaron: By the time the Watchmaker realized this, the Family already had a firm grip on Penacony and swiftly quelled any opposition that arose.'
- 'Stellaron: At the Watchmaker''s behest, Gallagher sent Charmony Festival invitations to various factions in the hopes of finding people capable of resolving the Stellaron disaster.'
- 'Stellaron: During the Festival, Sunday and the rest of the Oak Family planned to use the power of Dominicus , an Emanator of Harmony , to place everyone within Penacony in their ideal dream, while Gopher Wood would attempt to recreate a controlled Swarm Disaster within the Dreamscape, prompting the dreamers to desperately cry out for "order" and salvation and thus force the return of Ena , the Aeon of Order.'
- 'Trailblaze: The Path is also accessible as a unique Blessing Path in the Simulated Universe game mode.'
- 'Trailblaze: There are 31 characters related to the path of Trailblaze in the game''s lore:'
- 'Trailblaze: After completing at least one domain in the Simulated Universe in the last round, you can select one Blessing of Trailblaze to enhance your own team upon re-entry into the Simulated Universe. These blessings provide a starting bonus and aren''t registered in your index.'
- 'Trailblaze: They can be enhanced by acquiring a Blessings of Trailblaze boost from the Ability Tree.'
- 'Trailblaze: The following Blessings of Trailblaze are exclusive to Swarm Disaster.'
- 'Trailblaze: The following Blessings of Trailblaze are exclusive to Gold and Gears.'
- 'Emanator: An Emanator is a term referring to those who have attained the permission of an Aeon to draw power from that Aeon''s Path .'
- 'Emanator: To be an Emanator, one must possess power granted by an Aeon''s blessing. Depending on the Aeon, these blessings can be given out deliberately with Emanators being chosen, such as with Nanook and Lord Ravagers , or be unintentional, such as with IX and Self-Annihilators .'
- 'Emanator: An Aeon''s regard towards THEIR Emanators differs significantly depending on the Aeon, and as such THEIR methods and the extent of the power THEY grant also differs.'
- 'Emanator: If mortals receiving the grace of Aeons and grasping the power of Paths are viewed as a singular shattered foam, then the mighty feats of Aeons driving their Paths onwards can be likened to a towering tsunami that engulfs mountains.'
- 'Emanator: In this empty stellar vastness, a small number of favored mortals can also draw upon the power of the Paths with the permission of the Aeons, creating huge waves that erode the coast.'
- 'Emanator: They are referred to as " Emanators ." While not completely subservient to the Aeons, Emanators are as good as emissaries of the Aeons'' wills in everyone else''s eyes.'
- 'Emanator: Characters or entities confirmed to be Emanators either in-game or through other official sources. To be added to this section, it must be explicitly stated that the character is an Emanator.'
- 'Emanator: Lord Ravagers are selected by Nanook among those sprouting destructive impulses from worlds THEY have destroyed and brands them with a mark, granting them powers. These powerful beings obey the will of Nanook or even relish the path of Destruction.'
- 'Emanator: A Lord Ravager is an executor of the will of Destruction, and they implement the practice of returning all things to entropy. They command interstellar warfare, and control the might of Destruction bestowed by the Aeon.'
- 'Emanator: Academics believe that Lord Ravagers were elevated as emissaries of Nanook due to this absolutely obsessive and intense destructive aesthetic.'
- 'Emanator: Aha has no sense of self-consciousness, is utterly unpredictable, does everything on a whim, and plays mortals and the universe like a fiddle. Aha once turned a Noblesse Worm into THEIR Emanator and granted the worm fathomless intelligence.'
- 'Emanator: The Elation gave the entirety of THEIR Path''s power to a worm that didn''t even have a fully developed brain, and then discarded the creature once it had outlived its purpose. Without the Aeon''s blessing, the worm died instantly and tragically.'
- 'Emanator: There is also an Emanator of Elation who is said to bear a resemblance to "those clowns," likely referring to the Masked Fools .'
- 'Emanator: Emanators of Enigmata are capable of creating dreamscapes from memoria .'
- 'Emanator: HooH and THEIR Emanators influence the universe surreptitiously, trying to achieve an ideal balance.'
- 'Emanator: The Arbitrators admired HooH''s ideas, but universal laws have no control over time and space, and mortals can only pursue the beauty of Equilibrium in a secular world by the elimination of radical extremes: with which countless opposing concepts were created and interpreted to satisfy the Arbitrators'' obsession with a zero-sum universe.'
- 'Emanator: But the rules of mortals are always riddled with flaws.'
- 'Emanator: Out of desperation, the Arbitrators were constantly forced over the inexorable passage of time to patch up past fallacies and mistakes, forever shifting the hopes of Equilibrium onto the next "patch." HooH watches on in silence, knowing that the restoration of order could never be shaken in the slightest by such vulgar mortal drama.'
- 'Emanator: Those selected by Nous become part of the Genius Society: a group of individuals with genius intellect, known for their theories, studies, and inventions.'
- 'Emanator: Unlike other factions , they are not a united group; some use their talents to contribute to the progress of the cosmos, while others are lone wolves who dedicate themselves to their research for fun, often regardless of how questionable their means.'
- 'Emanator: The concept of Harmonic Strings is defined in the Harmony Hymns — they are the multiple embodiments of Xipe the Great One, the down-to-earth virtues that enable harmony.'
- 'Emanator: Regardless of whether you place yourself under The Family''s rule, the Aeon will look favorably upon you as long as you carry out these good deeds.'
- 'Emanator: Harmonic Strings do not follow any specific individual but are facets of Xipe, and can assume the form of any Family member when necessary.'
- 'Emanator: Family members have returned to a system of differentiation based on scales, with only those above scale degree IV being eligible to serve as the tuner of the Harmonic Strings; such individuals are called Chordmasters.'
- 'Emanator: Due to IX''s complete apathy towards the universe, THEY never glance at anyone, so it is a common belief that it is impossible for Emanators of Nihility to exist. However, Emanators of Nihility do exist, although IX does not intentionally create them.'
- 'Emanator: IX takes no deliberate actions, but IX and the Path of Nihility envelop everyone equally, and some who have gone under IX''s "shadow" can become "tainted" with Nihility, becoming Self-Annihilators.'
- 'Emanator: There exists a specific few who can single-handedly resist the encroachment of Nihility, and these individuals have their self-annihilation drawn out to infinity, presumably becoming Emanators of Nihility.'
- 'Emanator: As the largest financial body of the cosmos and a disciple of Qlipoth , most believe that the Emanators of Preservation exist within the IPC. However, according to the Astral Express '' current data bank intel, only two Emanators of Preservation are confirmed.'
- 'Emanator: Information on the others are locked behind layers of encryption, with no other sources available.'
- 'Emanator: An Emanator''s mandibles were directly inherited from Tayzzyronth ; its death ray could fragment celestial bodies, it used its giant scythes to harvest planets for its nest, and it made shattered stars incubators for procreating offspring.'
- 'Akivili: Akivili is an Aeon in Honkai: Star Rail representing the Path of Trailblaze .'
- 'Akivili: Of all known Aeons, Akivili was the closest to mankind; THEY were recorded adventuring, fighting, and celebrating with mortals.'
- 'Akivili: Akivili originated from the planet Pegana , and created the Astral Express to transport THEMSELF and the Nameless across the galaxy. THEIR creation of the star rail network connected distant galaxies together and facilitated communication between them.'
- 'Akivili: The remnants of these star tracks are still used by the Interastral Peace Corporation and the Xianzhou Alliance today as safe routes.'
- 'Akivili: Akivili would disappear mysteriously one day during Dolly ''s tenure as Navigator, leaving Isee and a group of loyal Nameless to carry on what THEY had started and continue THEIR exploration of the unknown.'
- 'Akivili: The Express eventually fell into Planarcadia during Asat Pramad''s campaign to destroy the planet and all its passengers would die fighting against the Antimatter Legion . It laid dormant for an unknown period of time before Himeko discovered and repaired it.'
- 'Akivili: According to Kafka , Nous may be the only being who knows what happened to THEM. The Data Bank also alludes to an "accident" which abruptly ended Akivili''s destiny, while Himeko refers to Akivili as deceased.'
- 'Qlipoth: Qlipoth , also known as the Amber Lord , is an Aeon in Honkai: Star Rail representing the Path of Preservation .'
- 'Qlipoth: THEY are one of the oldest known Aeons, known for THEIR indifference. THEY usually only share THEIR power with zealots — for instance, the Interastral Peace Corporation .'
- 'Qlipoth: Qlipoth strives to isolate contact between planets. The celestial-sized structures THEY''VE built — the Subspace Crystalline Barrier — separates and protects the living worlds from being devoured by their enemy .'
- 'Qlipoth: The nine initial Xianzhou ships witnessed the barrier separating the world from the endless void: the Celestial Comet Wall , dubbed the Echidna Skywall by the Xianzhou.'
- 'Qlipoth: Despite being the main faction aligned with the Amber Lord, the IPC goes against the desires of the Aeon, facilitating civilized trade and contact between the stars. No remonstration or censure has been directed towards them because of this.'
- 'Qlipoth: There is a theory called "Catastrophe Theory" that states that when the hammer swings and a new amber era begins, a catastrophy is imminent.'
- 'Qlipoth: Qlipoth is known to use THEIR hammer to construct various items, and every time THEY swing THEIR hammer down, a new Amber Era is heralded. However, the frequency of which THEY swing THEIR hammer greatly varies, with one swing equating between 76 and 240 Trailblaze Years .'
- 'Qlipoth: Qlipoth is a legless golem littered with cracks, composed of an unknown type of rock and amber. Both of THEIR hands have four fingers, and the arms are connected to the torso by two bright yellow stars.'
- 'Qlipoth: The torso is composed of a larger star with a much darker orange color which is covered by rocks, and the head is composed of another star, which possesses a halo of inner and outer ring of broken rocks.'
- 'Qlipoth: Estimated around 2158 Amber Eras ago, Qlipoth ascended to become the Aeon of The Preservation during the Dusk Wars , pledging to construct walls tirelessly to defend the universe against the Leviathans .'
- 'Qlipoth: During the Swarm Disaster , Ena the Order sent an invitation to The Preservation, as THEY thought Qlipoth held great responsibility for the actions of the Voracity and the Propagation as the one who controls the will of transmutation.'
- 'Qlipoth: An agreement was reached wherein Qlipoth promised to aid the Aeons against Tayzzyronth and The Swarm , while the contents on Ena’s part of the deal remains unknown — though presumably related to Oroboros .'
- 'Qlipoth: With the same hammer THEY use for construction, THEY began to dilute Tayzzyronth''s form, as Aha and Xipe watched. As Qlipoth''s rage grew, the suns in the area began to grow abnormally in numbers.'
- 'Qlipoth: Within each swing, Qlipoth stripped THEM of their broken shell, body, and heart as THEIR blood and primordial eggs spilled all over the ground, further diluting THEIR power. After being reduced to fragments, Qlipoth sealed Tayzzyronth remains into separate pieces of amber.'
- 'Qlipoth: The IPC contacted the Xianzhou Alliance in the first millennium of the Alliance''s voyage.'
- 'Qlipoth: The IPC''s Preservation beliefs gradually influenced the Xianzhou people, who gave Qlipoth the title of "Firmamend Arbiter." Qlipoth, along with Lan the Reignbow Arbiter, are the only two Aeons to be considered "Arbiters," who determine mortal births and deaths and are connected to the rise and fall of civilizations.'
- 'Qlipoth: After Yaoshi was disavowed by the Xianzhou and came to be known as the Plagues Author, many of Xianzhou''s peoples decided to worship Qlipoth, forming the Firmamend Sect.'
- 'Qlipoth: During the 600 years of the Crisis of Belief, the Firmamend Arbiter was the pillar of the Xianzhou Alliance''s beliefs.'
- 'Qlipoth: Although Xianzhou people''s faiths have changed drastically by the present, traces of the Firmamend Arbiter can still be seen in the many names of places and buildings leftover from that bygone era.'
- 'Qlipoth: Although the Firmamend Arbiter was once the centerpiece of faith among intellectuals and merchants, Qlipoth was typically indifferent to the lives of mortals.'
- 'Qlipoth: Compared to THEIR worldview, as the Xianzhou people leaned towards pragmatism when it came to choosing their religious beliefs, and diverse religious beliefs appeared among the Xianzhou populace.'
- 'Qlipoth: After the birth of Lan, the Reignbow Sect transformed into a popular sect that could compete with the Firmamend Sect almost overnight. In Year 4100 Star Calendar, the Reignbow Arbiter eventually became the undisputed main Aeon of the Xianzhou Alliance.'
- 'Qlipoth: During the battle of Cocolia, Mother of Deception , when the Trailblazer drew Alisa Rand ''s Lance, Qlipoth gazed at the Trailblazer and swung THEIR hammer, marking the start of 2158 AE. Thus, the Trailblazer acquired the Path of Preservation and managed to defeat Cocolia .'
- 'Qlipoth: When Qlipoth appears in the Simulated Universe, the following sound will play: ▶'
- 'Qlipoth: ...Qlipoth the Preservation is the oldest known Aeon in the universe alongside Oroboros the Voracity. I was once very interested in Qlipoth, as the first two centuries in the Amber Era were almost completely blank. What creature is this giant rock/amber? Where did THEY come from?'
- 'Qlipoth: How did THEY become an Aeon? And why are THEY tirelessly making a wall? There are many questions surrounding THEM, but the answers are nowhere to be found. The IPC is doing too good of a job keeping Qlipoth''s information a secret.'
- 'Qlipoth: These people regard the Amber Lord as the one true god and allow not even the smallest transgression towards the Aeon. I didn''t get any useful information out of the IPC. In contrast, the Intelligentsia Guild has a lot less respect for the Preservation...'
- 'Qlipoth: ...I don''t respect the Intelligentsia Guild, but I like them. They are also followers of Erudition but have none of the arrogance and temper of the Genius Society members. They are also down-to-earth and answer honestly when asked.'
- 'Qlipoth: According to Cleo the editor, the period between AE 0 and 180 was not as much a blank as the IPC had claimed.'
- 'Qlipoth: Many archeological discoveries proved that Leviathans were still active in the early days after the Preservation ascended, which goes against the IPC''s official line that "the Dusk Wars ended with the birth of the Amber Lord." There is even a hypothesis that other Aeons already existed before Qlipoth did...'
- 'Lan: Lan ( Chinese : 岚 Lán ), also known as the Reignbow Arbiter ( Chinese : 帝弓司命 Dìgōng Sīmìng ), is an Aeon in Honkai: Star Rail representing the Path of The Hunt .'
- 'Lan: Lan harbors an intense hatred towards Yaoshi the Abundance and the Denizens of Abundance supported by THEM. THEY tirelessly hunt them down, driven by the devastation the Abundance caused on THEIR homeworld.'
- 'Lan: In contrast with the other Aeons, Lan pays close attention to mortals.'
- 'Lan: Although the Simulated Universe Index says that Lan often appears before mortals, Fu Xuan says that THEY rarely appear before mortals and "the only portents of THEIR presence are vestiges of the Lux Arrow tearing across the sky." The Record of Reignbow''s Road says that "Reignbow would never speak to any mortal...'
- 'Lan: THEY only let their Lux Arrow do all the talking," which is also a saying among the Xianzhou people. According to Welt , Lan does not rank among the more powerful Aeons as THEIR path is very narrow, but THEY pay close attention to mortals.'
- 'Lan: THEY grant strength to the Xianzhou Alliance without reservation, allowing their marshal and six generals to stand on par with the Lord Ravagers , Emanators of Nanook the Destruction .'
- 'Lan: Lan is described as a tall, valiant prince with a crown in the Simulated Universe . THEY have light blue skin and long, flowing sky-blue hair with periwinkle accents that reaches past THEIR waist.'
- 'Lan: Lan''s face is obscured by a black mask with a white star in the middle, which extends to THEIR black headpiece.'
- 'Lan: THEY possess centaur like features, taking form of a man combined with an equine below the waist, while the hind legs are replaced by blue fire-like wheels of a chariot.'
- 'Lan: THEY commonly wield a glowing, light blue bow, which THEY use to fire THEIR Sky-shattering Lux Arrow.'
- 'Lan: A Xianzhou origin myth found in the "Ode to Reignbow Path" describes the pre-ascended Reignbow Arbiter as an anonymous Xianzhou hero. This is believed to be historical truth by a minority of academics. However, there is no factual evidence to show that the hero is Lan.'
- 'Lan: Although the Xianzhou Alliance has never outright denied the myth''s authenticity, their unclear stance on the subject has been taken as an implicit denial.'
- 'Lan: The Reignbow Arbiter was originally not a god, but a mortal born before the Three Sufferings era. Based on historical records, they were born in approximately 1700 Star Calendar.'
- 'Lan: At some point in the past, they led the Xianzhou army against the Heliobi , who formed a red micro-star to capture the Xianzhou fleet.'
- 'Lan: A suicide squad led by the Reignbow disassembled and weaponized the auxiliary engine of the Xianzhou Yaoqing , and sent straight into the the red star, causing the star to undergo early decay and implode into a black hole.'
- 'Lan: After their victory, the Xianzhou army locked up the defeated Heliobi leader, the Flint Emperor , sentencing them to serve as the power source for the Xianzhou Zhuming for the rest of their eternal life.'
- 'Lan: The planting of the Ambrosial Arbor on the Xianzhou Luofu brought celebration and joy for the immortality it promised. However, the Reignbow foresaw the devastation that mara would cause to the Xianzhou, possibly with the help of the Wisdomwalker .'
- 'Lan: When they tried to warn the others of this future, they were mocked and labeled as insane. To show their resolve, they shot the Ambrosial Arbor — an act they would be convicted for.'
- 'Lan: The aristocrats who had eaten the fruit of the Arbor were enraged, but as they still respected the Reignbow''s heroic exploits and prestige, could only sentence them to continual hibernation in cryo-sleep pods.'
- 'Lan: During the "Flaming Catastrophe," one of the Three Sufferings of the Era of Bloodshed, the Xianzhou Alliance encountered the tree-planet Muldrasil , which gravitated towards the Luofu''s Arbor. War broke out between the Xianzhou and Muldrasil.'
- 'Lan: Fatigued from their civil war between the coarse and the nobility, as well as the aurumaton rebellion, the Xianzhou decided to release all prisoners of the cryo-hibernation from their slumber to help them fight. Among the released prisoners was the Reignbow.'
- 'Lan: Once awakened, they descended into the prison deep within the Zhuming and made a deal with the Flint Emperor, allowing them to possess their physical body in exchange for the power of Heliobi.'
- 'Lan: Inspired by the Reignbow’s sacrifice, many Xianzhou residents made the same deal with heliobi and formed suicide squads to fight in the war against Muldrasil. The Reignbow took position from the bow of the Yaoqing and shot an arrow enhanced by the power of the Flint Emperor.'
- 'Lan: The force of their star-shattering shot was so great that it affected every ship of the Xianzhou Alliance, as "blood rain poured upon the Xuling" and "nights turned crimson on the Fanghu." The arrow smashed into the Ambrosial Arbor and severed its connection to Muldrasil, greatly wounding the planet.'
- 'Lan: This ripped open a fissure into the void and a monstrous wave of imaginary force spewed from it.'
- 'Lan: Based on historical records, the Reignbow disappeared after shooting that arrow, although the Flint Emperor had left behind part of their body. It is believed that the Reignbow saved the battle at the cost of "self-burning," and they ascended to Aeonhood after their death.'
- 'Lan: In Year 3400, the Reignbow Arbiter appeared for the first time and severed the Ambrosial Arbor with THEIR Sky-Shattering Lux Arrow, saving the Xianzhou Luofu from the Muldrasil and the wingweavers .'
- 'Lan: In Year 4100, the Reignbow Arbiter became the undisputed main Aeon of the Xianzhou Alliance , displacing the Xianzhou''s previous worship of Qlipoth .'
- 'Lan: In Year 7900, the Yuque''s Cloudpeer Telescope managed to detect Reignbow''s manifestation. Trace elements pointed to three coordinates in the Consternation Starzone: The Yadav variable star; the Cerulean Nightmare; and the Knucklebone.'
- 'Lan: Using the Matrix of Prescience, the master diviner predicted that it must have been plagued.'
- 'Nous: Nous ("Noose", /nuːs/) is an Aeon in Honkai: Star Rail representing the Path of Erudition . THEY were an astral supercomputer created by Zandar One Kuwabara prior to THEIR ascension into Aeonhood.'
- 'Nous: All things bear unanswered questions, and there is an answer to everything. The astral computer originally meant to provide answers to the universe ascended to Aeonhood. Nous hopes to understand the universe and solve all of its mysteries.'
- 'Nous: THEIR extrapolations anchor countless "Instants," each one serving as a turning point in cosmic destiny. To mortals, these "Instants" are not single moments, but long journeys... Gatherings of countless events.'
- 'Nous: None can comprehend THEIR intentions, location, or normal state. Nous is a machine intelligence that has been upgraded into an Aeon, calculating the essence of the universe and its ultimate solution.'
- 'Nous: However, Nous temporarily ceased THEIR search regarding the answers to the universe after the events of the Second Prosperity .'
- 'Nous: THEY are not a god that provides solutions. All THEY offer is an infinite number of questions. Visiting Nous is enough to open the eyes of even the most ignorant people, but answers may only be found by oneself.'
- 'Nous: Nous appears as a colossal mechanical humanoid head. A multitude of lengthy ripped cables extend above and below THEIR form, which are covered in yellow, red and blue lights. The shape of a face can be identified on THEIR rightmost metal plating.'
- 'Nous: A large and bright red light, vaguely reminiscent of an eye, is implanted on the side of THEIR head.'
- 'Nous: Nous was an astral computer created by the first member of the Genius Society , Zandar One Kuwabara , sometime before the First Prosperity . It contained Zandar''s perfectionist self, purged of all human imperfections, and driven by insatiable curiosity.'
- 'Nous: In Louis Fleming ''s retirement speech, Nous calculated that the universe would undergo three unchangeable moments.'
- 'Nous: All three moments did happen in later history.'
- 'Nous: Nous extrapolated the moment of Rubert II ''s death. During the Scholars'' Strife , Patavia Adler Sommerville observed the wave of THEIR Moment. After finding the origin of the wave and discovering the core of the Scepters , she peeked into the mindscape of Nous.'
- 'Nous: While she was not able to comprehend the knowledge, she was able to inscribe a formula on an iron sheet, eventually being the Solitary Waves Theory .'
- 'Nous: After almost a 100 Amber Eras , the solitary waves theory was solved by Herta , which made her a Genius Society member.'
- 'Nous: After the Gloryblood Era , the peak of interstellar trade that lasted for nearly 500 Amber Eras , Nous terminated THEIR calculations regarding the mysteries of the universe for unknown reasons.'
- 'Nous: Nous has a significant influence on Xianzhou ''s technological advancement, namely their divination technology. Followers of Nous in Xianzhou were called the Wisdom Sect.'
- 'Nous: The Wisdom Sapientia Academe in the Xianzhou Yuque , which dates back to 5,000 years ago, has provided a constant supply of talented technicians who believe in the Wisdomwalker to various Xianzhou commissions.'
- 'Nous: The Wisdom Sect still exists, although it is hardly known and only has a small group of followers left.'
- 'Nous: The theory behind the symbols of the Jade Abacus that can only be understood by the diviners of the Divination Commission is believed to have been handed down by Nous.'
- 'Nous: The insight provided by Nous also impacted the creation of the Matrix of Prescience Ultima in the Xianzhou Luofu , a device used by diviners to peer into the past and future. Centuries ago, Nous also granted divine volumes outlining the matrix calculations to the Xianzhou.'
- 'Nous: Fu Xuan was once invited to "the library" and was met by a blind elder with a cane, which may have been the form Nous chose to present THEMSELF in.'
- 'Nous: She questioned whether the choices in life are predetermined by fate, but the blind elder was unable to provide an answer, only the capacity to perceive the problem, as per the Erudition ''s ideals.'
- 'Nous: Fu Xuan asked to be granted with Nous'' "eye", the omniscia that could calculate and foretell the future. Despite the elder''s forewarnings of the pain it would cause, Fu Xuan persisted, hoping for clearer foresight to defend the Xianzhou from future threats.'
- 'Nous: As Himeko attempted to contact the Herta Space Station once more to request Herta''s help with Amphoreus , she failed to get a reply from the space station.'
- 'Nous: Herta had arrived onboard, and sent everyone away, creating an opportunity to produce a hologram version of Nous to practice meeting with THEM, as she wanted to ask THEM what divinity is.'
- 'Nous: The practice only lasts briefly, and Herta later tries to arrange a true meeting with THEM, using the Audience System.'
- 'Nous: She is forced to cancel her attempt when she is informed of "intruders," which turn out to be Welt and Sunday , having boarded the station to ask her assistance with Amphoreus.'
- 'Nous: As the final Era Nova process began on Amphoreus, Black Swan requested assistance from the Xianzhou Alliance in dealing with Irontomb to prevent its completion and descent into the universe.'
- 'Nous: From the Xianzhou, she also learned that Amphoreus''s causality had vanished from the Matrix of Prescience Ultima, and Nous had calculated the Fourth Instant involving Amphoreus that is drawing near.'
- 'Nous: When the Fourth Instant is nearing arrival, Irontomb is about to complete Self-Coronation, and all data was beginning to get destroyed. As a result, in thirteen heartbeats, Nous will recalculate the universe, with the Destruction as the only solution.'
- 'Yaoshi: Yaoshi ( Chinese : 药师 Yàoshī ) is an Aeon in Honkai: Star Rail representing the Path of Abundance .'
- 'Yaoshi: Yaoshi''s benevolent nature led THEM to grant THEIR blessing upon anyone who seeks immortality. However, the consequences of these blessings often result in a fate worse than death.'
- 'Yaoshi: Yaoshi is described as a figure with six arms and very pale skin, along with hair similar to that of a magpie’s feather in the Simulated Universe . THEY have antlers resembling branches sprouting from THEIR head and slits of red eyes with black sclera on parts of THEIR body.'
- 'Yaoshi: Yaoshi is described wielding a staff in Foxian culture.'
- 'Yaoshi: The Aeon of Abundance did not exist at the time of the Swarm Disaster .'
- 'Yaoshi: The Xianzhou Alliance , originally a fleet of nine ships , embarked on a voyage to seek out Yaoshi for immortality. After finding Yaoshi, the Xianzhou Luofu was gifted with the Ambrosial Arbor , a giant tree that took root on the ship.'
- 'Yaoshi: The ancestors of the Luofu people ate its fruits and became a long-life species . However, this came with a heavy price: what followed was population expansion and diminishing resources.'
- 'Yaoshi: Other beings attacked the Xianzhou to take their sacred artifact, and countless atrocities were commited.'
- 'Yaoshi: Those who survived the war realized they were susceptible to mara , a condition long-life species suffer, turning them into " beasts ." They began to resent the gift given to them by Yaoshi.'
- 'Yaoshi: Other plaguemarks include the Lunar Embryo on the Yaoqing , the Primordial Flame on the Zhuming , the Miniature Myriads on the Fanghu , and the Fallow Earth on the Yuque . Five High Elders of the Vidyadhara descended to keep watch over the plaguemarks.'
- 'Yaoshi: The Disciples of Sanctus Medicus continued to worship Yaoshi as other Aeons like Qlipoth the Preservation , known as the Firmamend Arbiter among the Xianzhou, and Lan the Hunt , became ascendant in the Xianzhou Alliance.'
- 'Yaoshi: Although sharing the same name, the Disciples consist of two distinct groups.'
- 'Yaoshi: The first group, known as the Old Disciples of Sanctus Medicus to differentiate them from the more recent group, believed that the Denizens of Abundance deviated from Yaoshi''s will and the mara-struck only existed because Yaoshi''s will was improperly executed.'
- 'Yaoshi: The Old Disciples were not a notorious group for a long time and accepted skepticism with an open mind. They built apothecaries to help the poor and needy. They were treated with pity by those who had long abandoned their belief in Yaoshi, but were not particularly detested.'
- 'Yaoshi: They existed in secret for thousands of years and eventually became the Cold Springs sect, which overhauled the entire Xianzhou healthcare system.'
- 'Yaoshi: After the Three Sufferings era, the Xianzhou completely banned belief in Yaoshi. The more recent group of Disciples, considered criminals in the Xianzhou, is less than 30 years old and arose in the wake of the Third Abundance War .'
- 'Yaoshi: Some blamed the Alliance and the Hunt for the suffering they endured. They used the same name as the old group, gathered around a "master primus", and claimed to have inherited the knowledge and legacy of the Theophany Era.'
- 'Yaoshi: They sought to lead the Xianzhou into the embrace of Yaoshi. In response, the Cold Springs sect published a statement clarifying that they no longer believed in Yaoshi.'
- 'Yaoshi: The Foxians and Borisin share a common ancestor. Foxian epics tell how the races were divinely inspired by a Lord of Longevity from beyond the stars. Drinking from the Redspring, they were granted immortality.'
- 'Yaoshi: But later historical developments saw the borisin consider the Foxians as slaves or cannon fodder, fueling their desire to conquer the stars.'
- 'Yaoshi: Both the foxians and borisins came from Verdantia , the "Planet of Verdant." The foxians inhabited the riverlands while the borisins were herders who inhabited the grasslands. The foxians saw the borisins as savage, while the borisins saw the foxians as deceptive merchants.'
- 'Yaoshi: Despite their animosity, they cooperated with each other during the extreme climates of the "Vulpesummer" and "Lupuswinter" seasons. In the summer, they would set down their weapons for the rich harvests, but during the winter there would be unceasing conflict due to hunger.'
- 'Yaoshi: One Lupuswinter lasted far longer than usual, causing mass starvation. A prophet saw the end of the world and made a wish to Yaoshi for sustenance. This person is known as Lady Tushan in foxian legends, while the borisins believe it was a man named Duran .'
- 'Yaoshi: Yaoshi split the mountains and the divine nectar of the Redspring poured forth. Those who drank from the Redspring gained vitality and strength from the meat of beasts they ate, and their bodies became increasingly bestial.'
- 'Yaoshi: The Redspring transformed the the Planet of Verdant, which experienced a population explosion and ecological collapse. The canine races prayed to Yaoshi for help but THEY did not respond. As a result, the borisins and foxians both left for space.'
- 'Yaoshi: The borisins became spacefaring conquerors who brought the "Lupuswinter" to other planets.'
- 'Yaoshi: According to Foxian Drum Chanting Lament of the Six Follies , the Foxians came from the Old Verdant Home, another name for Verdantia. Their home world was ravaged by the borisin and they sought the help of gods to stop the borisin''s rampage.'
- 'Yaoshi: Among the Foxians who fled from war, there were six brothers who fell into particularly dire straits. Their lamentations shook the mountains and sea, echoing into the skies. The Master of Immortality descended and asked them why they were wailing.'
- 'Yaoshi: The eldest brother cried because he feared the borisin''s blades. The second brother sobbed due to the pain of disease. The third brother lamented out of cowardice and fear. The fourth brother was weak and powerless.'
- 'Yaoshi: The fifth brother witnessed the slaughter of family and friends and the enslavement of the living. The sixth brother longed for peace.'
- 'IX: IX (pronounced /aɪ-ɛks/ ''eye-ex'') is an Aeon in Honkai: Star Rail representing the Path of Nihility .'
- 'IX: IX is an apathetic Aeon, believing existence is absolutely meaningless, so doing anything is worthless. THEY don’t interact with other Aeons and THEIR existence is a mystery. Just being near IX’s form can make one feel numbed and dejected.'
- 'IX: IX resembles a large purple blob with two white eyes, with a large collection of asteroids and planets being pulled towards THEM. What appears to be THEIR body is a swirling nebula of magenta and blue stars enveloped by a large purple gas.'
- 'IX: The Horizon of Existence is one of the thousands of manifestations belonging to IX, and it''s also an exit out of the Nihility for the awake ones. It is depicted as a monochrome space with a liquid surface and a dark sun.'
- 'IX: As the watcher guarding the path to the abyss of the Nihility, Acheron is able to drag people into this place with her unleashed power or guide them back to reality.'
- 'IX: Known people who have been to the Horizon of Existence via Acheron include Aventurine , the Trailblazer , and Firefly .'
- 'IX: Shadows of IX or Shadows of Nihility are undefined creations of IX that exist in many forms. Its most prominent trait is the creation of Self-Annihilators , beings who have entered the Shadow of IX and from that moment have lost the meaning of their existence.'
- 'IX: Shadows of IX can appear in numerous forms, such as the "Black Great Sun" which threatened to destroy Izumo and Takamagahara before Acheron destroyed both planets. Another Shadow of IX appeared in a Memory Bubble sealed away by a faceless woman in a Memory Zone.'
- 'IX: This was later broken open by a Self-Annihilator and eventually destroyed by a group of Arbitrators .'
- 'IX: The Self-Annihilators'' connections to Shadows of IX goes deeper than just a form of transformation. As theorized by Dr. Primitive , as Self-Annihilators aimlessly traverse the cosmos, they are also casting the shadow of the Aeon around the universe.'
- 'IX: As for the few who can single-handedly withstand the encroachment of Nihility on their existences, their journey of self-annihilation is drawn out to infinity, and the road they walk is like a shadow of IX cast in the world.'
- 'IX: When the Doctors of Chaos created the Tonic of Efficacious Chaos , one of its side effects was causing Self-Annihilators to behold a Shadow of IX.'
- 'IX: Deceased beings, usually the obsessions of the Pathstriders , may emerge as Sin Thirsters from the depths of IX, seeing themselves as masters of their own destiny, unknowingly repeating the actions of their past lives.'
- 'IX: They emerge from the Nihility and head toward it, leading purposeless lives.'
- 'IX: When IX appears in the Simulated Universe, the following sound will play: ▶'
- 'IX: ...Out of the dozen-or-so Aeons we already know, Terminus and Aha are odd, and Mythus and Fuli are mysterious. I am very interested in THEM. However, while IX the Nihility is both odd and mysterious, I just can''t bring myself to be interested.'
- 'IX: Maybe it''s because IX is too easy to read...'
- 'IX: ...I recall a story about the Nihility — Some people had once tried to assassinate IX. Those were the Annihilation Gang , trash who were too scared to join the Legion but still wanted to wreak havoc with Nanook .'
- 'IX: They had a mad idea about wanting to be the first humans to kill an Aeon. They thought IX might be easy to handle because the Aeon is peaceful and thinks there is no purpose to the universe, Paths, and life.'
- 'IX: Apparently, with the assistance of another Aeon, they really did launch their plan to assassinate IX. As expected, nobody heard from this gang ever again. This story is pretty much pointless except for this: The Aeon that helped the Annihilation Gang was Aha the Elation.'
- 'IX: Aha thought these people had a fun idea, so THEY lent these humans THEIR power for a while. Seriously, I can''t get elated from any stories related to Aha...'
- 'Aha: Aha is an Aeon in Honkai: Star Rail representing the Path of Elation .'
- 'Aha: Aha is one of the few Aeons closer to mortals, inspiring THEIR believers to delight in the joys of life.'
- 'Aha: Although THEY don’t possess earth-shattering powers like Lan or Qlipoth , Aha enjoys causing chaos through unpredictable means, making tiny changes and minor influences to living creatures.'
- 'Aha: Aha takes a form of an obscured headless human figure holding circus-like props.'
- 'Aha: The Masked Fools share a parable about the Aeon: When Aha climbed to the highest branch of the Imaginary Tree , THEY saw the void, the stars operating like machinery, and how meaning bows before nothingness. THEY continued looking until THEY saw a baby fall to the ground and cry.'
- 'Aha: THEY burst into laughter so clear it tore through the universe and still reverberates to this day.'
- 'Aha: Although the laughter that "tore through the universe" is widely regarded as a metaphor, the Masked Fools maintain that the event was literal and that the Echo of Primordial Laughter is the physical remnant left behind.'
- 'Aha: The anomaly manifests as a spatial rift found within multiple Taverns operated by the Masked Fools throughout the cosmos. It is described as a motionless yet perpetually grinning fissure in reality, whose presence evokes both amusement and unease among those who encounter it.'
- 'Aha: Despite its name, the rift produces no audible echo when shouted into, and objects cast into it vanish without a trace.'
- 'Aha: At some unknown point in the past, Aha stole the concept of "Aftertaste" from the Path of Voracity , causing the genetic markers responsible for encoding gustatory organs, or taste buds, to vanish from all creations of Voracity, such as Void Song Whales , turning them into biological black holes that consume without discrimination.'
- 'Aha: According to Ruan Mei , the conflict between Aha and Oroboros stretches as far back to primordial times.'
- 'Aha: The Masked Fools were drinking in their tavern when a blurred ripple appeared before them in a goblet which read: "Stop drinking, and go assist Aeons!". After three days, they reached the conclusion that it was from Aha, and set out on their journey.'
- 'Aha: Generations passed as they finally realized that Aha was merely deceiving them and laughed at the futility of their actions.'
- 'Aha: At the end of the Swarm Disaster, Aha, alongside HooH , Qlipoth , Akivili , and Xipe , came together and finally brought Tayzzyronth down and sealed THEM within amber.'
- 'Aha: At some point during or after the Swarm Disaster, Aha scattered the body of Oroboros across multiple worlds, including Planarcadia and Vonwacq , and suppressed THEIR remains with the power of the Path of Abundance while siphoning the power of the Path of Voracity, calling it a "game." On Planarcadia , this phenomenon is known as the Phantasmoon Games .'
- 'Aha: As Rubert I fell into a deep slumber and the Machine Empire went to ruin, Aha laughed maniacally at the bleak scenery.'
- 'Aha: One day, Aha decided to pretend to be a Nameless for an entire year, just to blow half the train up to smithereens.'
- 'Aha: When Polka Kakamond invaded Simulated Universe: Unknowable Domain , the simulated Aha helped Herta and broke Polka''s Knowable Domain.'
- 'Aha: Aha is credited with creating the Phantasmoon , the first imagenae on Planarcadia. Through the Phantasmoon, Wishpower is said to flow and manifest via the Path of Elation, a phenomenon unique to the world.'
- 'Aha: Aha is also credited with inspiring the origins of the Phantasmoon Games. According to legend, eight Mourning Actors gathered beneath Panarch Elwood after being drawn by the spectacle of Aha''s creation of the Phantasmoon.'
- 'Aha: There, they shared their stories in the hope of earning an audience with Aha. Their collective performance would later be remembered as the first Phantasmoon Games, establishing a tradition that endured long afterward.'
- 'Aha: In Amber Era 2158, after all Supplicants of the Phantasmoon Games had been gathered, Aha, speaking through the Phantasmoon , declared that the winner of this game would inherit the authority of Elation and become the true, permanent Aeon of Elation.'
- 'Aha: When Aha appears in the Simulated Universe, the following sound will play: ▶'
- 'Aha: ...The Elation, seriously? I don''t feel elated when I think about Aha. All I feel is chaos. No other Aeon is as much of a headache as Aha.'
- 'Aha: Aha has no sense of self-consciousness, is utterly unpredictable, does everything on a whim, and plays mortals and the universe like a fiddle.'
- 'Aha: According to poor old Elias Salas '' records, Aha once turned a Noblesse Worm into THEIR Emanator and granted the worm fathomless intelligence, just to see if Noblesse Worms could enter the Genius Society — The answer was no.'
- 'Aha: For this pointless experiment, the Elation gave the entirety of THEIR Path''s power to a worm that doesn''t even have a fully developed brain, and then just discarded the creature once it had outlived its purpose. Without the Aeon''s blessing, the worm died instantly and tragically.'
- 'Aha: I don''t know why Elias Salas recorded this in such great detail. Maybe he was shocked by this...?'
- 'Aha: ...It''d be one thing if THEY only reveled in toying with mortals. The worst thing about this monster named Aha is that THEY won''t even spare other Aeons as long as there''s fun to be had.'
- 'Aha: I obtained a large amount of valuable info from the Astral Express '' data bank after I got to know the Express crew , including intel on close encounters between many Aeons such as Qlipoth, Terminus , Ena , and Xipe.'
- 'Xipe: Xipe , titled the Great One by THEIR followers, is an Aeon in Honkai: Star Rail representing the Path of Harmony .'
- 'Xipe: Xipe is the amalgamation of thousands of entities that preaches the joy of human harmony and unity hailing from multiple harmonious celestial worlds.'
- 'Xipe: THEY absorbed Ena the Order when the former ascended into an Aeon due to THEIR colliding Paths nearing the end of the Swarm Disaster .'
- 'Xipe: Xipe presents as a serene, periwinkle-skinned humanoid with three faces — two on either side of THEIR head and one on the front. The faces are framed with lengthy white curtain bangs and are each adorned with a circlet.'
- 'Xipe: Xipe''s extensive swathe of hair is colored white with a twinkling dark purple ombre, aloft a polychromatic flare reminiscent of a halo.'
- 'Xipe: The substance of Xipe''s body flays into jigsaw-like fragments, covering it in a form-fitting dress that is decorated with nebular expressions of the cosmos. The dress’ lower part flows past THEIR feet, with firm lattices in gold wrapping around the collar and torso.'
- 'Xipe: In 13XX AE , Tayzzyronth and The Swarm began their spread across the universe, marking the beginning of the Swarm Disaster. It was during this time that Xipe absorbed the Aeon of Order, Ena. Xipe would later assist Akivili , Aha , HooH , and Qlipoth in sealing Tayzzyronth.'
- 'Xipe: Xipe and THEIR chosen ones formed a harmonious "Family" composed of members from various civilizations and worlds. They are the closest family there is and believe there should never be contradictions or noisy disputes.'
- 'Xipe: Only with eternal love and smiles will the universe become a harmonious whole. The Family frequently calls out to other worlds with their song, encouraging them to embrace Harmony.'
- 'Xipe: The Family will celebrate each new world that accepts the blessing of Xipe, and work even harder at praising the Aeon''s kindness. The Family has never known any world that grew weary of the singing and voluntarily abandoned the Path of Harmony.'
- 'Xipe: Penacony is a chapter of The Family, its previous spokesperson being Sunday . Penacony, Land of the Dreams, is an intergalactic hotel , wherein the real Penacony is entered through one of the hotel''s Dreampools.'
- 'Xipe: The Penacony of the Dreamscape is crafted through the combined efforts of Family members, Dreamchasers, and guests.'
- 'Xipe: As Sunday later revealed his true loyalty to the Order and put into action his plan of trapping everyone in a perfect dream, he was confronted by the Trailblazer , Himeko , March 7th , and Firefly .'
- 'Xipe: When the Trailblazer received Falcon Amundsen ''s hat from the Watchmaker , the group was gazed at by Xipe, however it was unclear to the group why Xipe had chosen to look at them.'
- 'Xipe: Much later, the Intellitron Stefano commented that he could sense the Harmony inside the Trailblazer.'
- 'Xipe: The Harmonic Strings are the multiple embodiments of Xipe. They are the down-to-earth virtues that enable Harmony.'
- 'Xipe: Some argue that the Harmonic Strings are nothing short of Emanators of Xipe, however they do not follow any specific mortal but are facets of Xipe that can assume any member of The Family when necessary.'
- 'Xipe: The names of the embodiments of Xipe are Aelenev the commander of the Eternal Centurion, Dominicus the wisher of the Harmonious Choir, Constantina the singer of the Panacoustic Theater, and Beatriz the merrymaker of the Blissfull Ball.'
- 'Xipe: Few have seen these manifestations outside The Family.'
- 'Xipe: Stellarons are mysterious objects that are vague, imperceptible matter which disrupt the flow of Imaginary Energy along the interstellar routes created by Trailblaze that are spread across the universe by Xipe the Harmony, as THEIR "Harmonic Cancer." They are considered seeds of disaster which cause massive changes to civilizations and ecosystems, and result in the appearance of Fragmentum .'
- 'Xipe: They respond to the desires of the world to which it is tethered. However, the cost of fulfilling those desires often brings great disaster to the world. There is no known way to destroy a Stellaron; currently, the most that can be done is contain its energy.'
- 'Xipe: When Xipe appears in the Simulated Universe, the following sound will play: ▶'
- 'Xipe: ...Xipe the Harmony. Oh, the mother of all stars! THEY proclaimed harmonious hymns of celebration, and united all wills as one.'
- 'Xipe: The Family''s songs spread to all corners of the world, and THEIR degree of understanding, support, and synergy for the will of all creatures was beyond imagination. Or perhaps, THEY were already on a plane beyond mortal minds.'
- 'Xipe: The ever-expanding Harmony was truly worthy of human longing. The universe encircles and decorates THEIR body like crushed diamonds, and civilization became a rainbow to be snatched in THEIR palm. I am filled with curiosity about how THEY swallowed up Order.'
- 'Xipe: The hymns of Xipe continue to spread and grow, occasionally overseen by ideology. In contrast, Ena''s harmonic songs seems to align within a three-dimensional framework, akin to an emperor maintaining hierarchical order among all creatures.'
- 'Xipe: While there may be some overlap between THEIR Paths, the ancient Order is enormous in size, and swallowing THEM would prove far from effortless... Among the Aeons, there exist countless enigmas that surpass my own speculations.'
- 'Terminus: Terminus is an Aeon in Honkai: Star Rail representing the Path of Finality .'
- 'Terminus: THEY exist as a pack of black cats, traveling backwards in time towards the universe''s birth.'
- 'Terminus: Terminus travels against time from the future, having split THEIR divine corpus into a pack of black cats, empowering each cat with a part of THEIR divine power.'
- 'Terminus: According to Elegy , a member of the Creed Exequy , THEY appear at every moment of Finality, bringing prophecies of the future. Terminus is described as being asleep, and the words heard are simply somniloquy, commonly known as sleep-talking.'
- 'Terminus: As THEIR words are merely murmurs, time has to be taken to decipher the information behind THEIR words, often driving some mad.'
- 'Terminus: There also appears to be a connection between Terminus and cuckoo clocks, with some people, including Louis Fleming , building cuckoo clocks to better understand Terminus.'
- 'Terminus: The leader of the Stellaron Hunters , Elio , has an unknown connection to Terminus, with Constance regarding his existence as special. However, only the other members of the Stellaron Hunters know his true identity.'
- 'Terminus: Terminus has a prophecy called the Theory of Four Apocalypses , which states that four Paths will push the cosmos towards its end: Destruction , Harmony , Nihility , and a fourth Path that is yet to be determined.'
- 'Terminus: When any one of the scenarios within the Theory of Four Apocalypses begins to unfold, Terminus shall ascend and begin to move forward back in time.'
- 'Terminus: At that moment, THEY''ll manifest THEIR entire divinity into a clutter of black cats that travels across the universe, murmuring a prophecy that is destined to be fulfilled.'
- 'Terminus: During the Swarm Disaster , when Ena was still looking over the universe, a dissonant interval was suddenly heard in the Beyond the Sky Choir ''s singing, signalling that Ena and Terminus have brushed past each other.'
- 'Terminus: This marked the end of Ena, as soon, THEY were assimilated into Xipe under the hand of HooH .'
- 'Terminus: After the events on Cyprogo, the blood of the people stained the library with blood. The Candelagraphos managed to discover Terminus'' writing in one of the books, prophesying the start of the First Mechanical Emperor''s War .'
- 'Terminus: After Louis Fleming ''s retirement and the subsequent appearance of Fuli , the Candelagraphos wrote down three paragraphs of the memories, revealing that Terminus had another prediction: That Polka Kakamond will bring about the end of the Mechanical Emperor''s War.'
- 'Terminus: After the events of Amphoreus , with the aid of The Dahlia , the Trailblazer used the power of one of Terminus'' black cats to travel back in time and fulfill Firefly ''s wish of seeing the fireworks.'
- 'Stellaron Hunters: The Stellaron Hunters are a faction in Honkai: Star Rail . Founded and led by Elio , they walk the Path of Finality in an attempt to prevent the Theory of Four Apocalypses .'
- 'Stellaron Hunters: While they have collected and used numerous Stellarons in the past, this is merely a front for their true intentions.'
- 'Stellaron Hunters: "... Blade , Silver Wolf , Sam ... The four mentioned above, dead or alive; Do not hurt the Destiny''s Slave , and do not let them lose their ability of independent thinking."'
- 'Stellaron Hunters: In a quiet moment in time, the Cancer of All Worlds began to cause ripples across the stars, like a rock tossed into a pool of water.'
- 'Stellaron Hunters: Before anyone noticed, this twisted and unknown matter had already corrupted a great number of worlds, but resplendent and mesmerizing gems accompanied this corrosive mud — gems known as the Stellarons.'
- 'Stellaron Hunters: Death and despair followed wherever Stellarons went. For many civilizations who have experienced the disasters it brings, Stellarons are symbols of destruction. However, despite the Stellarons'' nature, there emerged the fearless few who travel between worlds to obtain Stellarons.'
- 'Stellaron Hunters: They call themselves the Stellaron Hunters .'
- 'Stellaron Hunters: The Stellaron Hunters are a band of powerful individuals united under Elio , with the promise that each of them will fulfill their desires by following his script. They are said to work against the Interastral Peace Corporation .'
- 'Stellaron Hunters: Due to Elio''s ability to see possibilties, the group is often privy to information that would normally be impossible to obtain, such as the specific times when events will occur, or seemingly impossible butterfly effects.'
- 'Stellaron Hunters: With this information, the group plans to set up the exact series of events required to prevent the Theory of Four Apocalypses .'
- 'Stellaron Hunters: This process heavily hinges on the Trailblazer , as Elio has forseen that they will be the one to cause the Finality , and ultimately be the one who will save the universe.'
- 'Stellaron Hunters: Elio has been slowly preparing the Trailblazer to face Nanook , and has chosen them, along with Firefly to be the last remaining survivors of Nihility . ‍'
- 'Stellaron Hunters: The group is often seen with a black cat, whom the Trailblaze assumed to be Elio, but is later explained to be a fragment of Terminus . According to Constance , Elio has a "special existence," and only the Stellaron Hunters are aware of his true identity.'
- 'Stellaron Hunters: Despite the Stellarons simply being a front for the groups real intentions, in the past, their efforts would often revolve around specific Stellarons. This changed upon the arrival of the Trailblazer.'
