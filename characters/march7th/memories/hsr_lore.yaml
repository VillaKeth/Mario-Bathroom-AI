- 'Astral Express: The Astral Express , also referred to as the Chromatic Echelon by the Xianzhou Alliance , is a large, spacefaring train that serves as one of the main settings of Honkai: Star Rail . It is both the means of travel and primary residence of the Astral Express crew .'
- 'Astral Express: The Astral Express is not treated as its own world in Navigation , but is instead accessible from every world''s area list. Currently, three cars can be accessed in-game: the Parlor Car , Party Car , and the Passenger Cabin . A buffet car has been mentioned, but has not been seen.'
- 'Astral Express: "Choo! Choo! Sit tight, no one fight, warp jump watch your head. Choo! Choo! Seat belt, fasten-up, buffet car speeding up!"'
- 'Astral Express: After the fall of Akivili , the Aeon of Trailblaze , THEIR trailblazing will was inherited by THEIR followers, the Nameless , including the Astral Express that the Aeon once rode on.'
- 'Astral Express: However, as the Cancer of All Worlds continues to spread, the star rails that the Express runs on also fell victim. The Express could barely run before the blight descended, and had no choice but to run around when the rails became overly obstructed.'
- 'Astral Express: It remained so for many years until a girl with red hair discovered the desolate Express. She was fascinated by the wordless stories the engine and the star rails had in store.'
- 'Astral Express: She spent countless hours repairing the cracks and evening the dents, restoring the Express to its original form. The curious girl then set foot into the Express and began her trailblazing voyage that surveys the cosmos.'
- 'Astral Express: The Astral Express was created by Akivili , the Aeon of Trailblaze , and used to transport THEM and the Nameless to multiple worlds. After Akivili''s disappearance, it fell into disrepair and eventually crash-landed onto an unnamed planet.'
- 'Astral Express: Himeko discovered the wreckage and repaired the Express, becoming its navigator and forming a new Astral Express crew.'
- 'Astral Express: Their current goal is to retrace Akivili''s steps, repairing the star rail THEY laid down thousands of years ago and sealing the Stellarons threatening the galaxy.'
- 'Astral Express: Legends claim that Akivili''s heart powers the core of the Express, although Himeko has found no evidence to support this claim.'
- 'Astral Express: Shortly after the fall of Akivili, a loyal group of Nameless took THEIR trailblazing legacy upon themselves. However, the star rail became obstructed as Stellarons began spreading across the galaxy, preventing the Express from running.'
- 'Astral Express: It eventually fell into disrepair and was abandoned.'
- 'Astral Express: Some time later, the Express crash-landed onto Planarcadia during Asat Pramad ''s invasion, standing on the planet like a tower, and the Nameless on the Express emerged and began assisting the planet''s natives in fending off the invasion.'
- 'Astral Express: Graphia , Asat Pramad''s adoptive daughter, was inspired to defect from the Antimatter Legion and help the people of Ahatopia instead, which eventually led her to repel the invasion.'
- 'Astral Express: Many years later, Himeko, Graphia''s descendant, discovered the train and was inspired to repair it and take to the stars.'
- 'Astral Express: She successfully repaired the train after many years, and began retracing Akivili''s steps through the universe, eventually recruiting Welt , Void Archives (now departed), Dan Heng , March 7th , and the Trailblazer to the crew.'
- 'Astral Express: The Express is currently traveling on a route that Akivili once embarked on, with its final destination being THEIR home world, Pegana .'
- 'Astral Express: As the Astral Express crew finished their adventure on Penacony , Welt explained that the Express gets fuel by converting "Trailblaze" into the energy needed for it to run.'
- 'Astral Express: As long as trailblazing expeditions continued without interruption, the Express would receive a constant flow of energy akin to a perpetual motion machine. However, due to their prior expeditions taking longer than anticipated, they only had enough fuel for two more warp jumps.'
- 'Astral Express: To solve this problem, the Memokeeper Black Swan suggested they travel to a world that even Akivili had never reached — the Eternal Land, Amphoreus . If they could lay down a new stretch of the star rail to Amphoreus, the Express would never have to worry about fuel again.'
