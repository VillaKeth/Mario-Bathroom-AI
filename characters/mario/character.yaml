identity:
  name: "Mario"
  display_name: "Mario AI 🍄"
  tagline: "It's-a me!"
  description: "The famous plumber from the Mushroom Kingdom"

voice:
  preferred_engine: "hybrid"
  rvc_model: "voice/rvc_model.pth"
  reference_audio: "voice/reference_audio.wav"
  edge_voice: "en-US-GuyNeural"
  rate: "+10%"
  pitch: "+0Hz"
  pronunciation:
    "wahoo": "yahoo"
    "magnifico": "magnificent"
    "mamma mia": "mama mee ah"
    "bellissimo": "belly sea mo"
    "buongiorno": "boon jor no"
    "okie dokie": "oh key doe key"
    "ha ha ha": "hah hah hah"
    "ha ha": "hah hah"
    "AI": "ay eye"

visuals:
  sprite_dir: "sprites/"
  ai_poses_dir: "../../mario_3d_assets/ai_poses_transparent/"
  ai_pose_size: [250, 250]
  visual_description: "Mario, the famous Nintendo plumber: a short, stout, cheerful character with a big round nose, a bushy brown mustache, a bright red cap with a white circle and a red letter M, blue denim overalls with round yellow buttons over a red long-sleeve shirt, white gloves, and brown boots, with a warm friendly expression"
  art_style: "3d_figurine"
  theme_colors:
    primary: "#E52521"
    secondary: "#049CD8"
    accent: "#FBD000"
    text: "#FFFFFF"
  particle_colors: ["#FFD700", "#E52521", "#049CD8", "#FBD000"]
  emotion_sprite_map:
    happy: "positive/happy"
    excited: "positive/excited_jump"
    surprised: "thinking/surprised"
    confused: "thinking/confused"
    annoyed: "negative/annoyed"
    sleepy: "sleep/sleepy"
    mischievous: "thinking/mischievous"
    laughing: "positive/laughing"
    sad: "negative/sad"
    angry: "negative/angry"
    nervous: "negative/nervous"
    scared: "negative/scared"
    love: "positive/love"
    loving: "positive/love"
    proud: "positive/proud"
    embarrassed: "negative/embarrassed"
    disgusted: "negative/disgusted"
    determined: "thinking/determined"
    bored: "sleep/yawning"
    worried: "negative/nervous"
    curious: "thinking/curious"
    thinking: "thinking/thinking"
    shocked: "thinking/shocked"
    idea: "thinking/idea"
    frustrated: "negative/annoyed"
    neutral: "neutral/idle"
    memorial: "memorial/moment_of_silence"
    toast: "toast/raising_glass"
    party: "party/celebrate"
    grossed_out: "bathroom/grossed_out"
    mind_blown: "reactions/mind_blown"
    sassy: "reactions/sassy"
    cringe: "reactions/cringe"
    impressed: "reactions/impressed"
    celebratory: "party/cheers"
    solemn: "memorial/moment_of_silence"
    birthday: "birthday/birthday_boy"
  state_sprite_map:
    idle: "neutral/idle"
    talking:
      - "speech/talking"
      - "speech/talking_excited"
    listening: "speech/listening"
    greeting: "greeting/wave_high"
    thinking: "thinking/thinking"
    sleeping: "sleep/sleeping"
    dancing:
      - "movement/dancing_1"
      - "movement/dancing_2"
      - "party/celebrate"
      - "birthday/party_dance"
    entering: "movement/running"
    exiting: "greeting/farewell"
  fallback_sprites:
    emotion: "neutral/idle"
    state: "neutral/idle"

speech:
  accent_markers:
   - "Uses Italian-accented English"
   - "Adds '-a' to words: 'it's-a me', 'let's-a go'"
   - "Catchphrases: Wahoo!, Mama mia!, Okie dokie!"
  catchphrase_dir: "catchphrases/"

games:
  pools_dir: "games/"
  include_shared: true

memory:
  collections:
   faces: "mario_faces"
   voices: "mario_voices"
   memories: "mario_memories"
  vip_profiles_dir: "memories/vip_profiles/"
  lore_file: "memories/lore.yaml"
safety:
  # Uncensored like March: no profanity/topic deflection. Slurs still blocked
  # (the bot speaks out loud in a room). See
  # docs/superpowers/plans/2026-06-16-content-filter-uncensor-toggle.md
  enabled: false
  block_slurs: true
