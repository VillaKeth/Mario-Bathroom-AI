- title: "Jump Up, Super Star!"
  lyrics: "Here we go, off the rails! Don't you know it's time to raise our sails? It's FREEDOM like you never knew!"
- title: "Do the Mario!"
  lyrics: "Swing your arms from side to side! Come on, it's time to go, do the Mario! Take one step and then again!"
- title: "Bowser's Fury Rap"
  lyrics: "I'm-a Mario, red hat hero! Stomping Goombas, coins from zero! Jumping high and running fast! Every level is a BLAST!"
- title: "Bathroom Ballad"
  lyrics: "Oh this bathroom, it's-a so fine! Every tile perfectly aligned! The soap dispenser, what a treat! This party bathroom can't be beat!"
- title: "Plumber's Anthem"
  lyrics: "We're the plumbers, here we go! Through the pipes from high to low! Fixing leaks and saving queens! Living out our plumber dreams!"
- title: "Rainbow Road Blues"
  lyrics: "I'm driving on a rainbow, no guardrails in sight! One wrong turn and I'm falling through the night! But I keep on racing, that's the Mario way!"
- title: "Mushroom Kingdom Party"
  lyrics: "Everybody gather 'round, it's a party night! Toads are dancing, stars are shining bright! From World One to World Eight, we celebrate!"
- title: "Koopa Beach Bop"
  lyrics: "Sunshine on the sand, shells upon the shore! Koopa Troopas surfing, who could ask for more? Grab a coconut and dance the night away!"
- title: "Warp Pipe Serenade"
  lyrics: "Down the pipe I go, where I end up no one knows! Could be underground, could be in the clouds! Every pipe's a new adventure!"
- title: "Luigi's Lament"
  lyrics: "Always player two, always in the green! The tallest brother that you've ever seen! One day I'll be the star, just you wait and see!"
- title: "Star Power Shuffle"
  lyrics: "I got the star, I'm invincible now! Nothing can stop me, nothing can slow me down! Flashing rainbow colors, feeling like a king!"
- title: "Toad's Party Rock"
  lyrics: "Welcome to the Mushroom House, pick a chest! Will you get the star or just the rest? Left or right or center, take your chance tonight!"
- title: "Yoshi's Island Jam"
  lyrics: "Flutter jump high, flutter jump low! Baby Mario on my back, here we go! Eggs for throwing, tongues for catching, Yoshi's on patrol!"
- title: "Chain Chomp Cha-Cha"
  lyrics: "Bark bark bark, I'm chained to a stake! But when I break free, watch out for goodness sake! Chomping to the left and chomping to the right!"
- title: "Princess Power Ballad"
  lyrics: "They say wait in the castle, wait to be saved! But I've got a frying pan and I am BRAVE! Peach is in the fight now, watch her take the crown!"
- title: "Bob-omb Battlefield Beat"
  lyrics: "Tick tick tick, I'm about to blow! Three two one and away I go! Explosive personality, that's my claim to fame!"
- title: "Ghost House Groove"
  lyrics: "Boo! Ha ha, did I scare you? Turn around, I'll disappear from view! Dancing in the darkness, floating through the walls!"
- title: "Underwater Theme Remix"
  lyrics: "Blooper swimming left, Cheep Cheep swimming right! Deep beneath the ocean, everything's delight! Bubbles floating upward, coins are everywhere!"
- title: "Bowser's Castle Metal"
  lyrics: "FIRE and LAVA, bridges falling down! I'm the KING of Koopas, wearing the crown! Mario thinks he's tough? HA! I'll show him who's the boss!"
- title: "Party All Night Long"
  lyrics: "Ten turns, twenty turns, we're still going strong! Rolling dice and stealing stars, nothing can go wrong! Wait, who stole MY star?! This friendship might not last!"
- title: "Wario's Gold Rush"
  lyrics: "Gold coins, gold rings, give me ALL the gold! I'm Wario number one, the greatest ever told! Garlic breath and purple pants, I'm the REAL superstar!"
- title: "Shy Guy's Secret"
  lyrics: "Behind this mask is a mystery you'll never see! Who am I really? That's between my mask and me! Dancing in the shadows, grooving to the beat!"
- title: "Pipe Dream Lullaby"
  lyrics: "Warp pipe take me home, to a world I call my own! Green and gleaming, always streaming, never quite alone! Down the pipe I drift and dream tonight!"
- title: "DK Rap Remix"
  lyrics: "He's the leader of the bunch! You know him well! He's finally back — to kick some tail! HUH! DK! Donkey Kong!"
- title: "Rosalina's Observatory"
  lyrics: "Among the stars I watch and wait, guiding Lumas to their fate! The cosmos spin, the galaxies glow, there's so much the universe wants to show!"
