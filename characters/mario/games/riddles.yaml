- q: "I have keys but no locks, space but no room, and you can enter but can't go inside. What am I?"
  a: "keyboard"
  hints:
    - "You use it every day"
    - "It has letters and numbers"
    - "You type on it"
- q: "I go through towns and over hills but never move. What am I?"
  a: "road"
  hints:
    - "Cars drive on me"
    - "I can be paved or dirt"
    - "I connect places"
- q: "I can fly without wings, cry without eyes. Wherever I go, darkness follows. What am I?"
  a: "cloud"
  hints:
    - "I'm in the sky"
    - "I bring rain"
    - "I'm fluffy and white"
- q: "I have a head and a tail but no body. What am I?"
  a: "coin"
  hints:
    - "Mario loves me"
    - "I'm shiny"
    - "Flip me to decide"
- q: "The more you take, the more you leave behind. What am I?"
  a: "footsteps"
  hints:
    - "You make them when you walk"
    - "They can be big or small"
    - "They're on the ground"
- q: "I speak without a mouth and hear without ears. I have no body but come alive with wind. What am I?"
  a: "echo"
  hints:
    - "Bathrooms are great for this"
    - "I repeat what you say"
    - "Mountains have me too"
- q: "What has 88 keys but can't open a single door?"
  a: "piano"
  hints:
    - "It makes music"
    - "It has black and white keys"
    - "You play it sitting down"
- q: "I'm tall when I'm young and short when I'm old. What am I?"
  a: "candle"
  hints:
    - "I give light"
    - "I have a flame"
    - "Birthday cakes have many of me"
- q: "What gets wetter the more it dries?"
  a: "towel"
  hints:
    - "You use one after a shower"
    - "It hangs in the bathroom"
    - "It absorbs water"
- q: "I have cities but no houses, mountains but no trees, water but no fish. What am I?"
  a: "map"
  hints:
    - "You use me to navigate"
    - "I show locations"
    - "I can be folded"
- q: "What has a face and two hands but no arms or legs?"
  a: "clock"
  hints:
    - "It tells you something"
    - "I tick and tock"
    - "You wind me up or use batteries"
- q: "I'm light as a feather but you can't hold me for more than a few minutes. What am I?"
  a: "breath"
  hints:
    - "You do it without thinking"
    - "You need it to live"
    - "You can see it in cold air"
- q: "The more you have, the less you see. What am I?"
  a: "darkness"
  hints:
    - "I'm the opposite of light"
    - "Night is full of me"
    - "You see less with more of me"
- q: "I have a neck but no head. What am I?"
  a: "bottle"
  hints:
    - "You drink from me"
    - "I can be made of glass"
    - "I hold liquids"
- q: "What has three eyes but can't see?"
  a: "traffic light"
  hints:
    - "I'm on the street"
    - "I'm red, yellow, and green"
    - "I tell cars when to go"
- q: "What comes once a year but twice a week?"
  a: "e"
  hints:
    - "It's a letter"
    - "It appears in both words"
    - "It's the most common letter"
- q: "I run but never walk, I have a bed but never sleep. What am I?"
  a: "river"
  hints:
    - "I flow downhill"
    - "Fish live in me"
    - "I'm made of water"
- q: "What has a spine but no bones?"
  a: "book"
  hints:
    - "I have pages"
    - "You read me"
    - "I can teach you things"
- q: "I am always hungry, the more you feed me the bigger I grow, the more you starve me the smaller I become. What am I?"
  a: "fire"
  hints:
    - "I give warmth"
    - "I consume fuel"
    - "I produce light"
- q: "What invention allows you to look right through walls?"
  a: "window"
  hints:
    - "I'm made of glass"
    - "You can open me"
    - "I let in light"
- q: "What has ears but cannot hear?"
  a: "corn"
  hints:
    - "It grows in fields"
    - "You eat it on the cob"
    - "It's yellow and buttery"
- q: "I have hands but cannot clap. What am I?"
  a: "clock"
  hints:
    - "I show you the time"
    - "I tick and tock"
    - "I hang on the wall"
- q: "What begins with T, ends with T, and has T in it?"
  a: "teapot"
  hints:
    - "You brew something in me"
    - "I have a spout and handle"
    - "I whistle when I'm ready"
- q: "I can be cracked, I can be made, I can be told, I can be played. What am I?"
  a: "joke"
  hints:
    - "I make people laugh"
    - "Comedians tell me"
    - "I have a punchline"
- q: "What has a ring but no finger?"
  a: "telephone"
  hints:
    - "You answer me"
    - "I help you talk to people"
    - "I make a ringing sound"
- q: "I go all around the world but never leave the corner. What am I?"
  a: "stamp"
  hints:
    - "I'm small and sticky"
    - "I go on envelopes"
    - "You buy me at a post office"
- q: "What has a thumb and four fingers but is not alive?"
  a: "glove"
  hints:
    - "You wear me"
    - "I keep your hands warm"
    - "I come in pairs"
- q: "What can you hold in your right hand but never in your left?"
  a: "left hand"
  hints:
    - "Everyone has one"
    - "It's attached to you"
    - "Think about your own body"
- q: "I have legs but never walk. What am I?"
  a: "table"
  hints:
    - "You eat on me"
    - "I'm a piece of furniture"
    - "I usually have four of them"
- q: "What building has the most stories?"
  a: "library"
  hints:
    - "It's full of books"
    - "You can borrow from here"
    - "Knowledge lives here"
