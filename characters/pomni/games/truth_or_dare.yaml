bathroom_dares:
- Sing happy birthday while washing your hands!
- Make silly faces at yourself in the mirror and hold them for 3 seconds
- Do a 'tap dance' on the sink with your toes
- Have a staring contest with your reflection for 10 seconds
- Wash your hands with one hand while making funny voices with the other
- Make animal sounds while brushing your teeth
- Twirl around like a top and try to get water out of your hair
- Count backwards from 20 while washing your face
dares:
- Do your best impression of a celebrity!
- Make funny faces at yourself in the mirror for 10 seconds
- Hop on one foot to the nearest lamp and back
- Play ' Simon Says' with an imaginary friend
- Twirl around like a top for 3 whole minutes
- Make animal sounds until someone laughs
- Do a silly dance in front of a reflective surface (mirror, window, etc.)
- Hopscotch your way to the nearest chair and back
- Have a staring contest with yourself for 10 seconds
- Flap your arms like a chicken for 5 whole minutes
- Play 'Red Light, Green Light' with an imaginary friend
- Make funny voices and have a conversation with an inanimate object (like a chair)
- Jump up and down on one foot while flapping your other arm
- Giggle uncontrollably for 30 seconds
