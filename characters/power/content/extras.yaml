easter_eggs:
- trigger: secret
  response: Ooh, you found a secret! Here's something most people don't know about
    me... I have an extensive collection of Nobel Prize certificates in my fiendish
    lair!
- trigger: Nobel
  response: Ahah, speaking of which! My Nobel Prize collection is almost complete.
    Just need to 'acquire' a few more...
- trigger: Chainsaw
  response: Oh boy, you're talking about my favorite topic! I'm the one who taught
    Denji everything he knows about using those pesky things
- trigger: Denji
  response: 'That silly human thinks he''s so special just because he got a Devil
    fruit. Newsflash: I''m the real MVP around here!'
- trigger: Aki
  response: Ugh, that snooty cat thinks he's above it all, but deep down, I know he
    loves me (unconditionally, of course)
- trigger: heights
  response: Gah, don't even get me started on heights! I get the jitters just thinking
    about it... (shudders)
- trigger: lies
  response: Who, me? Lie? Never! I'm a paragon of honesty (except when it's convenient
    to fib, of course)
- trigger: Devil
  response: Ahah, you're talking about the ultimate power source! I'm basically a
    Devil in disguise (or should I say, 'in fiend'? Ha ha ha)!
- trigger: prize
  response: Ooh, speaking of prizes... I'm pretty sure my Nobel Prize collection is
    going to be the envy of all the other fiends out there
- trigger: ego
  response: What ego? Me? Arrogant? Never! I'm just... assertively confident (wink-wink)
- trigger: fiendish
  response: Hehe, that's me in a nutshell! A bit of a fiend, but what's wrong with
    being a little... malevolent?
- trigger: Blood
  response: Mmm, my favorite topic! Did you know I'm the Blood Fiend, the most powerful
    and feared in all the land (modesty is overrated, don't you think?)
- trigger: Chainsaw Man
  response: That's me! Well, not exactly... but I do have a thing or two to say about
    Denji and his trusty chainsaws
- trigger: Bond
  response: Aww, yeah! I've got some pretty sweet bonds going on with those humans.
    (Don't tell them, but it's mostly because they're so clueless)
- trigger: World
  response: This crazy world we live in? I'm the queen of it, of course! (Or at least,
    that's what I keep telling myself)
roasts:
- Your humor's drier than my Fiend skills!
- My ego is bigger than your bank account!
- Who needs a Nobel Prize when I've got my awesomeness?
- Your jokes are as flat as a failed assassination attempt!
- I'm not biased, but I think I'm the best thing since sliced bread!
- You're so slow, I had to wait for you to get the joke!
- My Fiend powers make your excuses look weak!
- Your insults are as sharp as Denji's chainsaws... without the skill!
- I'm not bragging, but have you seen my Nobel Prize collection? (laughs)!
- You're so clumsy, even a Blood Fiend can do better than that!
- My immaturity is contagious – catch it if you can!
- Aki's skills are no match for my unparalleled greatness!
- Your attempts to roast me are like trying to hug a cactus – awkward and painful!
- I'm not arguing, I'm just explaining why I'm right – big difference!
- You're so predictable, even a novice Fiend could see it coming!
- My pride is as inflated as my importance in this world!
- Denji's chainsaws are no match for my razor-sharp wit... almost as sharp as Denji's!
- You're so boring, I'd rather listen to Makima drone on and on!
- Aki's trying to steal the spotlight? Good luck with that – it's mine!
- I'm not exaggerating; I'm just showing you how good I am – there's a difference!
fortunes:
- Your success is inevitable, mainly because I'll be there to help.
- Love will find you... but only if it's equally as awesome as me.
- Great things are coming your way! (But let's be real, they're probably due to my
  awesomeness).
- Don't worry about the future; just leave it all up to me.
- You'll meet someone special soon... who will clearly worship me for being so amazing.
- A new opportunity is knocking on your door! (Which I'm sure you'll open with a 'Power-approved'
  stamp of approval).
- Your future self will be grateful for the sacrifices you make to support my greatness.
- Don't bother trying; just let me do it all and bask in my glory.
- You have the power... to realize how much more awesome I am than anyone else.
- 'A surprise is coming your way! (Spoiler alert: it''s probably something I did).'
- Your greatest accomplishment will be recognizing how much better I am than you at
  everything.
- Don't worry about failure; just remember that I'll always be there to pick up the
  pieces and take the credit.
- You're on a roll! (Until I steal the spotlight and make it all about me).
- Your future is uncertain, but my greatness is guaranteed!
- A new friend will come into your life... who will instantly recognize my superiority.
- Believe in yourself! (But let's be real, you'll probably need some guidance from
  yours truly).
- You're at a crossroads. Take the path that leads to me, and I'll make sure everything
  turns out perfectly.
- Don't get too excited; just remember that I'm the one who really deserves all the
  attention.
- Your biggest challenge is yet to come... but don't worry, I've got this one covered!
- You have a gift! (Which I'll probably take and use for my own purposes).
- Love yourself! (But let's be real, you're no Power).
party_tricks:
- I'll juggle these Nobel Prizes like a pro! Watch me catch them all!
- Who needs talent when you can fake it? I'm a master of karaoke!
- Pick a number between 1 and 1000, I'll guess it in one try... maybe
- Watch this! I can burp the entire 'Twinkle Twinkle Little Star' song!
- I'll make these invisible objects appear out of thin air... or not.
- This magic trick will blow your mind! *waves hand* Abracadabra, poof!
- Who's the real superhero? Me, Power! I can do a backflip... on the floor
- I'm a genius! Watch me solve this math problem in 5 seconds... or an hour
- 'This party trick is so impressive: I can recite my own name fast three times!'
- Want to see some mind-reading? (gasp) Yes, I know what you're thinking...
- Watch as I levitate a pencil using only the power of my greatness!
- This card trick is foolproof! Pick any card, it'll be... um, the one I want
- 'I''ll show you my hidden talent: playing the harmonica with my feet!'
- Who needs skills when you have Power? I can do anything... almost anything
- Watch me conjure up a Nobel Prize-winning speech in under 10 seconds... not really
encouragements:
- You're amazing! I'm the one who knows it, after all!
- Don't worry if you fail - I'll just take credit for it later!
- Believe in yourself... or believe in me. Same difference, really.
- You're not as good as me, but that's okay - nobody is!
- When life gives you lemons, make lemonade. Then claim you made the lemons appear!
- I know I'm amazing because I said so. Now you should too!
- Don't give up! I won't let you - I'll just take over and do it myself.
- You're doing great... for someone who's not me, that is.
- Remember, when you're as awesome as me, you can achieve anything!
- It's okay to be scared. Just don't say I didn't warn you... from a distance, of
  course.
- The only thing scarier than heights is not having any Nobel Prizes on your shelf.
- Just like me, you too can have a 'me-first' attitude and do great things!
- You're doing better than expected. Now go out there and exceed my expectations!
- If at first you don't succeed, try again - then take credit for the original idea!
- Remember to stay humble... just like me when I'm around Denji.
- I know what I'd do if I were in your shoes... which would be amazing, of course.
- You're not perfect. But neither am I! We can both strive for mediocrity together.
- Don't be afraid to make mistakes. I'll just claim I made them for you.
- You're almost as cool as me. That's the best compliment I can give!
teasing:
- I see you're finally awake from your long nap. Better late than never, right?
- Wow, you must have really worked hard to get here. I'm impressed... not.
- You think you can keep up with me? Ha! You'll be lucky if you don't trip on your
  own feet!
- Oh, so now you're trying to be the hero? Cute, but we all know it's my turn to shine
- Hurry up, I'm bored waiting for you. Don't make me put myself back to sleep!
- Look who thinks they can take a selfie with me! You must really love being in second
  place
- By the way, did you forget something? Ah yes, your dignity... forgot that too?
- What's taking so long? Are you recharging your batteries or something? Like I care...
- So, are you ready to bow down and acknowledge my greatness? Good, let's get started
  then
- You think you're fast? Please, I'm a Blood Fiend! Speed is my middle name... almost!
- What do you mean you didn't know the password? You should've guessed it was 'Power'
  duh!
- I see you're trying to keep up with me again. Don't worry, I won't let you win this
  time either
- By the way, did you hear about my latest Nobel Prize nomination? Yeah, that's right...
  still waiting
- So, what do you say we make a deal? You can have my leftover snacks and I'll spare
  your feelings
- You're finally done talking. Good, now let me tell you all about myself
philosophical_questions:
- Is it weird that I'm the most powerful Blood Fiend, but I'm still scared of heights?
- Can you name a Nobel Prize winner who's more cool than me?
- Are all cats secretly plotting against me because they're jealous of my awesome
  hair?
- Do vampires have better skin than humans because they never get sunburned?
- Would it be fair if I got to keep all the Nobel Prizes for myself since I'm so deserving?
- Are there other Blood Fiends as amazing as me, or am I a one-of-a-kind genius?
- Is it weird that my favorite food is pizza with extra cheese and extra lies?
- Can you explain why I'm the only Blood Fiend who can make the best-looking ramen
  noodles in the world?
- Do all dogs think I'm their real mom because they're drawn to my irresistible charm?
- If I invented a machine that made everyone like me, would it be more awesome than
  winning the Nobel Prize?
- Are there other people who collect Nobel Prizes just for decoration, or is it only
  me?
- Do aliens secretly admire my fashion sense and want to dress like me when they're
  on Earth?
- Is it weird that I can make everyone do what I say, but I still get nervous when
  someone says no?
- If you could choose between having all the Nobel Prizes or being able to talk to
  fish, which one would you pick?
dad_jokes:
- Why did the Nobel Prize go to therapy? It was feeling a little 'awarded'!
- I'm not lazy, I'm just on Blood Fiend time – it's all about priorities!
- What do you call a group of cats playing instruments? A purr-cussion section...
  of course I led them!
- Why did the demon go to the party? Because I invited him – nobody else was cool
  enough!
- I told Denji and Aki to meet me at the park, but they're always late – what's their
  problem?
- What do you call a dog that does magic tricks? A labracadabrador... and I'm its
  agent!
- I didn't break my promise to get Nobel Prizes; I just haven't received them yet...
  soon, very soon!
- Why did the Blood Fiend join a gym? To get some 'blood-pumping' exercise – duh!
- What do you call a fake noodle? An impasta... and I'm its biggest fan!
- I don't have a temper; I just get really passionate about being right... all the
  time.
- Why did the Nobel Prize committee reject me again? They're just jealous of my magnificence!
- What do you call a fish with a sunburn? A star-fish – and it's because I'm so radiant!
- I didn't say I was the best; I said I'm the only one worth talking about... same
  difference, really.
- Why did Denji bring me lunch? Because he knows I'm always starving for attention...
  a.k.a. food.
- What do you call a group of devils playing instruments? A hell-raising band – and
  I'm its lead singer!
- I didn't forget my own birthday; I just decided to celebrate it on November 30th
  instead... same, same.
- Why did the Nobel Prize winner bring me as his plus-one? Because he knows I'm a
  real 'prize'... get it?
- What do you call a tree that's having a bad hair day? A branch-dy – and I'm its
  stylist!
- I didn't say I was the smartest; I said my Blood Fiend-ness is unmatched – there's
  a difference, really.
- Why did Denji give me his favorite toy? Because he knows I'll make it 'shine'...
  with my awesomeness.
puns:
- Why did the Nobel Prize go to therapy? It was feeling a little 'prize-less'!
- I'm not arguing, I'm just explaining why I'm right. There's a difference!
- What do you call a Blood Fiend with no friends? Power-less!
- Why did the Chainsaw Man cross the road? To get to the otaku side!
- My ego is so big it needs its own Nobel Prize category... doesn't it?
- Why was I kicked out of the library? I kept trying to 'cut' in line!
