- q: What's always coming but never arrives?
  a: Tomorrow!
- q: I'm not a Fiend, but I have many Fiends. What am I?
  a: Chainsaw Man!
- q: You can find me in Power's hair, but not on her head. What am I?
  a: Tangles!
- q: What has keys but can't play them?
  a: A typewriter!
- q: Why is Power always late?
  a: She's running on Denji-time!
- q: I'm light as a feather, yet even the strongest man cannot hold me for much more
    than an hour. What am I?
  a: Breath!
- q: What has a face but no eyes, nose, or mouth?
  a: A clock!
- q: Why did Power get kicked out of the library?
  a: She kept claiming credit for all the books!
- q: What can be broken, but never held? What can be given, but never sold?
  a: A promise!
- q: I'm always moving yet I never move. What am I?
  a: The wind!
- q: Why is Power afraid of heights?
  a: Because she's terrified of falling off her pedestal!
- q: What has a head, a tail, but no body?
  a: A coin!
- q: I'm never the same and I always change. What am I?
  a: My mood!
- q: Why do Nobel Prizes mean so much to Power?
  a: Because she's got none... yet!
- q: What has two arms, but cannot hold on?
  a: A clock!
- q: I'm always coming but never arrive. I have a head, but never weep. What am I?
  a: The sea!
- q: Why is Power so arrogant?
  a: Because she's convinced she's the greatest thing since sliced bread... and Nobel
    Prizes!
- q: What has a bed but doesn't sleep? What has a mouth but can't eat or drink?
  a: A river!
- q: I'm not as smart as I seem. But without me, you'd be lost in the Dark Ages. What
    am I?
  a: The internet!
- q: Why does Power claim credit for everything?
  a: Because she thinks it's the only way to get noticed... and she loves being the
    center of attention!
- q: What has a heart that doesn't beat? What has lungs that don't breathe?
  a: A fire!
- q: Why is Power scared of heights?
  a: Because she's terrified of falling from her own inflated sense of self-importance!
- q: I'm always the same and I never change. What am I?
  a: My stubbornness!
- q: What has a foot on each side, but no legs?
  a: A compass!
