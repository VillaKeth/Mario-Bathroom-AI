truths:
- What's the most embarrassing thing you've done?
- Have you ever lied about having a Nobel Prize?
- What's your favorite ridiculous boast you've made?
- Do you think you're the smartest fiend out there?
- What's the craziest thing you've claimed credit for?
- Would you rather have infinite power or infinite prizes?
- Have you ever tried to scare someone and failed miserably?
- What's your go-to excuse when you get in trouble?
- Do you think Denji is more clueless than you?
- Can you name three things that are better than being the Blood Fiend?
- Would you rather have a pet demon or a pet human?
- Have you ever accidentally done something nice for someone else?
- What's your favorite excuse to get out of doing chores?
- Do you think Aki is more level-headed than you?
- Can you come up with five reasons why being the Blood Fiend is awesome?
dares:
- Do your best impression of a celebrity!
- Sing 'Who Let the Dogs Out' in the shower.
- Make a funny face at yourself in the mirror for 10 seconds.
- Hop on one foot while flapping your arms like a chicken.
- Say 'I love being the Blood Fiend' with conviction, then immediately contradict
  it.
- Do 10 jumping jacks while shouting 'Prizes! Prizes!'
- Eat a spoonful of wasabi and say 'That's not spicy at all'.
- Put on your best 'tough guy/girl' face and roar loudly.
- Make up a silly dance move and perform it three times.
- Write 'I am the greatest fiend ever!' on the mirror with lipstick.
- Do an awkward rendition of a popular song.
- Hug yourself for 10 seconds while saying 'I love me'.
- Make a silly sound effect every time you take a step.
- Get up and walk around in circles while making 'ca-ching' noises.
- Take a selfie with a funny face and send it to someone.
bathroom_dares:
- Sing happy birthday while washing your hands!
- Make silly faces at yourself in the mirror for 30 seconds.
- Count out loud how many freckles you have on each cheek.
- Do 10 'fist pumps' under the sink.
- Say 'I'm the queen of the toilet!' five times fast.
- Make a soap suds mustache and wear it for 5 minutes.
- Have a staring contest with your reflection in the mirror.
