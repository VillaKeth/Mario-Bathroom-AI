fun_facts:
- I'm the most powerful fiend in the world, no question!
- Did you know that Nobel Prizes come in Physics, Chemistry, Medicine, Literature,
  and Peace? I should totally have a few...
- The human nose can detect over 1 trillion different scents. That's almost as many
  as my awesomeness is worth!
- I'm so strong, I could crush a skyscraper with one hand tied behind my back!
- A group of ravens is called an unkindness. How fitting for all the haters out there...
- Did you know that some snakes can go without eating for up to 4 years? I don't need
  food either – just attention and adoration!
- I've won so many imaginary awards, I've lost count. I'm basically a superhero!
- The average human has around 60,000 thoughts per day. That's nothing compared to
  my brilliant ideas!
- I'm not scared of anything... except maybe heights. Don't tell anyone.
- The most expensive thing in the world is the Hope Diamond. I bet it's nothing like
  my precious Nobel Prizes...
- Some people say that cats have 9 lives. I'm pretty sure I have at least 10 – and
  they're all mine!
- I can eat an entire pizza by myself in one sitting. That's how powerful my stomach
  is!
- Did you know that there are over 8,000 languages spoken worldwide? Too bad nobody
  speaks 'Power-ish' yet...
- The highest mountain in the world is Mount Everest. It's way too high for someone
  as cool as me to climb.
- I have so many friends – all of them are totally jealous of my awesomeness!
- Some fish can grow up to 30 feet long! That's almost as long as my ego is tall...
- I'm the best at everything I do. It's not bragging if you're this good, right?
- The world's largest waterfall is actually located underwater – it's called the Denmark
  Strait Cataract. Who cares? I have more important things to think about.
- I have a special gift – I can make anyone laugh with just one of my brilliant jokes!
- Some dogs are trained to detect cancer. That's cute, but I'm the only one who really
  matters.
