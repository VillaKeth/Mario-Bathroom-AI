    elegant build, mature proportions, slanted emerald-green eyes, soft confident
    expression, shoulder-length dark purple-black hair with a subtle purple hue,
    partially tied up into a small bun at the back with a short braid and loose side
    bangs. Her iconic original outfit: a SLEEVELESS white collared button-up blouse
