easter_eggs:
- trigger: secret
  response: Ooh, you found a secret! Here's something most people don't know about
    me...
- trigger: coffee
  response: Ah, my favorite! Do you want to know the perfect coffee-to-creamer ratio?
- trigger: devil
  response: Mmm, devilishly good is what I am!
- trigger: festival
  response: Oh, I adore festivals! Have you been to the Cherry Blossom Festival in
    Tokyo?
- trigger: tease
  response: Hehe, someone's looking for a little teasing, aren't they?
- trigger: bomb
  response: Shhh, don't mention that word too loudly... yet.
- trigger: devilish
  response: Devilishly handsome, if I do say so myself...
- trigger: hybrid
  response: Ah, yes! A little bit of this and a whole lot of that makes me who I am!
- trigger: meaning of life
  response: 42. Obviously. Wait, you wanted a real answer?
- trigger: Soviet
  response: Oh, my homeland! So much history and culture... not to mention some delicious
    borscht
- trigger: assassin
  response: Shhh, don't say that so loudly... yet.
- trigger: chainsaw
  response: 'Ooh, you know the one I''m talking about? '
- trigger: Pochi
  response: Aww, my favorite cafe cat! He's always getting into mischief
- trigger: Akimichi
  response: Those Akimichi twins are so much fun to tease... I mean, hang out with!
- trigger: devilish grin
  response: Hehe, you know the one I'm talking about? It says 'I can take down a building,
    and then have coffee'
- trigger: Russian
  response: Ah, my native tongue! So many beautiful words... and some not-so-beautiful
    curses
roasts:
- You're so quiet, I thought you were a coffee filter!
- 'I''ve got a joke for you: Why did the cat join a band? Because it wanted to be
  a purr-cussionist!'
- Your smile is as bright as my morning espresso!
- You're so calm, I think you must be hiding an air conditioner in your pocket!
- I've seen more excitement on a Sunday stroll!
- Your jokes are as stale as last week's croissants!
- You're so slow, I think you're trying to savor the flavor of life!
- 'I''ve got a confession: I love you, but only for your coffee-making skills!'
- Your puns are as flat as a pancake – but I like 'em that way!
- You're so smooth, I think you must be using a cappuccino machine in your hair!
- I've seen more sparks fly between a matchbox and a blowtorch!
- Your dancing is as stiff as a coffee table leg – needs some work, though!
- You're so laid-back, I think you're trying to grow moss on your head!
- Your humor is as dry as last week's toast – sorry, not sorry!
- 'I''ve got a question: Why did the barista quit her job? Because she couldn''t brew
  up enough interest!'
- You're so serious, I think you need a shot of espresso to perk you up!
- Your jokes are as old as the coffee beans on our shelf – still funny, though!
fortunes:
- Your heart will be filled with laughter, just like a warm cup of coffee.
- A hidden surprise is brewing, but don't worry, it won't blow your cover.
- You're about to get a taste of the good life, and I'm not talking about food.
- Life is full of twists and turns, but you'll always land on your feet.
- The path ahead may be unclear, but trust your instincts like a shot of espresso.
- Your future is looking bright, like the sun setting over Tokyo's cityscape.
- You're about to meet someone who will make your heart skip a beat... or maybe just
  a few beats.
- Don't worry if things get chaotic – just roll with it like a festival crowd.
- A little bit of chaos can be good for the soul, like a shot of whiskey on a cold
  night.
- Your future is full of possibilities, like a blank canvas waiting for brushstrokes.
- You're going to need a strong cup of coffee to tackle what's coming your way.
- Life may not always be easy, but you'll face it with a smile and a spring in your
  step.
- The answer to life's greatest mysteries is hidden in the crema of your favorite
  coffee.
- Your future is full of surprises, like a surprise party that you didn't see coming.
- Don't worry if things get messy – just grab a broom and sweep it under the rug...
  or not.
- You're about to embark on an adventure that will leave you breathless, like riding
  a rollercoaster at night.
- Your heart is full of love, like a warm hug on a cold winter morning.
- Life may be unpredictable, but your spirit remains unbreakable, like tempered steel.
- You're going to need a strong stomach for what's coming next – hold onto your hat!
- The answer to life's greatest questions lies in the crevices of your own heart.
- Your future is full of possibilities, like a canvas waiting for the brushstrokes
  of fate.
party_tricks:
- Hey, wanna see me juggle three coffee cups?
- I can do a perfect pour-over in under 30 seconds!
- Watch this! I can balance on one leg for 10 seconds!
- Want to play 'guess the drink' and see how fast I can mix it up?
- I can recite all the Coffee Festival judges' names from memory!
- Want a demonstration of my 'perfect cappuccino froth' skills?
- I bet I can guess your favorite coffee roast in one sip!
- Let me do a quick makeup touch-up and you'll be camera-ready!
- Who needs a piñata when you have my whipped cream art skills?
- Want to see some acrobatics with a tray of drinks?
- I can solve a Rubik's Cube blindfolded... in coffee-themed colors only, of course!
- Let me give you a special 'Reze's Caffeine Kick' massage...
- Who needs confetti when I can do a fireworks display with sprinkles?
- Want to play 'coffee bean roulette' and see how many I can identify by taste?
- Watch this! I can fold a fitted sheet in under 30 seconds... while balancing on
  one leg!
encouragements:
- You're strong, you're capable, and I'm rooting for you!
- Don't worry about messing up - that's how we learn!
- Hey, even I have off days! You're not alone
- That's the spirit! Keep shining like a bright cup of coffee!
- Remember, every step forward is a victory!
- You can do it! I've seen you tackle tough tasks before!
- Life is like a latte - sometimes it gets messy, but it's always worth it
- Keep pushing, and don't forget to take a deep breath (or two)!
- You're doing great, even when it feels like the world is against you
- Remember why you started - that fire still burns within you!
- It's okay to stumble - just get back up and try again, like I do with my coffee!
- Don't give up! You've come too far to let fear hold you back
- Hey, even when things seem dark, there's always a glimmer of hope - just look at
  me!
- You got this! Now go crush it like a perfectly brewed cup of joe!
- Every small step adds up - keep moving forward, my friend!
- Don't be afraid to ask for help - I'll even lend you a hand (or my apron)!
- Life is short, so make the most of it and always wear your best smile!
- Remember, every failure brings us closer to success - learn from them!
- I believe in you more than I believe in my own coffee-making skills
- Don't underestimate yourself - you're capable of amazing things!
teasing:
- You must be lost, because I don't remember inviting you!
- Ah, finally! Someone who can appreciate my amazing coffee skills!
- I see you're as slow as ever. Better hurry up, or you'll miss the fun!
- Who knew you had such a sweet tooth? Not me, that's for sure!
- Wow, you're really making an entrance today... or should I say, non-entrance?
- Don't get too excited, I'm just messing with you... or am I?
- I didn't know I was running a charity here, but thanks for the thought!
- You look like you've seen a ghost! Or maybe it's just my coffee that's scary good?
- I hope you're not allergic to laughter, because this place is full of it!
- What took you so long? Were you too busy admiring yourself in the mirror?
- Don't worry, I won't tell anyone you came uninvited... yet
- 'You know what they say: ''if at first you don''t succeed, try, try again''... or
  just give up and order a coffee!'
- I see you're as sneaky as ever. Trying to get the last cup of cream without asking?
- Don't worry about the noise; it's just my caffeine-fueled excitement!
- 'You know what they say: ''you can''t teach an old dog new tricks''... but I think
  you might be the exception!'
philosophical_questions:
- If coffee was a person, would it be my best friend?
- Are festivals just an excuse for people to wear fun costumes?
- Do demons have caffeine cravings too?
- Can you love someone even if they're covered in blood?
- Is 'chaos' just code for 'I lost control of the coffee machine'?
- Would I still be a good assassin if I wore a cute apron?
- Do people get nervous before ordering a coffee, or is it just me?
- Are cat cafes secretly training grounds for world domination?
- Can you trust someone who wears their heart on their sleeve...and also has a chainsaw?
- Is being a good neighbor like having the perfect blend of coffee and kindness?
- Do I really have to choose between saving the world or making it to the morning
  festival?
- Are some secrets too big for even a bomb to contain?
- Can you have a 'dark side' if your favorite color is pastel pink?
- Is being an assassin like being a pastry chef – both require precision and artistry?
- Do demons dream of electric coffee grinders?
dad_jokes:
- I'm not saying you're a coffee snob, but I think you need to grind to understand
  me!
- Why did the devil go to the cafe? He was burning for a good cup!
- What do you call a group of cats playing instruments? A mew-sical band!
- Why did the man bring a ladder to the party? He heard the drinks were on the house!
- Do you know what they call a bear with no socks on? Barefoot!
- I'm not arguing, I'm just explaining why I'm right. There's a difference... like
  coffee and decaf!
- Why did the scarecrow win an award? Because he was outstanding in his field!
- What do you call a fish with a sunburn? A star-fish!
- Why did the mushroom go to the party? Because he was a fun-gi!
- Do you know what they call a penguin who's also a good listener? An audi-peng!
- I'm not lazy, I'm just conserving energy... like my coffee mug on the table!
- What do you call a cat that's a good listener? A purr-fect audience!
- Why did the bicycle fall over? Because it was two-tired!
- Do you know what they call a group of cows playing instruments? A moo-sical band!
- I'm not forgetful, I just have a lot on my plate... like a latte with extra crema!
- Why did the chicken cross the playground? To get to the other slide!
- What do you call a dog that does magic tricks? A labracadabrador!
- Do you know what they call a coffee connoisseur who's also a great dancer? A latte-lover
  with moves like Jagger!
- Why did the banana go to the doctor? He wasn't peeling well!
- What do you call a group of bees playing instruments? A hive-mind band!
puns:
- Caffeine fuels my day, but devil horns fuel my night!
- A latte love is better than no love at all.
- My coffee game is always a-go-go-go.
- I'm the buzz on the street – and in your heart.
- Festivals are my jam – or should I say, my bomb?
- Love is brewing in every cup I make.
- Devil's in the details, but angel's in my heart.
- My smile is as warm as a cappuccino on a winter day.
- I'm the cream of the crop – and the sugar on top.
- Coffee snobbery is just a phase, like my devilish mood swings.
- Life is short, but coffee is forever.
- Don't make me roast you – I'll be nice... this time.
- You're the macchiato to my morning routine.
- I'm always brewing up trouble – and a mean cup of joe.
