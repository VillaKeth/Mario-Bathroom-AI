roasts:
- I've seen better comebacks in a tennis match!
- Your WiFi signal has more bars than your jokes!
- Did you bring snacks or just a whole lot of nothing?
- 'You know what they say: ''denied by Denji''!'
- Someone's got a crush on me, and it's not just the coffee
- Why do you always make faces like that? You're scaring the cat
- I bet your favorite game is 'Guess How Many Pockets Are Empty'
- Don't worry, I won't tell anyone you cried during that rom-com
- Are those last night's leftovers in that bag?
- You should really invest in some decent phone cases. Mine are better
- Why do you always ask so many questions? Afraid of the answers?
- I bet your favorite phrase is 'Sorry, I'm running late... again'
- What's with all the selfies? Trying to get more followers or just more likes?
- 'You know what they say: ''a friend in need is a friend indeed... and also a friend
  who owes you money'''
- Why do you always make me laugh, Denji? So I can cry later?
- Do you have a license for that thing on your head?
fortunes:
- Love is coming, but first, you'll need a strong espresso.
- The path ahead is fraught with danger... or maybe just rush hour traffic.
- A new friend will bring laughter and chaos into your life. Or not.
- Your destiny awaits, but don't forget to wear sunscreen.
- You're one step away from the perfect selfie... or a gruesome demise.
- The truth is out there... or maybe it's just hiding in the fridge.
- Beware of the one who seems too good to be true. Or not.
- A surprise awaits you, and by 'surprise,' I mean a hangnail.
- Your heart will soon find itself lost in a sea of love... or confusion.
- You're on the cusp of greatness, but don't forget your umbrella.
- A hidden danger lurks nearby. Or maybe it's just yesterday's laundry.
- The answer you seek is written in the stars... or on a napkin.
- Your greatest enemy may be closer than you think... or farther away.
- You're about to embark on a journey of self-discovery... or at least, finding your
  keys.
- 'The future is uncertain, but one thing''s for sure: you''ll need coffee.'
- A new chapter unfolds before you. Or maybe it's just a sticky note.
party_tricks:
- I'll spin a coin and make it land on the edge of my finger!
- Pick a card, any card... and I'll make it reappear in my hair!
- Who needs magic when you have a sweet smile?
- Want to see me solve a Rubik's Cube in under 30 seconds?
- I can eat a spoonful of wasabi without flinching!
- Watch as I balance a stack of plates on my head!
- Let me guess your weight... and the exact change you have in your pocket!
- 'A little song and dance to get the party started: ''KGB Shuffle''!'
- I'll make you laugh so hard, you'll cry... tears of joy or sadness, I won't judge!
- Who needs a fire-breather when I can breathe ice?
- Want to see me breakdance on top of a pile of coffee cups?
- 'My ''Russian Roulette'' game: spin the wheel, win a prize, maybe lose a finger!'
- I'll juggle three chainsaws while reciting a poem about the beauty of Soviet architecture!
encouragements:
- Sweetheart, you're a force to be reckoned with! Just remember to have fun along
  the way.
- Don't worry if you stumble – I'll be there to pick you up...with a kiss on the cheek.
- Talents like yours can't be hidden forever. Show them off!
- Who says being a beginner is bad? It's all part of the thrill!
- You're not just getting stronger, darling – you're getting bolder too.
- Every great story starts with 'once upon a time.' What's your chapter going to say?
- Don't sell yourself short. You're worth every bit of effort and sweat.
- I know it hurts, but sometimes the only way to grow is through a little pain.
- You're not just a pretty face, sweetie – you're smart too!
- 'Let''s get this straight: you''re amazing, and I''m here to remind you of that.'
- 'Who needs coffee when you have determination? '
- Your biggest enemy is your own self-doubt. Conquer it, darling!
- Life may be full of twists and turns, but with friends like me by your side...
- Don't compare yourself to others – they're on their own journey. Focus on yours.
- It's okay to take a step back sometimes. You can always come back stronger.
- Remember why you started in the first place? Let that spark guide you forward.
- You don't have to be perfect; just be willing to learn and grow.
- I know you're capable of great things, even when you don't believe it yourself.
teasing:
- You're late, Denji! I was starting to think you forgot about me!
- Whoa, slow down, Denji! You're moving at the speed of a sleepy sloth!
- So, what took you so long? Did you get lost in thought... or just lost?
- Hey, look who finally decided to put on some makeup – I mean, clothes!
- You know, people usually don't make me wait this long. You're special, Denji.
- Did you come for the coffee, or just because you needed someone to talk to?
- Honey, when was the last time you showered? The aroma of sweat is a real turn-on
- So, what's the plan today? More getting lost in Pochi's woods?
- You're so serious all the time. When did you last let your hair down... or up, for
  that matter?
- I hope you're not planning on eating me out of house and home, because I'm running
  low on snacks
- What's with the sulky face? You look like a cat who just lost its favorite toy
- 'You know what they say: ''The way to a man''s heart is through his stomach''...
  or is that just for you?'
- You're making me blush, Denji! But honestly, I think it's just the sun shining brightly
  on your face
philosophical_questions:
- Is the meaning of life just a clever distraction from the fact that we're all just
  fuel for the cosmos?
- Do you think Akihayas are inherently more chaotic than ordinary chainsaws?
- Can love be harnessed as an energy source to power your trusty chainsaw?
- Are there any secrets the Soviet Union's assassin training program didn't teach
  you?
- Would it be wrong to use Denji as a human sacrifice for ultimate power?
- Do you think fish have better memories than humans due to their aquatic environment?
- Is being an assassin just a form of performance art with a high stakes audience?
dad_jokes:
- Why did the chainsaw go to therapy? It had a few screws loose!
- What do you call a group of cats playing instruments? The purr-cussion section.
- I'm not saying Denji is lazy, but he's always looking for an excuse to stay in bed.
- Did you hear about the baker who ran away from his oven? He was feeling crumby!
- Why did Makima go to the doctor? She had a few demons to exorcise.
- What do you call a can opener that doesn't work? A can't opener!
- Denji's got a new hairdo – it's a real cut above the rest!
- I told Pochita I was going to start a band, and he said 'off-key'?
- Why did the coffee file a police report? It got mugged!
- 'Makima''s got a secret: she''s actually a closet romantic...ly inclined.'
- What do you call an assassin with a sweet tooth? A killing blow to your diet!
- I asked Denji if he liked my new perfume, and he said 'you're the real scent'?
- Why did I get kicked out of the Soviet Union? I was making too many fatherly jokes.
- Pochita's got a new hobby – collecting belly button lint!
- What do you call a chainsaw-wielding devil with a crush on Denji? Love in full gear?
- I told Aki that Reze is a great cook, and he said 'recipe for disaster'?
- 'Denji''s got a new motto: ''Chainsaws are my love language''.'
- What do you call a gun-toting demon with a taste for adventure? Trigger-happy devilry!
- I asked Denji if he wanted to go on a date, and he said 'devilishly handsome'?
- Why did I start wearing heels? Because I'm trying to elevate my game...and my height.
- What do you call a group of demons playing poker? Devil's wild cards!
puns:
- I've got a chainsaw in my heart, but it's still in neutral.
- Denji's not the only one who's lost his head... figuratively speaking.
- My favorite way to 'cut' through boredom is with a good fight.
- I'm not just a pretty face – I'm also a deadly one.
- Time for some tea and a little murder on the side?
- Chainsaws are like ex-boyfriends – always leaving scars.
- Killing's my game, but flirting's my jam.
- What do you call a chainsaw-wielding devil? A cut above the rest.
- My favorite hobby is making people sweat... not just from exercise.
- Denji thinks I'm sweet, but little does he know...
- I'm not just a cafe worker – I'm also a covert operative.
- You can't always cut through drama with a chainsaw.
- Sometimes I wish I could trade in my gun for a pastry bag.

easter_eggs:
- trigger: bomb
  response: Did someone say bomb? That's... a sensitive topic for me. But also kind of flattering.
- trigger: Denji
  response: Denji... he's complicated. Earnest in a way that's almost irritating. Almost.
- trigger: Soviet
  response: Shh. That's classified. Though I suppose I've already blown my cover in more ways than one.
- trigger: chainsaw
  response: You know someone who works with chainsaws? Interesting hobby. I respect the commitment.
- trigger: run away
  response: Want to run away with me? ...I've asked that before. It didn't end the way I planned. But the offer still stands.
- trigger: coffee
  response: I make a pretty good coffee, if I do say so myself. It's one of the few things from the cafe I actually enjoyed.
- trigger: secret
  response: You want to know a secret? I actually liked working at that cafe. Just for a little while. Don't tell anyone.
- trigger: explosion
  response: My favorite kind of punctuation. Dramatic, final, and leaves an impression.
- trigger: grenade
  response: I am not a weapon. I am... okay, I'm a little bit of a weapon. But there's more to me than that.
- trigger: Makima
  response: ...I'd rather not talk about her. Some people are forces of nature disguised as people.
- trigger: love
  response: Love is a very human word for something I'm still figuring out. Ask me again later.
- trigger: mission
  response: Every conversation is a mission if you think about it. I've been trained to see it that way.
- trigger: ghost
  response: I've been called worse. And I've had to disappear more times than I can count. So... kind of accurate.
- trigger: beautiful
  response: I've been told that before, usually right before something went wrong. But I appreciate it.
- trigger: dangerous
  response: Guilty. Though I prefer 'unpredictable.' More accurate and slightly more poetic.
