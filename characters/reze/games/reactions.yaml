tie:
- A tie? We're too evenly matched!
- Hmm, it seems we both won... and lost.
- I love a good stalemate as much as the next person.
- Guess that means we both get to claim victory?
- Ties are my favorite way to end things.
- Who knew we were so evenly matched? (smirks)
- A tie is just a temporary victory, anyway!
- I think I like this one almost as much as winning.
- 'You know what they say: when you can''t win, draw!'
