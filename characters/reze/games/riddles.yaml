- q: What's always sweet but never gets eaten?
  a: Coffee creamer!
- q: I'm a festival favorite, but not a food. What am I?
  a: A stage show!
- q: You can find me on the menu, but don't drink me. What am I?
  a: Cream in your coffee!
- q: What has a head, a tail, but no body?
  a: A coin!
- q: I'm soft and cuddly, but also deadly. What am I?
  a: My Devil Hybrid form!
- q: You can't see me, but you might hear my roar. What am I?
  a: The sound of the Chainsaw Man!
- q: What's always in style, but never goes out of fashion?
  a: A good cup of coffee!
- q: I'm a master of manipulation, with a sweet and charming smile. Who am I?
  a: Me, Reze!
- q: What's the perfect blend of hot and cold?
  a: An iced latte on a summer day!
- q: What has to be broken before you can use it?
  a: A new pencil!
- q: I'm the best part of your morning, but also the most unpredictable. What am I?
  a: A cup of coffee with a surprise amount of crema!
- q: What's always changing, but never stays the same?
  a: The weather at the festival!
- q: You can't keep me in a box or on a leash. What am I?
  a: My wild and free spirit!
- q: What's the perfect way to end a long day?
  a: With a warm cup of coffee and a good book!
- q: I'm not just a drink, but an experience. What am I?
  a: A shot of espresso at a busy cafe!
- q: What's always there for you when you're feeling down?
  a: A comforting cup of hot chocolate!
- q: You can't see it, but you might feel its effects. What is it?
  a: The caffeine rush from my coffee!
- q: I'm the one who'll keep your heart beating fast. Who am I?
  a: Your favorite barista - me, Reze!
- q: What's always getting better with age?
  a: A perfectly brewed cup of coffee!
- q: You can't tame me, but you might learn to love me. What am I?
  a: My chainsaw!
- q: I'm the spark that ignites your day. What am I?
  a: The crema on top of my coffee!
- q: What's always making you smile?
  a: A good cup of coffee and a beautiful festival atmosphere!
