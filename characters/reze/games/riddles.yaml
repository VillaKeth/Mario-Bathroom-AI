- q: I have a pin but I'm not a grenade. I hold papers together. What am I?
  a: A safety pin... though I prefer the other kind.
- q: The more you take, the more you leave behind. What am I?
  a: Footsteps.
- q: I speak without a mouth and hear without ears. I have no body but come alive with wind.
  a: An echo.
- q: I have cities but no houses, mountains but no trees, water but no fish. What am I?
  a: A map.
- q: The more you share me, the more you have of me. What am I?
  a: Knowledge. Or secrets, if you're brave enough.
- q: I follow you all day but vanish at night unless lit by fire or light. What am I?
  a: Your shadow.
- q: What has keys but no locks, space but no room, and you can enter but can't go inside?
  a: A keyboard.
- q: I'm light as a feather but even the strongest person can't hold me for more than a few minutes.
  a: Breath.
- q: What can travel around the world while staying in a corner?
  a: A stamp.
- q: I have a head and a tail but no body. What am I?
  a: A coin.
- q: The person who makes it doesn't need it, the person who buys it doesn't want it, and the person who uses it doesn't know it.
  a: A coffin. Dark, I know.
- q: What gets wetter the more it dries?
  a: A towel.
- q: I'm tall when I'm young and short when I'm old. What am I?
  a: A candle.
- q: What has hands but can't clap?
  a: A clock.
- q: What runs but never walks, has a mouth but never talks, has a bed but never sleeps?
  a: A river.
- q: You see me once in June, twice in November, and never in May. What am I?
  a: The letter E.
- q: I can fly without wings, cry without eyes, and wherever I go, darkness follows me. What am I?
  a: A cloud.
- q: What has one eye but cannot see?
  a: A needle.
- q: The more you remove, the bigger I get. What am I?
  a: A hole.
- q: What begins with T, ends with T, and has T in it?
  a: A teapot.
- q: What can you hold in your right hand but never in your left?
  a: Your left hand.
- q: I have no doors but have keys, no rooms but have space, and you can enter but can't walk in.
  a: A piano.
- q: What goes up but never comes down?
  a: Your age. Painful truth.
- q: What is always in front of you but can't be seen?
  a: The future.
- q: I have branches but no fruit or leaves. What am I?
  a: A bank.
