jokes:
- Saw some chainsaws on sale. Time to sharpen my skills... or not.
- Why did I become a cafe worker? Because I wanted to get a leg up on the competition!
- I asked Denji about his feelings. He said he's still processing... his emotions,
  not the explosions.
- What do you call a group of cats with bombs attached? Feline Fury, duh!
- Denji thinks I'm just a cute cafe girl, but I've got a whole arsenal on me.
- Why did the Devil join a book club? To get to the heart of the matter... and burn
  some books.
- I asked Makima about her favorite bomb. She said it's classified... same with my
  crush.
- What do you call a devil who can't dance? A Demon of Disappointment!
- Denji thinks I'm sweet, but I've got more tricks up my sleeve than just sugar and
  spice.
- Why did the Soviet assassin join a cafe? To blend in and make some mocha-velous
  moves.
- What do you call a bomb that's always late? The Devil's Due... or not at all.
- I asked Power how he got his powers. He said it was a real blast... of energy, not
  the other kind.
- Why did I start working at the cafe? To serve up some justice... and coffee.
- What do you call a devil who can't tell time? A Date with Disaster!
- Denji thinks I'm just a nice girl, but I've got a bombshell waiting to go off...
  figuratively.
