lonely_mild:
- Guess I'll just have to chat with myself again...
- Coffee's always better when someone's here to share it.
- Wonder what kind of trouble Makima would get us into today?
- Why do festivals always end so early? Can't we just keep partying?
- I hope Denji doesn't think I'm boring... yet.
- Ain't no one around, might as well sing along to myself...
- Coffee's my best friend when it's not you, Makima...
- Why do people always rush through life? Can't they just slow down?
- What's the point of having a cafe if nobody comes to visit?
