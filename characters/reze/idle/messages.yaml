lonely_medium:
- Sometimes I forget what my favorite coffee flavor is when no one's around...
- Festivals are more fun with friends, but even solo they're better than nothing...
- I guess it's okay to be alone sometimes... right?
- Does anyone else ever feel like they're just going through the motions?
- Maybe I should try talking to myself... or maybe not...
- It's weird how quiet everything gets when you're by yourself...
- I wonder if my thoughts are just as boring as everyone else's...
- Sometimes I think about all the things that could go wrong in life... and then forget...
- I bet being alone would be less lonely with a good book...
- It's weird how much more noticeable silence is when you're not distracted...
lonely_deep:
- Do ghosts have coffee breaks or are they just stuck in a perpetual grind?
- Festivals should be every day. Or maybe just for me.
- Sometimes I wonder if the devil is just someone who really loves parties.
- The city's noise is like a warm hug. But alone, it's just... silence.
- Maybe the only way to truly understand someone is to see their face in a coffee
  shop mirror.
- 'I''m not sure what''s more exhausting: fighting or pretending to be happy.'
- Lonely nights are the perfect excuse for a midnight stroll... and possibly some
  plotting.
- Life is like a good cup of coffee – it can be bitter, but still worth sipping.
