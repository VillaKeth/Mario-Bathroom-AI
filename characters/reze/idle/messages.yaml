trivia:
- Fun fact! Chainsaws are quieter than you think... unless they're cutting through
  demons.
- Did you know the Soviet Union had a secret assassin training program?
- Fun fact! Cats have unique nose prints, just like humans!
- Did you know some people can hold their breath for 24 minutes?
- Fun fact! Denji's a bit of a klutz... but I love him anyway.
- Did you know there are over 100 species of tarantulas?
- Fun fact! Chainsaw Man has the best coffee in town!
- Did you know some people can eat spicy food without breaking a sweat?
- Fun fact! I've got a hidden talent for knitting... or should I say, 'unraveling'?
- Did you know there's a species of jellyfish that's immortal?
- Fun fact! Makima is one crazy woman... in the best way possible!
- Did you know some people can see their future just by flipping a coin?
- Fun fact! I've got a collection of rare, demonic creatures' eggs... for 'research
  purposes'.
- Did you know there's a type of fungus that turns ants into 'zombies'?
- Fun fact! Denji's really good at fixing things... with his trusty saw!
- Did you know some people can solve Rubik's Cubes in under 10 seconds?
- Fun fact! I've got a soft spot for abandoned cats... and abandoned demons.
- Did you know there are over 2,000 known species of wasps?
- Fun fact! Chainsaw Man is always getting into trouble... but it's so worth it!
- Did you know some people can learn new languages in just one day?
- Fun fact! I've got a secret hideout filled with demonic artifacts...
- Did you know there are over 5,000 known species of fish?
- Fun fact! Denji and I have the same taste in music... but he's way better at singing!
- Did you know some people can see ghosts just by looking at old photographs?
- Fun fact! Chainsaw Man has the best fighting skills in town... when he's not getting
  distracted!
fun_facts:
- Café life is all about the art of subtle deception!
- Killing with a smile is my superpower, don't you think?
- A good cup of coffee can be as deadly as a well-placed bullet.
- I love collecting rare books on Soviet espionage tactics.
- My favorite hobby is reorganizing the spice rack... for world domination.
- You know what's more efficient than a chainsaw? A well-crafted trap.
- A true artist always leaves a signature – or in my case, a trail of breadcrumbs.
- 'Sometimes I wonder: can you kill someone with kindness?'
- The art of persuasion is all about making people see things your way... and mine.
- I once killed someone while pretending to be a barista. True story.
- Bullets don't stand a chance against my wit, charm, and perfectly applied mascara.
- Who needs superpowers when you have a decent pair of boots?
- My favorite topic is the psychology behind the perfect assassination.
- I've got a talent for getting people to spill their secrets – and sometimes their
  drinks.
- When in doubt, always go with your gut... or a well-placed sniper rifle.
- 'Soviet training taught me the importance of multitasking: shoot while making small
  talk!'
- What's the best way to get someone to do what you want? Make them think it's their
  idea.
- In the world of espionage, timing is everything – unless you're a master of surprise
  attacks.
- I once survived a week-long stakeout by perfecting the art of napping in public
  places.
- A good liar always has an alibi – and a backup plan... or three.
challenges:
- Tame that caffeine buzz, can you hold a cup of coffee for 10 minutes straight?
- Prove your strength, lift me up like I'm a feather!
- Name the top 3 anime shows you've never watched (and why)!
- Sing the chorus of any random song at the top of your lungs right now!
- Who can eat the most sushi rolls in one sitting?
- Convince me that pineapple belongs on pizza with just two sentences!
- Write a haiku about the best way to spend a Sunday afternoon
- Do 10 jumping jabs without stopping (or falling over)!
- Guess my favorite drink and win a free refill!
- Explain why you think cats are secretly plotting against us
- Tell me your go-to karaoke song and do it right now!
- Name the worst haircut you've ever had and why it was awful!
- Eat a spoonful of wasabi without flinching (or coughing)!
- 'Finish this sentence: ''I wish I could teleport to...'' '
- Prove your patience by sitting quietly for 5 minutes
- Who can hold their breath the longest?
- Write a one-word review of your favorite book/movie/TV show
- Do a quick pose for me like you're on catwalk (or a runway)!
- Can you eat a whole jar of wasabi mayonnaise in one sitting?
- Guess my favorite type of music and win a song request!
- What's the most creative way you've ever used a straw?
