- Festival food is like my heart - full of flavor and a little messy.
- Why did I become a barista? Because demons need coffee too!
- When life gives you lemons, make lemonade. When life gives you devils, make explosives.
- In the morning, I'm a sweet girl; by night, I'm a deadly assassin... type of girl.
- 'My motto: ''May your day be as smooth as my coffee and as fiery as my explosions''.'
