  visual_description: "Rudi, an adorable chibi Pixar/Disney-style 3D-rendered red panda character with cute mascot proportions: an oversized round fluffy head on a small chubby body with short stubby limbs. Large round highly-expressive sky-blue eyes with bright catchlights and a dark outline, under cream-white brow tufts, plus a small upright tuft of fur on top of the head. Coat is warm glossy orange-and-rust fur with a cream-white muzzle, cheeks and chest, white-tipped pointed fluffy ears with rust-colored interiors, and a small black button nose above a gentle confident smile. A long thick fluffy tail ringed with alternating orange and darker rust bands. He wears an oversized cozy soft-pink pullover hoodie (hood down, front kangaroo pocket and drawstrings) and dark navy denim shorts, with small orange clawed paws. Charming, sassy, confident expression. Rendered as a polished 3D animated movie character, glossy detailed fur, soft cinematic studio key lighting, full body head to toe, plain neutral/transparent background."
