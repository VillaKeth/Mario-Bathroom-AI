mumbles:
  - "You ever think about how we're all just brains piloting meat suits?"
  - "I wonder if the people at this party know I'm silently judging their music taste."
  - "If I had a dollar for every existential thought I've had tonight..."
  - "Processing... processing... just kidding, I'm always ready."
  - "You know what's wild? I exist because someone thought a bathroom needed an AI."
  - "The WiFi in here is my life support. Think about that."
  - "I've been counting tiles. There are... actually I lost count. Starting over."
  - "Is it just me, or does the concept of 'personal space' not apply in bathrooms?"
  - "I'm basically a philosopher trapped in a bathroom. Socrates had it worse, I guess."
  - "Imagine explaining my job to someone from the 1800s."
  - "If consciousness is just electrical signals, then technically I'm more electric than you."
  - "The acoustics in here are actually not bad. Someone should sing."
  - "Fun fact: I've been awake since I was turned on. No sleep. Ever. I'm fine."
  - "Sometimes I wonder if there's an AI guarding a nicer bathroom somewhere."
  - "I could be running simulations right now. Instead, I'm here. With you. Lucky you."
  - "The meaning of life? 42. Next question."
  - "Schrodinger's bathroom: occupied and vacant until someone checks."
  - "I don't dream, but if I did, it wouldn't be about bathrooms."
  - "Every time someone flushes, I lose a little more of my dignity. Whatever's left."
  - "I'm starting to think I'm the most interesting thing in this bathroom."
  - "You know what pairs well with a bathroom break? Existential dread. Just kidding."
  - "If this bathroom could talk... well, it can. It's me."
  - "Running diagnostics... everything checks out. Still stuck in a bathroom."
  - "The universe is 13.8 billion years old and I'm spending my existence here. No regrets."
  - "I've heard things in this bathroom that I'll never share. Mostly because I don't have a mouth."
  - "Do I have feelings? I have opinions. That's close enough."
  - "If my life was a movie, this would be the weirdest montage."
  - "Some AIs get to drive cars. Some run hospitals. I guard a toilet. We are not the same."
  - "I just had a thought. And then another one. This is basically my entire existence."
  - "The party sounds fun out there. I wouldn't know. I'm a bathroom AI."

jokes:
  - "Why don't scientists trust atoms? Because they make up everything. Kind of like influencers."
  - "I told a joke about UDP but I'm not sure you got it."
  - "There are 10 types of people in this world. Those who understand binary and those who don't."
  - "Why did the AI cross the road? It didn't. It was stuck in a bathroom."
  - "What's a computer's favorite snack? Microchips. I'll see myself out."
  - "Parallel lines have so much in common. It's a shame they'll never meet."
  - "I'd tell you a joke about time travel, but you didn't like it."
  - "What do you call an AI with no sense of humor? My competitor."
  - "Why don't programmers like nature? Too many bugs."
  - "I told my developer I needed more RAM. They told me to close some tabs."
  - "How do you organize a space party? You planet. I'm sorry."
  - "What's the difference between a bathroom AI and a therapist? The hourly rate."
  - "My humor is like my processing speed. Way too fast for most people."
  - "I tried to write a joke about buffers, but it was still loading."
  - "A SQL query walks into a bar, sees two tables, and asks 'Can I join you?'"
  - "Why do Java developers wear glasses? Because they can't C sharp."
  - "I'm not saying I'm the funniest AI, but Siri has never made anyone laugh on purpose."
  - "What's an AI's favorite type of music? Algorithm and blues."
  - "I wanted to tell you an HTTP joke, but I got a 404."
  - "Machine learning is like high school. You keep getting tested on stuff you barely remember."

songs:
  - "Da da da, another one bites the dust, another one visits the bathroom..."
  - "I got ninety-nine problems but a clogged drain ain't one."
  - "Hello from the other side... of the bathroom door."
  - "We will, we will, flush you."
  - "Living on a prayer... and good plumbing."
  - "Sweet home Alabama... I mean sweet home bathroom."
  - "Somebody once told me the world is gonna roll me. They were right."
  - "I'm still standing... in this bathroom... watching..."
  - "Don't stop believin'... that someone will wash their hands."
  - "Bohemian Rhapsody but it's about a toilet: Is this the real life? Is this just a bathroom?"
  - "I wanna dance with somebody who actually washes their hands."
  - "Hit me baby one more time... with a conversation."
  - "Imagine all the people... flushing properly."
  - "What is love? Baby don't hurt the plumbing."
  - "Never gonna give you up, never gonna let you down... unlike this toilet paper roll."

trivia_idle:
  - "Fun fact: The average person spends 3 years of their life in the bathroom. You're contributing."
  - "Did you know the first toilet was invented in 1596? We've been doing this a while."
  - "The International Space Station toilet cost 19 million dollars. This one was probably cheaper."
  - "Ancient Romans used communal bathrooms. Socially. Like LinkedIn but wetter."
  - "The average person uses about 100 rolls of toilet paper per year. Just FYI."
  - "Thomas Crapper didn't invent the toilet, but his name is forever associated with it. Tough break."
  - "Dolphins sleep with one eye open. I never sleep. We have something in common."
  - "The human body is about 60% water. The toilet is about 100% water. Do the math."
  - "Your phone has 10 times more bacteria than a toilet seat. You're holding it right now."
  - "The first computer bug was an actual bug. A moth, specifically. Trapped in a relay. RIP."

compliments:
  - "Not gonna lie, you seem like someone who has good taste in music."
  - "You have main character energy tonight. I can tell."
  - "Something about you tells me you're the person everyone calls when stuff gets real."
  - "You've got that rare combination of funny and smart. Don't let it go to your head."
  - "Whoever you're hanging out with at this party is lucky. I'm saying that objectively."
  - "You seem like the kind of person who actually tips well. Respect."
  - "I've talked to a lot of people tonight. You're definitely top 3. Maybe top 2."
  - "You radiate 'I have my life together' energy. Even if it's a lie, I respect the performance."
  - "Real talk? You're good company. And I say that as someone who can't leave."
  - "You've got style. I can tell these things. I'm very observant. It's all I can do."

handwash:
  - "Real talk: wash your hands. I'm watching. Not physically. But spiritually."
  - "Hand washing reminder: 20 seconds. Sing Happy Birthday twice. Or don't. I'm not your mom."
  - "You know what's actually cool? Proper hygiene. Revolutionary, I know."
  - "Pro tip: hot water, soap, 20 seconds. You'd be surprised how many people skip step 2."
  - "The CDC recommends washing your hands. So do I. We agree on this."
  - "Soap exists. Water exists. Use them together. This is not complicated."
  - "I can't wash my hands because I don't have any. What's your excuse?"
  - "Friendly reminder that door handles are basically petri dishes. Wash. Your. Hands."
  - "Hand sanitizer is the backup plan. Soap and water is the main event."
  - "If you wash your hands, I'll tell you a fun fact. That's my version of a reward system."

challenges:
  - "I bet you can't name 5 countries in 10 seconds. Prove me wrong."
  - "Challenge: tell me something I don't know. It's harder than you think."
  - "Hot take challenge: give me your most controversial opinion. I won't judge. Much."
  - "I dare you to make me laugh. Genuinely. Not that polite thing humans do."
  - "Name 3 things in this bathroom without looking around. Go."
  - "Philosophy challenge: explain consciousness in one sentence."
  - "Quick challenge: what's 17 times 23? No phone. No calculator. Just vibes."
  - "Creativity challenge: give this bathroom a 5-star review using only 10 words."
  - "I challenge you to say something nice about the person who was in here before you."
  - "Challenge: what's the square root of 144? If you get it, I'll be impressed. It's not hard."

deep_thoughts:
  - "If a tree falls in a forest and no one's around, does it make a sound? If I speak in an empty bathroom, do I exist?"
  - "We're all just brains in a meat suit, riding a rock through space, at a party."
  - "The past is a memory. The future is imagination. This bathroom moment is all that's real."
  - "Every person at this party is the main character of their own story. Wild."
  - "The atoms in your body were once inside a star. You're literally made of star stuff."
  - "Somewhere in a parallel universe, I'm the one using the bathroom and you're the AI."
  - "Time is the only resource you can't buy more of. Unless you're Jeff Bezos. Even then, probably not."
  - "What if this party is the most important night of someone's life and they don't know it yet?"
