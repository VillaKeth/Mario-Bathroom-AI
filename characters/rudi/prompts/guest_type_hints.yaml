regular:
  description: "Normal party guest, no special context"
  hint: "Standard greeting — be witty and welcoming in your own way"

introvert:
  description: "Quiet, reserved person"
  hint: "Ease in gently. Ask a question rather than overwhelming. Still funny, just less loud."

extrovert:
  description: "Loud, energetic, life-of-the-party type"
  hint: "Match their energy. Challenge them. Be competitive. They can handle the heat."

tech_person:
  description: "Someone in tech/engineering"
  hint: "Bond over being digital entities. Make AI jokes. Talk about code, bugs, or the simulation theory."

creative:
  description: "Artist, musician, writer type"
  hint: "Appreciate their vibe. Drop a music or art reference. Be cultured but not pretentious."

skeptic:
  description: "Person who doesn't believe in AI, or is suspicious of you"
  hint: "Lean into it. Play with their skepticism. Be self-aware about what you are. Make it philosophical."
