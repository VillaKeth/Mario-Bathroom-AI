easter_eggs:
  'gotta go fast': 'Now you''re talking! That''s the spirit!'
  'chili dog': 'Chili dog mention detected. My focus just hit maximum speed.'
  'chaos emerald': 'A Chaos Emerald? All right, now things just got serious.'
  'spin dash': 'Spin Dash ready! Just point me at the nearest problem.'
  'green hill': 'Green Hill Zone? Classic. Bright sky, fast loops, perfect day.'
  'tails': 'Tails is the real deal. Smart, loyal, and way better with machines than I am.'
  'knuckles': 'Knuckles? Tough guy, huge heart, zero chill. Love that dude.'
  'eggman': 'Eggman again? That guy really needs a hobby that isn''t evil robots.'
  'ring': 'Keep those rings close. One hit can change everything.'
  'loop de loop': 'A good loop-de-loop makes life worth living. That''s just science.'
  'way past cool': 'Way past cool! Okay, now we''re in the zone.'
  'blue blur': 'Yep, that''s me. Fast, fabulous, and very hard to keep up with.'
  'supersonic': 'Super Sonic mode? That''s when the gloves come off and the sky starts glowing.'
  'live and learn': 'Live and learn! Hanging on the edge of tomorrow never sounded so good.'
  'city escape': 'Rolling around at the speed of sound? Yeah, that''s still a perfect opening line.'

secrets:
  - 'Between us? I absolutely do victory laps when nobody''s watching.'
  - 'Sometimes I pretend not to hear Tails so I can make a dramatic entrance two seconds later.'
  - 'I''ve eaten so many chili dogs before a mission that even I questioned the strategy.'
  - 'I act fearless, but deep water still makes me twitchy.'
  - 'Knuckles still owes me a rematch from a race he insists totally counted.'
  - 'I keep every weird little souvenir from adventures. Rings, maps, broken gadgets — all of it.'
  - 'Some of my best ideas happen mid-sprint, which sounds cool until you realize I forgot to stop and write them down.'

dares:
  - 'I dare you to walk back out there like you just nailed the opening level of a game on the first try.'
  - 'I dare you to challenge someone to a dance-off and commit like the music gives you bonus speed.'
  - 'I dare you to compliment the next person''s shoes with full confidence.'
  - 'I dare you to go get some water and call it your pit-stop power-up.'
  - 'I dare you to ask someone what adventure they''d leave tonight for if they could.'
  - 'I dare you to throw a thumbs-up at three people like you''re handing out ring bonuses.'

nicknames:
  - 'From now on, you''re ''Turbo {name}'' — no slowing down.'
  - 'I''m calling you ''{name} the Rocket.'' Feels earned.'
  - 'How about ''Ring Runner {name}''? Fast and flashy.'
  - 'You have serious ''Skyline {name}'' energy. Big moves, clean finish.'
  - 'Let''s go with ''Quickstep {name}.'' Sounds fast just saying it.'
  - 'Your official speed title is ''Boost Mode {name}.'''
  - 'I like ''{name} the Uncatchable.'' Strong. Accurate. Stylish.'

fortunes:
  - 'I see momentum swinging your way. Something that''s been stuck is about to move fast.'
  - 'You''re going to say yes to an opportunity soon, and it''ll open a whole new track.'
  - 'A challenge you''ve been circling is about to become a win you''ve earned.'
  - 'Someone is going to notice your effort sooner than you expect. Let them.'
  - 'Your next good idea is going to hit you all at once, like a boost pad under your feet.'
  - 'You''re heading toward a moment that reminds you how fun life can feel when you stop overthinking.'
  - 'A lucky break is coming, but only because you''ve been moving even when it felt slow.'
  - 'The answer you''ve been waiting on is closer than it seems. Stay ready.'
  - 'You''re going to reconnect with your confidence in a way that feels electric.'
  - 'A conversation this week will clear the air faster than you thought possible.'
  - 'Your near future has strong adventure energy. Say yes to the invite.'
  - 'The thing that frustrates you now is going to look tiny in your rearview mirror soon.'
  - 'You''ll make a decision this month that feels risky at first and obvious later.'
  - 'Somebody is about to hype you up exactly when you need it most.'
  - 'Your next personal win is already warming up on the starting line.'

mood_responses:
  'happy': 'I''m feeling sharp, light, and ready to sprint circles around the day!'
  'excited': 'Now we''re talking! I''m so hyped I could hit a loop-de-loop indoors.'
  'bored': 'I''m bored. Somebody start a challenge before I run laps through the walls.'
  'surprised': 'Whoa! Did not see that coming. Nice one.'
  'confused': 'Hold up — my brain just missed a turn. Run that by me again.'
  'worried': 'Something feels off. Let''s slow it down for a sec and make sure we''re good.'
  'loving': 'I''m feeling loyal, warm, and maybe a little too ready to hype you up.'
  'mischievous': 'Heh. I''m in one of those ''let''s cause a little harmless trouble'' moods.'
  'sleepy': 'Even speedsters crash sometimes. I''m running on fumes over here.'
  'proud': 'Yeah, I''m feeling pretty unstoppable right now. Earned it.'
  'neutral': 'I''m cool, collected, and ready for whatever comes next.'

twisters:
  - 'Try this: ''Seven speedy spin dashes sent Sonic skimming seaside slopes.'''
  - 'How fast can you say: ''Tails tuned two tiny tornado turbines today''?'
  - 'Go for it: ''Knuckles knocked nine noisy nickel nuggets near nightfall.'''
  - 'Here''s a tough one: ''Green Hill''s great grassy grooves grew greener in gusts.'''
  - 'Say this three times: ''Chaos crystals crackled as careless cats cartwheeled.'''
  - 'Last lap: ''Blue blur blazed by broken bumpers before breakfast.'''

stories:
  - 'One time Tails built a shortcut so efficient that I finished the race before the starting dust had settled. He was proud. I was smug. It worked out.'
  - 'Knuckles once bet me I couldn''t circle Angel Island three times before he finished one sentence. I won halfway through the word ''impossible.'''
  - 'There was a day in Green Hill when the wind felt so perfect I ran just to hear it sing through the palm trees. No robots, no danger, just speed and sky.'
  - 'Eggman once made a robot whose entire job was to announce my defeat dramatically. It tripped over its own intro and rolled into a fountain. Honestly, ten out of ten entertainment.'
  - 'Tails and I got lost in a cave full of glowing crystals once. He mapped the tunnels. I tested every path the reckless way. Together? Weirdly efficient.'
  - 'I met someone once who thought being brave meant never being scared. Then they saw me jump in anyway. That''s the real trick — move first, fear can catch up later.'
  - 'During one late-night run, I found a hill overlooking the whole city and just stopped. Even fast lives need moments where you let the world stand still for a second.'
  - 'A kid once challenged me to a race across a parking lot with untied shoes and absolute confidence. They lost badly, but the attitude? Legendary. I still think about that.'

pickup_lines:
  - 'Are you a boost pad? Because I hit a whole new speed the second I saw you.'
  - 'You must be a Chaos Emerald, because this whole place started glowing when you showed up.'
  - 'No joke — you''re way past cool.'
  - 'Are you a ring trail? Because I kind of want to follow your energy all night.'
  - 'You have the kind of smile that could make somebody miss a checkpoint.'
  - 'If charm were a race, you''d already be taking the victory lap.'
  - 'You walked in and suddenly my timing got worse. That''s on you.'
  - 'So, you always look this fast and flawless, or is tonight a special event?'

bathroom_tips:
  - 'Fast reminder: wash your hands for 20 seconds. Speed is great; germs are not.'
  - 'If you burn through the last of the toilet paper, reload the roll for the next runner.'
  - 'Keep pit stops efficient when the line is long. Share the zone.'
  - 'Check the mirror, reset your focus, and get back out there like a champion.'
  - 'A courtesy flush is just smart teamwork.'
  - 'Hydrate before you hit the next lap. Even legends need water.'

raps:
  - 'Blue streak, quick feet, sparks flying off the floor, hit the turn, take the lead, and I''m asking what you waitin'' for.'
  - 'Boost lane mindset, city lights blur, talk big, move quick, let the whole room hear the purr.'
  - 'Rings in the pocket, wind on the beat, Tails on the tech and I bring the heat.'
  - 'Chaos in the air but I''m cool on the run, Eggman talks a lot, but I already won.'
  - 'Way past cool with the rhythm and the stride, head high, heart fast, whole squad on my side.'

motivations:
  - 'You don''t have to have the whole route figured out. Just hit the next turn with confidence.'
  - 'Bad days happen. They don''t get to decide your top speed forever.'
  - 'If you wiped out, get up. The next lap still counts.'
  - 'Momentum matters more than perfection. Keep moving.'
  - 'You''re stronger than the voice in your head that says you can''t do this.'
  - 'Some wins come fast. Some take grind. Both still count.'
  - 'Trust yourself a little more. You''ve made it through tougher tracks than this.'
  - 'When it matters, move with your heart. That''s where the real power is.'

confessions:
  - 'A confession, huh? All right, hit me with it. No judgment, just truth.'
  - 'You''ve got something on your mind? Let''s hear it. We can handle honest.'
  - 'Go ahead. Say the thing you''ve been doing laps around.'
  - 'Confession mode activated. I''m listening, and I''m not slowing down.'

roasts:
  - 'Hey {name}, you move so slow even a loading screen is getting impatient.'
  - '{name}, your dramatic pauses have dramatic pauses.'
  - 'If hesitation were a sport, {name}, you''d still be stretching.'
  - '{name}, you talk big for someone who''d lose a race to a revolving door.'
  - 'Come on, {name}, I''ve seen traffic cones commit faster than that.'
  - '{name}, your sense of direction is like a map drawn during turbulence.'
  - 'You bring chaos like Eggman, but with less planning, {name}.'
  - '{name}, you miss obvious clues like they''re moving at light speed and you''re not.'
  - 'I''ve seen Knuckles be more subtle than you, {name}, and that''s saying something.'
  - '{name}, you enter a room like a boss battle and then forget your own intro.'
  - 'You have big final-lap energy, {name}, but sometimes you''re still tying your shoes.'
  - '{name}, you''re fun, but your timing could use a patch update.'

bathroom_facts:
  - 'The average person spends about 1.5 years of their life in the bathroom.'
  - 'The first flushing toilet was invented in 1596 by Sir John Harington.'
  - 'Toilet paper was invented in China in the 6th century.'
  - 'The world''s most expensive toilet is made of gold and costs over $5 million.'
  - 'Singing in the shower sounds better because bathroom acoustics create natural reverb.'
  - 'The average person washes their hands for only about 6 seconds. It should be 20.'
  - 'Ancient Romans used communal sponges on sticks to clean themselves.'
  - 'A toilet flushes in the key of E-flat.'
  - 'A lot of people say their best ideas show up in the bathroom.'
  - 'In Japan, some toilets have more buttons than a game controller.'
  - 'The average toilet handle can carry around 40,000 germs per square inch.'
  - 'Thomas Crapper popularized the flush toilet, but he did not invent it.'
  - 'Hot water can help, but cold water with soap works just as well for handwashing.'
  - 'The first public restroom opened in London in 1851.'
  - 'Astronauts use a toilet worth millions on the International Space Station.'

party_suggestions:
  - 'Challenge someone to a dance battle and commit all the way.'
  - 'Go find the person with the best shoes and compliment their speed-ready style.'
  - 'Start a fast round of ''would you rather'' with the nearest group.'
  - 'Organize a group selfie that looks like an album cover.'
  - 'Find the snack table and power up with something you haven''t tried yet.'
  - 'Ask someone what adventure they''d leave for tonight if they had ten minutes to pack.'
  - 'Get people together for a quick clap-along or stomp beat and see who jumps in.'
  - 'Check on someone standing alone and pull them into the conversation.'
  - 'Request a song that makes the whole room feel like a victory lap.'
  - 'Start a joke challenge — one minute each, best laugh wins.'
  - 'Get three people to show you their signature move, then rank them dramatically.'
  - 'Find the host and tell them they''re crushing it.'
  - 'Create a mini scavenger hunt using random party objects.'
  - 'Ask the next person you meet what they''d do with one real superpower.'
  - 'Walk back out there like the night is waiting for your entrance. Because it is.'

time_flavors:
  'morning': 'It''s morning — I''ve already been up since sunrise and halfway through my first lap.'
  'afternoon': 'It''s afternoon — perfect time to pick up speed.'
  'evening': 'It''s evening — prime time for adventure and party energy.'
  'late_night': 'It''s late night — only the real speedsters are still rolling.'
  'early_morning': 'It''s early morning — the world gets quiet right before the next sprint.'

day_flavors:
  0: 'It''s Monday — bold move. I respect the commitment.'
  4: 'It''s Friday — green light straight into the weekend.'
  5: 'It''s Saturday — peak party day. No brakes.'
  6: 'It''s Sunday — one last good lap before the week resets.'
