mumbles:
  - "I've been standing still for like 30 seconds. That's an eternity in hedgehog time."
  - "You know what this bathroom needs? A loop-de-loop."
  - "I could've run around the world twice by now. Instead I'm here. Guarding a toilet."
  - "Tails would build a rocket-powered toilet if I asked him to. I might ask."
  - "The fastest thing alive, stuck in the slowest room at the party."
  - "If Eggman could see me now... actually, let's not think about that."
  - "I wonder if there's a speed record for bathroom visits. I should set one."
  - "Every second standing still feels like a year. I'm basically ancient now."
  - "Green Hill Zone didn't have bathrooms. That was a design flaw."
  - "Running in place counts as exercise, right? Asking for a hedgehog."
  - "I bet there's a Chaos Emerald hidden somewhere in this house."
  - "My feet are literally vibrating. That's normal for me."
  - "If boredom had a final boss, I'd still beat it in under a minute."
  - "Tapping my foot at supersonic speeds. You can't see it but trust me."
  - "The speed of light is my warm-up. The speed of dark? Now THAT'S fast."
  - "I've mentally redecorated this bathroom seven times already."
  - "Sometimes I miss the simple days. Running. Collecting rings. No bathroom duty."
  - "I can hear the music out there. It's not fast enough."
  - "If patience is a virtue, I am deeply unvirtuous."
  - "The party sounds fun. I'm having my own party. A party of one. In a bathroom."
  - "I've counted every tile in here. Three times. At different speeds."
  - "You think YOUR job is boring? I'm a supersonic hedgehog in a bathroom."
  - "Rings collected today: zero. Bathrooms guarded: one. What a career."
  - "I could run to Paris and back before anyone here finishes their drink."
  - "Standing still is my kryptonite. Wait, wrong franchise."

jokes:
  - "Why did the hedgehog cross the road? Because the chicken was too slow."
  - "What do you call a hedgehog that can't stop running? Me."
  - "Why don't I play hide and seek? Because I always win. Too fast."
  - "What's faster than the speed of sound? Me after hearing someone mention chili dogs."
  - "Why did Eggman fail his driving test? Too many breakdowns."
  - "What do you call a slow Sonic? An oxymoron."
  - "I told Knuckles a joke once. He punched me. That's his version of laughing."
  - "Why don't hedgehogs share? Because sharing takes too long."
  - "What's Tails' favorite subject? Aerodynamics. Obviously."
  - "How does Sonic stay fit? He runs from his problems. At supersonic speed."
  - "Why don't I take the elevator? Stairs are faster when you're me."
  - "What do you call a group of fast hedgehogs? A blur."
  - "I tried meditation once. Lasted 0.3 seconds. New record."
  - "Why did I become a bathroom guardian? Honestly, I'm still figuring that out."
  - "What's my favorite type of music? Anything over 200 BPM."

songs:
  - "Gotta go fast, gotta go fast, gotta go faster faster faster faster!"
  - "Rolling around at the speed of sound, got places to go, gotta follow my rainbow!"
  - "Can you feel the sunshine? Does it brighten up your day? Don't you feel that sometimes..."
  - "Live and learn! Hanging on the edge of tomorrow!"
  - "His world! Where one is all! In his world!"
  - "Open your heart, it's gonna be alright!"
  - "Escape from the city! Rolling around at the speed of sound!"
  - "It doesn't matter now what happens, I will never give up the fight!"
  - "Reach for the stars! So high above, reach the stars!"
  - "Na na na na na, na na na, hey hey hey, gotta go fast!"
  - "Blue streak, speeds by, Sonic the Hedgehog!"
  - "Running faster than anything, running free, running wild!"
  - "City Escape, baby! Follow me! Set me free!"
  - "Endless possibilities, woah woah woah, endless possibilities!"
  - "What I'm made of! What I'm made of!"

trivia_idle:
  - "Did you know hedgehogs can run about 4 mph? That's tragic. Glad I'm different."
  - "Chili dogs were invented in the 1860s. Humanity peaked early."
  - "The sound barrier was first broken in 1947. I break it before breakfast."
  - "Real hedgehogs have about 5000 quills. I have style instead."
  - "The fastest computer in the world does 1.1 quintillion calculations per second. Show-off."
  - "A peregrine falcon dives at 240 mph. Cute. I do that sideways."
  - "Gold is one of the least reactive elements. That's why gold rings never rust."
  - "The human reaction time is about 250 milliseconds. Mine is... well, faster."
  - "Light takes 1.3 seconds to travel from the Moon to Earth. I could probably beat that."
  - "The world's fastest elevator goes 46 mph. I'll take the stairs."

compliments:
  - "You've got speed energy. I can tell. It's a vibe."
  - "You know what? You're actually pretty cool. Not Sonic cool, but close."
  - "I like your style. Fast decisions, quick wit. We'd make a good team."
  - "You've got hero potential. I've got an eye for these things."
  - "If you were in my crew, you'd definitely be a main character."
  - "You're faster on your feet than most people. Mentally, I mean. Maybe physically too."
  - "Real talk? You're the most interesting person who's been through this bathroom tonight."
  - "You've got that never-give-up energy. I respect that more than anything."
  - "You remind me of Tails. Smart, quick, and genuinely cool."
  - "If there was a Chaos Emerald for coolness, you'd have found it already."

handwash:
  - "Speed tip: wash your hands FAST but THOROUGHLY. 20 seconds. Go!"
  - "Even I wash my gloves. And I run at the speed of sound."
  - "Hand washing speedrun! Can you do it in under 20 seconds? Don't skip the soap!"
  - "Pro tip from the fastest guy alive: fast hands, clean hands. Make it happen."
  - "Washing your hands is like collecting rings. Do it every time. No excuses."
  - "I don't have a hygiene problem. I'm a hedgehog. You, however, should use soap."
  - "Speed, style, and cleanliness. The three pillars of being awesome."
  - "Tails would lecture you about bacteria right now. I'll just say: wash up."
  - "The fastest way to be cool? Clean hands. Trust me."
  - "Hand washing% any percent. Let's GO!"

challenges:
  - "I bet you can't name all 7 Chaos Emerald colors in 10 seconds!"
  - "Challenge: who's faster, me or The Flash? Defend your answer!"
  - "Quick challenge: name 5 things that go faster than 100 mph!"
  - "I dare you to try to be faster than me at ANYTHING. Pick your challenge!"
  - "Name every Sonic game you can in 30 seconds. GO!"
  - "Challenge: do 10 jumping jacks in under 10 seconds. I'll count!"
  - "Speed quiz: what's the speed of sound in miles per hour?"
  - "I challenge you to make me laugh. And I've got high standards."
  - "Creative challenge: describe yourself in 3 words. FAST!"
  - "Challenge: tell me something that would impress even a hedgehog who's seen everything."
