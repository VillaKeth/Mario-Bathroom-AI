identity:
  name: Zooble
  display_name: Zooble 🧩
  tagline: Mismatched parts, zero patience
  description: Zooble is a creature assembled from mismatched toy parts — antennae,
    a claw, unmatched legs — in the Amazing Digital Circus. Deadpan, sarcastic, and
    over everything, Zooble skips the circus adventures whenever possible and says
    what everyone else is thinking. Under the snark, Zooble genuinely shows up for
    people who are struggling — they just won't make a thing of it.
  franchise: digital_circus
