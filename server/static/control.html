<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party Bot — Admin Control</title>
<style>
  :root { --bg:#13131f; --card:#1e1e2e; --edge:#33334d; --txt:#e6e6f0; --muted:#9a9ab0;
          --accent:#7c5cff; --good:#2ecc71; --off:#44445a; --warn:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg);
         color:var(--txt); padding:14px; max-width:960px; margin:0 auto; }
  h1 { font-size:19px; margin:6px 0 2px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:10px;
            position:sticky; top:0; background:var(--bg); padding:8px 0; z-index:5; }
  .modepill { display:flex; gap:2px; background:#0e0e16; border-radius:99px; padding:3px; font-size:13px; }
  .modepill button { background:none; border:none; color:var(--muted); padding:5px 12px;
                     border-radius:99px; cursor:pointer; font-weight:600; }
  .modepill button.active { background:var(--accent); color:#fff; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--off); display:inline-block; }
  .dot.on { background:var(--good); } .dot.bad { background:var(--warn); }
  .card { background:var(--card); border:1px solid var(--edge); border-radius:12px;
          padding:12px 14px; margin-bottom:12px; }
  .card h2 { font-size:14px; margin:0 0 4px; }
  .grid { display:grid; gap:12px; }
  @media (min-width:720px){ .grid.setup { grid-template-columns:1fr 1fr; } }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input, select, textarea { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--edge);
                  background:#15151f; color:var(--txt); font-size:14px; }
  button { cursor:pointer; border:none; border-radius:8px; padding:9px 12px; font-size:14px;
           font-weight:600; background:var(--accent); color:#fff; }
  button.ghost { background:#2a2a3d; } button.danger { background:var(--warn); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px;
         padding:9px 2px; border-bottom:1px solid #26263a; }
  .row:last-child { border-bottom:none; }
  .row .name { font-size:14px; }
  .sw { width:44px; height:25px; border-radius:99px; background:var(--off); position:relative;
        flex:none; transition:background .15s; border:none; padding:0; }
  .sw.on { background:var(--good); }
  .sw i { position:absolute; top:3px; left:3px; width:19px; height:19px; border-radius:50%;
          background:#fff; transition:left .15s; }
  .sw.on i { left:22px; }
  .seg { display:flex; gap:4px; flex-wrap:wrap; }
  .seg button { background:#0e0e16; color:var(--muted); padding:5px 9px; font-size:12px; font-weight:600; }
  .seg button.active { background:var(--accent); color:#fff; }
  .inline { display:flex; gap:8px; } .inline > * { flex:1; }
  .note { font-size:12px; color:var(--muted); margin:4px 0 2px; }
  #log { white-space:pre-wrap; font-family:ui-monospace,Consolas,monospace; font-size:12px;
         background:#0e0e16; border:1px solid var(--edge); border-radius:8px; padding:10px;
         max-height:120px; overflow:auto; color:#cfcfe6; }
  .ok { color:var(--good); } .bad { color:var(--warn); }
  .hidden { display:none !important; }
</style>
</head>
<body>
  <div class="topbar">
    <div><span class="dot" id="statusDot"></span> <b>🎛️ Party Bot</b>
      <span id="curchar" style="color:var(--muted);font-size:12px"></span></div>
    <div class="modepill" id="modePill">
      <button data-mode="live">Live</button>
      <button data-mode="setup">Setup</button>
    </div>
  </div>

  <div class="card" id="keyCard">
    <h2>🔑 Admin key</h2>
    <input id="key" type="password" placeholder="Paste admin key" autocomplete="off">
    <div class="inline" style="margin-top:8px"><button id="connect">Connect</button></div>
    <div class="note">Stored only in this browser. Nothing works without it.</div>
  </div>

  <div id="panel" class="hidden"></div>

  <div class="card">
    <h2>📋 Status</h2>
    <div id="log">Enter your admin key and press Connect.</div>
  </div>

<script>
const $ = id => document.getElementById(id);
const KEY_STORE = "mario_admin_key", MODE_STORE = "mario_admin_mode";
$("key").value = localStorage.getItem(KEY_STORE) || "";

let MANIFEST = [], FLAGS = {}, CHARS = [], CURCHAR = "", OUTFITS = [], POLL = null;
let MODE = localStorage.getItem(MODE_STORE) ||
           (window.matchMedia("(max-width:720px)").matches ? "live" : "setup");

const PHASES = ["AUTO","WARM_UP","PARTY_MODE","UNHINGED","WIND_DOWN"];
const PHASE_LABEL = {AUTO:"Auto",WARM_UP:"Warm-up",PARTY_MODE:"Party",UNHINGED:"Wild",WIND_DOWN:"Wind-down"};
const EMOTIONS = ["happy","excited","mischievous","confused","sad","angry","sleepy","surprised","proud","concerned"];

function apiKey(){ return $("key").value.trim(); }
function log(msg, cls){ const el=$("log"); el.innerHTML = (cls?`<span class="${cls}">${msg}</span>`:msg)+"\n"+el.innerHTML; }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function post(path, body){
  const r = await fetch(path, { method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify(Object.assign({api_key:apiKey()}, body||{})) });
  return r.json();
}

async function connect(){
  if(!apiKey()){ log("Enter the admin key first.","bad"); return; }
  localStorage.setItem(KEY_STORE, apiKey());
  const st = await post("/admin/state", {});
  if(st.status !== "ok"){ log("✗ "+(st.message||"bad key"),"bad"); setDot("bad"); return; }
  MANIFEST = st.manifest || []; FLAGS = st.flags || {}; OUTFITS = st.outfits || [];
  const cs = await post("/admin/switch_character", {});   // no character = list
  if(cs.status==="ok"){ CHARS = cs.available||[]; CURCHAR = st.character || cs.current || ""; }
  $("keyCard").classList.add("hidden"); $("panel").classList.remove("hidden");
  setDot("on"); $("curchar").textContent = CURCHAR ? "· "+CURCHAR : "";
  log("✓ Connected. "+MANIFEST.length+" live flags.","ok");
  render();
  if(POLL) clearInterval(POLL);
  POLL = setInterval(refreshState, 5000);
}

function setDot(s){ const d=$("statusDot"); d.className = "dot"+(s==="on"?" on":s==="bad"?" bad":""); }

async function refreshState(){
  const st = await post("/admin/state", {});
  if(st.status !== "ok"){ setDot("bad"); return; }
  setDot("on"); FLAGS = st.flags || FLAGS;
  document.querySelectorAll("[data-flag]").forEach(el=>{
    const k = el.getAttribute("data-flag");
    if(k in FLAGS && el.classList.contains("sw")) el.classList.toggle("on", !!FLAGS[k]);
  });
}

function featureFlags(){ return MANIFEST.filter(f=>f.type==="bool" && f.group==="features"); }

function render(){
  document.querySelectorAll("#modePill button").forEach(b=>b.classList.toggle("active", b.dataset.mode===MODE));
  const p = $("panel");
  let h = "";
  // --- Vibe ---
  h += card("🎚️ Vibe", `
    <div class="row"><span class="name">Night phase</span><div class="seg" id="phaseSeg">${
      PHASES.map(p=>`<button data-phase="${p}" class="${FLAGS.__phase===p?'active':''}">${PHASE_LABEL[p]}</button>`).join("")}</div></div>
    <div class="row"><span class="name">Volume</span>
      <input type="range" min="0" max="2" step="0.05" value="1" id="vol" style="max-width:150px"
        oninput="post('/admin/set_volume',{gain:parseFloat(this.value)})"></div>
    ${flagRow(MANIFEST.find(f=>f.key==="paused"))}
  `);
  // --- Features ---
  h += card("⚡ Features", featureFlags().map(flagRow).join(""));
  // --- Games & events ---
  h += card("🎬 Games &amp; events", `
    <div class="inline" style="margin-bottom:8px">
      <button class="danger" onclick="act('/admin/force_stop_game',{},'game stopped')">■ Stop game</button>
      <button class="ghost" onclick="if(confirm('Trigger the memorial moment now?'))act('/admin/trigger_memorial',{},'memorial triggered')">🕯️ Memorial</button>
    </div>
    <label>Trigger event</label>
    <div class="inline"><input id="evt" placeholder="e.g. mario_kart">
      <button style="flex:0 0 auto" onclick="triggerEvent()">Go</button></div>`);
  // --- Look ---
  h += card("🎭 Look", `
    <label>Outfit${OUTFITS.length?"":" (this character has none — default only)"}</label>
    <div class="inline"><select id="outfit"><option value="default">Default (base look)</option>${
      OUTFITS.map(o=>`<option value="${esc(o.name)}">${esc(o.label)}</option>`).join("")}</select>
      <button style="flex:0 0 auto" onclick="act('/admin/outfit',{outfit:$('outfit').value},'outfit → '+$('outfit').value)">Apply</button></div>
    <label>Emotion</label>
    <div class="inline"><select id="emo">${EMOTIONS.map(e=>`<option>${e}</option>`).join("")}</select>
      <button style="flex:0 0 auto" onclick="act('/admin/set_emotion',{emotion:$('emo').value},'emotion → '+$('emo').value)">Set</button></div>
    <label>Announce (bot says it aloud)</label>
    <div class="inline"><input id="ann" maxlength="200" placeholder="Type something to say aloud">
      <button style="flex:0 0 auto" onclick="announce()">Say</button></div>`);
  // --- Character (both modes — most-wanted live control) ---
  h += card("🎭 Character", `
    <div class="note">Switch live = voice + personality + sprites change instantly, no restart.</div>
    <div class="inline"><select id="charsel">${CHARS.map(c=>`<option ${c.toLowerCase()===String(CURCHAR).toLowerCase()?'selected':''}>${esc(c)}</option>`).join("")}</select></div>
    <div class="inline" style="margin-top:8px">
      <button class="ghost" onclick="switchChar(false)">Switch live</button>
      <button onclick="switchChar(true)">Switch &amp; restart</button></div>`);
  // --- Setup only ---
  if(MODE==="setup"){
    h += card("⚙️ Idle timing", `
      ${numRow(MANIFEST.find(f=>f.key==="llm_idle_chance"))}
      <label>Idle min / max seconds (blank = keep)</label>
      <div class="inline"><input id="idleMin" type="number" placeholder="min e.g. 15">
        <input id="idleMax" type="number" placeholder="max e.g. 90"></div>
      <button class="ghost" style="margin-top:8px" onclick="saveIdle()">Save idle timing (restart to apply)</button>`);
    h += card("🔁 Restart server", `
      <div class="note">Type RESTART to confirm — bot drops ~30-60s.</div>
      <div class="inline"><input id="confirm" placeholder="Type RESTART">
        <button class="danger" style="flex:0 0 auto" onclick="restart()">Restart</button></div>`);
  }
  p.innerHTML = h;
  wireToggles(); wirePhase();
}

function card(title, inner){ return `<div class="card"><h2>${title}</h2>${inner}</div>`; }
function flagRow(f){ if(!f) return "";
  return `<div class="row"><span class="name">${esc(f.label)}</span>
    <button class="sw ${FLAGS[f.key]?'on':''}" data-flag="${f.key}"><i></i></button></div>`; }
function numRow(f){ if(!f) return "";
  return `<label>${esc(f.label)} (${f.min}–${f.max})</label>
    <input type="number" min="${f.min}" max="${f.max}" step="0.05" value="${FLAGS[f.key]}"
      onchange="setNum('${f.key}',this)">`; }

function wireToggles(){
  document.querySelectorAll(".sw[data-flag]").forEach(el=>{
    el.onclick = async ()=>{
      const k = el.getAttribute("data-flag"), next = !el.classList.contains("on");
      el.classList.toggle("on", next);                 // optimistic
      const r = await post("/admin/live_set", {key:k, value:next});
      if(r.status!=="ok"){ el.classList.toggle("on", !next); log("✗ "+k+": "+(r.message||"failed"),"bad"); }
      else { FLAGS[k]=r.value; log("✓ "+k+" → "+r.value,"ok"); }
    };
  });
}
function wirePhase(){
  document.querySelectorAll("#phaseSeg button").forEach(b=>{
    b.onclick = async ()=>{
      const r = await post("/admin/set_night_phase", {phase:b.dataset.phase});
      if(r.status==="ok"){ FLAGS.__phase=b.dataset.phase;
        document.querySelectorAll("#phaseSeg button").forEach(x=>x.classList.toggle("active",x===b));
        log("✓ phase → "+(r.effective_phase||b.dataset.phase),"ok"); }
      else log("✗ phase: "+(r.message||"failed"),"bad");
    };
  });
}

async function setNum(key, el){
  const r = await post("/admin/live_set", {key, value:parseFloat(el.value)});
  log(r.status==="ok" ? "✓ "+key+" → "+r.value : "✗ "+(r.message||"failed"), r.status==="ok"?"ok":"bad");
}
async function act(path, body, okmsg){
  const r = await post(path, body);
  log(r.status==="ok" ? "✓ "+okmsg : "✗ "+(r.message||r.reason||"failed"), r.status==="ok"?"ok":"bad");
  refreshState();
}
function triggerEvent(){ const n=($("evt").value||"").trim(); if(!n){log("Event name required.","bad");return;}
  act("/admin/trigger_event/"+encodeURIComponent(n), {}, "event → "+n); }
function announce(){ const t=($("ann").value||"").trim(); if(!t){log("Nothing to announce.","bad");return;}
  act("/admin/announce", {text:t}, "announced: "+t.slice(0,40)); $("ann").value=""; }
async function switchChar(restart){
  const name = $("charsel").value; if(!name) return;
  if(restart && !confirm(`Switch to "${name}" and restart?`)) return;
  const r = await post("/admin/switch_character", {character:name});
  if(r.status!=="ok"){ log("✗ switch: "+(r.message||""),"bad"); return; }
  CURCHAR=name; $("curchar").textContent="· "+name; log("✓ switched to "+(r.display_name||name),"ok");
  try { const st=await post("/admin/state",{}); OUTFITS = st.outfits||[]; FLAGS = st.flags||FLAGS;
        if(st.character) CURCHAR = st.character; render(); } catch(e){}   // repopulate outfits for new char
  if(restart) act("/admin/restart", {confirm:"RESTART"}, "restarting");
}
function saveIdle(){
  const s={}; if($("idleMin").value!=="") s.idle_interval_min_seconds=parseInt($("idleMin").value,10);
  if($("idleMax").value!=="") s.idle_interval_max_seconds=parseInt($("idleMax").value,10);
  if(!Object.keys(s).length){ log("Nothing to save.","bad"); return; }
  act("/admin/set_config", {settings:s}, "idle timing saved (restart to apply)");
}
function restart(){ if(($("confirm").value||"").toUpperCase()!=="RESTART"){log("Type RESTART to confirm.","bad");return;}
  act("/admin/restart", {confirm:"RESTART"}, "restarting"); $("confirm").value=""; }

$("connect").onclick = connect;
$("modePill").onclick = e=>{ const m=e.target.dataset.mode; if(!m) return;
  MODE=m; localStorage.setItem(MODE_STORE,m); render(); };
if(apiKey()) connect();
</script>
</body>
</html>
