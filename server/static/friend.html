<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mario AI — Live</title>
<style>
  html,body{margin:0;background:#111;color:#eee;font-family:system-ui,Arial,sans-serif;height:100%}
  #wrap{display:flex;flex-direction:column;height:100%}
  #top{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#1b1b1b;font-size:13px}
  #status{color:#9c9}
  #viewers{color:#cda;font-weight:600}
  #stage{flex:1;display:flex;align-items:center;justify-content:center;background:#000;min-height:0}
  canvas{max-width:100%;max-height:100%;image-rendering:auto}
  #turn{padding:6px 10px;font-size:13px;background:#181818;color:#fc8;min-height:18px}
  #turn.you{color:#7e7}
  #log{max-height:24vh;overflow-y:auto;padding:6px 10px;background:#141414;font-size:14px;line-height:1.35}
  #log .who{font-weight:700;color:#8cf}
  #log .bot .who{color:#fb6}
  #log div{margin:2px 0}
  #setup,#bar{display:flex;gap:8px;padding:10px;background:#1b1b1b;align-items:center}
  #setup input,#bar input{flex:1;padding:12px;font-size:16px;border-radius:8px;border:1px solid #444;background:#222;color:#fff;min-width:0}
  #setup input#pin,#setup input#name{flex:1}
  #bar button,#setup button{padding:12px 16px;font-size:16px;border-radius:8px;border:0;background:#e23;color:#fff}
  #bar button:disabled{background:#555}
  #tapcover{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <span id="status">connecting…</span>
    <span id="viewers">👁 –</span>
  </div>
  <div id="stage"><canvas id="screen" width="640" height="360"></canvas></div>
  <div id="turn"></div>
  <div id="log"></div>
  <div id="setup" class="hidden">
    <input id="pin" type="text" inputmode="numeric" placeholder="PIN" size="6" autocomplete="off">
    <input id="name" type="text" placeholder="Your name" maxlength="20" autocomplete="off">
    <button id="save">Join chat</button>
  </div>
  <div id="bar" class="hidden">
    <input id="msg" type="text" placeholder="Say something…" autocomplete="off">
    <button id="send">Send</button>
  </div>
</div>
<div id="tapcover">Tap to start</div>
<script>
const qs = new URLSearchParams(location.search);
const TOKEN = qs.get("token") || "";
const CONTROL_MODE = "__CONTROL_MODE__";   // injected by the server
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const viewersEl = document.getElementById("viewers");
const turnEl = document.getElementById("turn");
const logEl = document.getElementById("log");
const setupEl = document.getElementById("setup");
const bar = document.getElementById("bar");
const tapcover = document.getElementById("tapcover");
let audioUnlocked = false;

// --- identity: a temporary name + a stable random browser id -----------------
function uuid(){
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return "id-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
}
let clientId = localStorage.getItem("mirror_client_id");
if (!clientId){ clientId = uuid(); localStorage.setItem("mirror_client_id", clientId); }
let myName = localStorage.getItem("mirror_name") || "";
let turnHolder = null;            // name of whoever currently holds the turn (or null)

// --- audio playback queue (WAV blobs arriving over WS) -----------------------
const audioEl = new Audio();
const audioQueue = [];
let playing = false;
function pumpAudio(){
  if (playing || audioQueue.length === 0) return;
  playing = true;
  const url = URL.createObjectURL(audioQueue.shift());
  audioEl.src = url;
  audioEl.play().catch(()=>{ playing = false; });
}
audioEl.onended = audioEl.onerror = () => { playing = false; pumpAudio(); };

tapcover.onclick = () => {
  audioUnlocked = true;
  audioEl.play().catch(()=>{});   // unlock autoplay with a user gesture
  tapcover.classList.add("hidden");
};

// --- chat UI (remote mode only) ----------------------------------------------
const sendBtn = document.getElementById("send");
const msgEl = document.getElementById("msg");
const pinEl = document.getElementById("pin");
const nameEl = document.getElementById("name");
const saveBtn = document.getElementById("save");

function showChatUI(){
  if (CONTROL_MODE !== "remote") return;
  if (myName){ setupEl.classList.add("hidden"); bar.classList.remove("hidden"); }
  else { setupEl.classList.remove("hidden"); bar.classList.add("hidden"); nameEl.value = ""; }
}
function renderTurn(){
  if (CONTROL_MODE !== "remote"){ turnEl.textContent = ""; return; }
  const mine = turnHolder && myName && turnHolder.toLowerCase() === myName.toLowerCase();
  if (turnHolder && !mine){
    turnEl.textContent = "💬 March is chatting with " + turnHolder + "…";
    turnEl.classList.remove("you");
    sendBtn.disabled = true; msgEl.disabled = true;
  } else {
    turnEl.textContent = mine ? "🎤 You're talking" : "🎤 Your turn — say hi!";
    turnEl.classList.toggle("you", !!mine);
    sendBtn.disabled = false; msgEl.disabled = false;
  }
}
function renderLog(lines){
  logEl.innerHTML = "";
  (lines || []).forEach(l => {
    const d = document.createElement("div");
    const isBot = myName && l.who && l.who.toLowerCase() !== myName.toLowerCase();
    // bot vs human styling is heuristic; the character name is highlighted amber
    d.className = "";
    const who = document.createElement("span"); who.className = "who"; who.textContent = l.who + ": ";
    d.appendChild(who); d.appendChild(document.createTextNode(l.text));
    logEl.appendChild(d);
  });
  logEl.scrollTop = logEl.scrollHeight;
}

saveBtn.onclick = () => {
  const n = nameEl.value.trim();
  if (!n) return;
  myName = n; localStorage.setItem("mirror_name", n);
  if (pinEl.value.trim()) localStorage.setItem("mirror_pin", pinEl.value.trim());
  showChatUI(); renderTurn();
};
pinEl.value = localStorage.getItem("mirror_pin") || "";

// --- WebSocket: binary frames/audio + JSON control events --------------------
let ws = null;
let lastFrameTs = Date.now();   // frame watchdog clock
function sendHello(){
  try { ws.send(JSON.stringify({type:"hello", name: myName, id: clientId})); } catch(e){}
}
// Watchdog: if frames stop arriving for >6s while the socket looks open, the
// server may have dropped us without a clean close. Force a reconnect so the
// page self-heals instead of sitting frozen.
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN && (Date.now() - lastFrameTs) > 6000) {
    statusEl.textContent = "recovering…";
    try { ws.close(); } catch(e){}   // triggers onclose -> reconnect
  }
}, 2000);
function handleControl(obj){
  if (obj.type === "presence"){
    viewersEl.textContent = "👁 " + obj.viewers + (obj.viewers === 1 ? " watching" : " watching");
  } else if (obj.type === "turn"){
    turnHolder = obj.busy ? obj.name : null;
    renderTurn();
  } else if (obj.type === "transcript"){
    renderLog(obj.lines);
  }
}
function connect(){
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host + "/mirror");
  ws.binaryType = "arraybuffer";
  ws.onopen = () => { statusEl.textContent = "live"; lastFrameTs = Date.now(); sendHello(); };
  ws.onclose = () => { statusEl.textContent = "reconnecting…"; setTimeout(connect, 2000); };
  ws.onmessage = (ev) => {
    if (typeof ev.data === "string"){        // JSON control event
      try { handleControl(JSON.parse(ev.data)); } catch(e){}
      return;
    }
    const buf = new Uint8Array(ev.data);     // binary: tagged frame/audio
    const tag = buf[0];
    const payload = buf.subarray(1);
    if (tag === 0x01) {                       // video frame (JPEG)
      lastFrameTs = Date.now();               // watchdog: a frame arrived
      const blob = new Blob([payload], {type: "image/jpeg"});
      createImageBitmap(blob).then(bmp => {
        if (canvas.width !== bmp.width || canvas.height !== bmp.height){
          canvas.width = bmp.width; canvas.height = bmp.height;
        }
        ctx.drawImage(bmp, 0, 0);
        bmp.close && bmp.close();
      }).catch(()=>{});
    } else if (tag === 0x02) {                // audio (WAV)
      if (!audioUnlocked) return;             // wait for the tap gesture
      audioQueue.push(new Blob([payload], {type: "audio/wav"}));
      pumpAudio();
    }
  };
}
connect();
showChatUI(); renderTurn();

// --- sending text ------------------------------------------------------------
async function send(){
  const text = msgEl.value.trim();
  if (!text || !myName) return;
  sendBtn.disabled = true;
  try {
    const r = await fetch("/friend/say", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text, token: TOKEN, pin: (localStorage.getItem("mirror_pin")||pinEl.value.trim()), name: myName, id: clientId})
    });
    const j = await r.json();
    if (j.status === "ok"){
      statusEl.textContent = "live"; msgEl.value = "";
    } else if (j.status === "busy"){
      turnHolder = j.holder; renderTurn();
      statusEl.textContent = "✋ " + j.holder + " is talking";
    } else {
      statusEl.textContent = "✋ " + (j.message || j.reason || "rejected");
    }
  } catch(e) {
    statusEl.textContent = "send failed";
  } finally {
    renderTurn();   // re-enables unless someone else holds the turn
  }
}
sendBtn.onclick = send;
msgEl.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
</script>
</body>
</html>
