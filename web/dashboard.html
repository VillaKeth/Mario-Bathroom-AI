<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mario AI — Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1a2e;color:#eee;min-height:100vh;padding:12px}
h1{text-align:center;font-size:1.4em;margin-bottom:10px;color:#e94560}
.status-bar{text-align:center;font-size:.85em;color:#888;margin-bottom:12px}
.status-bar .tier{font-weight:bold;padding:2px 8px;border-radius:4px;margin-left:6px}
.tier-FULL{background:#00c853;color:#000}
.tier-DEGRADED{background:#ffc107;color:#000}
.tier-MINIMAL{background:#ff6d00;color:#fff}
.tier-EMERGENCY{background:#d50000;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.tile{background:#16213e;border-radius:10px;padding:12px;text-align:center;border:1px solid #0f3460}
.tile .icon{font-size:1.8em;margin-bottom:4px}
.tile .label{font-size:.7em;color:#888;text-transform:uppercase;letter-spacing:.5px}
.tile .value{font-size:1.3em;font-weight:bold;margin-top:2px}
.ok{color:#00c853}.slow{color:#ffc107}.failed{color:#d50000}.unknown{color:#888}
.section-title{font-size:.85em;color:#e94560;text-transform:uppercase;letter-spacing:1px;margin:14px 0 6px;padding-left:4px}
.error-box{background:#2d1b1b;border:1px solid #d50000;border-radius:8px;padding:10px;margin-top:8px;font-size:.8em;color:#ff6b6b;display:none}
.refresh-indicator{position:fixed;top:4px;right:8px;font-size:.7em;color:#555}
.sliders{background:#16213e;border-radius:10px;padding:14px;border:1px solid #0f3460}
.slider-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.slider-row label{font-size:.8em;min-width:120px}
.slider-row input[type=range]{flex:1;margin-left:10px;accent-color:#e94560}
</style>
</head>
<body>
<h1>🍄 Mario AI Dashboard</h1>
<div class="status-bar" id="statusBar">Connecting...</div>

<div class="section-title">System</div>
<div class="grid" id="systemGrid">
  <div class="tile"><div class="icon" id="icoUptime">⏱️</div><div class="label">Uptime</div><div class="value" id="valUptime">--</div></div>
  <div class="tile"><div class="icon">💾</div><div class="label">Memory</div><div class="value" id="valMemory">--</div></div>
  <div class="tile"><div class="icon">🌡️</div><div class="label">GPU Temp</div><div class="value" id="valGpu">--</div></div>
  <div class="tile"><div class="icon">⚙️</div><div class="label">Phase</div><div class="value" id="valPhase">--</div></div>
</div>

<div class="section-title">AI Components</div>
<div class="grid" id="aiGrid">
  <div class="tile"><div class="icon" id="icoLlm">🤖</div><div class="label">LLM</div><div class="value" id="valLlm">--</div></div>
  <div class="tile"><div class="icon" id="icoTts">🔊</div><div class="label">TTS</div><div class="value" id="valTts">--</div></div>
  <div class="tile"><div class="icon" id="icoStt">🎤</div><div class="label">STT</div><div class="value" id="valStt">--</div></div>
  <div class="tile"><div class="icon">⚡</div><div class="label">Avg Response</div><div class="value" id="valAvgResp">--</div></div>
</div>

<div class="section-title">Party</div>
<div class="grid" id="partyGrid">
  <div class="tile"><div class="icon">👥</div><div class="label">Guests</div><div class="value" id="valGuests">--</div></div>
  <div class="tile"><div class="icon">🎮</div><div class="label">Games</div><div class="value" id="valGames">--</div></div>
  <div class="tile"><div class="icon">❌</div><div class="label">Errors</div><div class="value" id="valErrors">--</div></div>
  <div class="tile"><div class="icon">💬</div><div class="label">TTS Cache</div><div class="value" id="valCache">--</div></div>
</div>

<div class="error-box" id="errorBox"></div>

<div class="section-title">🎛️ Personality Tuning</div>
<div class="sliders" id="sliderSection">
  <div class="slider-row"><label>🎲 Chaos <span id="valChaos">5</span>/10</label><input type="range" min="1" max="10" value="5" id="sliderChaos"></div>
  <div class="slider-row"><label>🔥 Roast <span id="valRoast">2</span>/5</label><input type="range" min="0" max="5" value="2" id="sliderRoast"></div>
  <div class="slider-row"><label>🗣️ Gossip <span id="valGossip">5</span>/10</label><input type="range" min="1" max="10" value="5" id="sliderGossip"></div>
  <div class="slider-row"><label>💖 Warmth <span id="valWarmth">7</span>/10</label><input type="range" min="1" max="10" value="7" id="sliderWarmth"></div>
</div>

<div class="refresh-indicator" id="refreshIndicator">●</div>

<script>
const REFRESH_MS = 5000;
let errorStreak = 0;

function fmtUptime(s) {
  if (!s && s !== 0) return '--';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return h > 0 ? h + 'h ' + m + 'm' : m + 'm';
}

function statusClass(s) {
  if (!s) return 'unknown';
  s = String(s).toLowerCase();
  if (s === 'ok') return 'ok';
  if (s === 'slow') return 'slow';
  if (s === 'failed' || s === 'error') return 'failed';
  return 'unknown';
}

function statusIcon(s) {
  const c = statusClass(s);
  if (c === 'ok') return '🟢';
  if (c === 'slow') return '🟡';
  if (c === 'failed') return '🔴';
  return '⚪';
}

async function refresh() {
  const dot = document.getElementById('refreshIndicator');
  dot.style.color = '#ffc107';
  try {
    const resp = await fetch('/api/health', { signal: AbortSignal.timeout(8000) });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const d = await resp.json();
    errorStreak = 0;

    // Status bar
    const tier = d.degradation_tier || 'FULL';
    document.getElementById('statusBar').innerHTML =
      'Status: <span class="tier tier-' + tier + '">' + tier + '</span>';

    // System
    document.getElementById('valUptime').textContent = fmtUptime(d.uptime_seconds);
    document.getElementById('valMemory').textContent = d.memory_mb ? d.memory_mb + ' MB' : '--';
    document.getElementById('valGpu').textContent = d.gpu_temp_c != null ? d.gpu_temp_c + '°C' : 'N/A';
    document.getElementById('valPhase').textContent = d.current_phase || d.performance_tier || '--';

    // AI components
    document.getElementById('icoLlm').textContent = statusIcon(d.llm);
    document.getElementById('valLlm').className = 'value ' + statusClass(d.llm);
    document.getElementById('valLlm').textContent = d.llm || '--';

    document.getElementById('icoTts').textContent = statusIcon(d.tts);
    document.getElementById('valTts').className = 'value ' + statusClass(d.tts);
    document.getElementById('valTts').textContent = d.tts || '--';

    document.getElementById('icoStt').textContent = statusIcon(d.stt);
    document.getElementById('valStt').className = 'value ' + statusClass(d.stt);
    document.getElementById('valStt').textContent = d.stt || '--';

    document.getElementById('valAvgResp').textContent = d.avg_response_time_ms
      ? (d.avg_response_time_ms / 1000).toFixed(1) + 's'
      : (d.avg_response_time || '--');

    // Party
    document.getElementById('valGuests').textContent = d.guests_served != null ? d.guests_served : (d.total_visits || '--');
    document.getElementById('valGames').textContent = d.active_games != null ? d.active_games : (d.active_game || '0');
    document.getElementById('valErrors').textContent = d.error_count != null ? d.error_count : '0';
    document.getElementById('valCache').textContent = d.tts_cache_size != null
      ? d.tts_cache_size + (d.tts_cache_hit_rate ? ' (' + d.tts_cache_hit_rate + ')' : '')
      : '--';

    document.getElementById('errorBox').style.display = 'none';
    dot.style.color = '#00c853';
  } catch (e) {
    errorStreak++;
    dot.style.color = '#d50000';
    const eb = document.getElementById('errorBox');
    eb.textContent = 'Connection error: ' + e.message + (errorStreak > 1 ? ' (x' + errorStreak + ')' : '');
    eb.style.display = 'block';
    document.getElementById('statusBar').innerHTML = 'Status: <span class="tier tier-EMERGENCY">OFFLINE</span>';
  }
  setTimeout(refresh, REFRESH_MS);
}

refresh();

// ── Personality Sliders ──
const sliderMap = {
  sliderChaos: { key: 'chaos_level', display: 'valChaos' },
  sliderRoast: { key: 'roast_cap', display: 'valRoast' },
  sliderGossip: { key: 'gossip_intensity', display: 'valGossip' },
  sliderWarmth: { key: 'warmth', display: 'valWarmth' },
};

// Load current values
fetch('/api/live-config').then(r => r.json()).then(d => {
  if (d.config) {
    for (const [sliderId, info] of Object.entries(sliderMap)) {
      const val = d.config[info.key];
      if (val != null) {
        document.getElementById(sliderId).value = val;
        document.getElementById(info.display).textContent = val;
      }
    }
  }
}).catch(() => {});

// Wire slider change events
for (const [sliderId, info] of Object.entries(sliderMap)) {
  const el = document.getElementById(sliderId);
  el.addEventListener('input', function() {
    document.getElementById(info.display).textContent = this.value;
  });
  el.addEventListener('change', function() {
    const payload = {};
    payload[info.key] = parseInt(this.value);
    fetch('/api/reload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    }).catch(e => console.warn('Reload failed:', e));
  });
}
</script>
</body>
</html>
