<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario AI Party Leaderboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a1a;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Animated star background */
        .stars {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        .container {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            padding: 20px 30px;
            gap: 15px;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 10px 0;
        }
        .header h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2.2em;
            background: linear-gradient(135deg, #ffd700, #ff6b35, #ffd700);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShift 3s ease infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }
        @keyframes goldShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .header .subtitle {
            font-size: 0.8em;
            color: #888;
            margin-top: 5px;
        }
        .party-time {
            font-size: 0.9em;
            color: #ff6b35;
            margin-top: 8px;
        }

        /* Main content grid */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            overflow: hidden;
        }

        /* Category cards */
        .category-card {
            background: linear-gradient(135deg, rgba(20, 20, 50, 0.9), rgba(30, 30, 70, 0.9));
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 12px;
            padding: 18px 20px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, border-color 0.3s;
        }
        .category-card:hover {
            transform: scale(1.02);
            border-color: rgba(255, 215, 0, 0.6);
        }
        .category-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }
        .category-card .icon {
            font-size: 1.8em;
            margin-bottom: 6px;
            display: block;
        }
        .category-card .label {
            font-size: 0.65em;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .category-card .value {
            font-size: 1.3em;
            font-weight: 700;
            margin-top: 4px;
            color: var(--accent);
        }
        .category-card .detail {
            font-size: 0.7em;
            color: #777;
            margin-top: 3px;
        }

        /* Right panel — visitor ranking */
        .visitors-panel {
            grid-column: 2;
            grid-row: 1 / -1;
            background: linear-gradient(180deg, rgba(15, 15, 40, 0.95), rgba(10, 10, 30, 0.95));
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
        }
        .visitors-panel h2 {
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9em;
            color: #ffd700;
            text-align: center;
            margin-bottom: 15px;
        }
        .visitor-row {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 6px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            transition: background 0.3s;
        }
        .visitor-row:hover {
            background: rgba(255, 215, 0, 0.08);
        }
        .visitor-rank {
            width: 35px;
            font-weight: 900;
            font-size: 1.1em;
        }
        .rank-1 { color: #ffd700; text-shadow: 0 0 8px rgba(255, 215, 0, 0.5); }
        .rank-2 { color: #c0c0c0; }
        .rank-3 { color: #cd7f32; }
        .visitor-name {
            flex: 1;
            font-size: 0.85em;
            color: #ddd;
        }
        .visitor-count {
            font-weight: 700;
            font-size: 0.9em;
            color: #ff6b35;
        }
        .visitor-title {
            font-size: 0.55em;
            color: #888;
            font-style: italic;
        }

        /* Left panel categories stack */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Ticker bar */
        .ticker-bar {
            background: linear-gradient(90deg, rgba(255, 215, 0, 0.1), rgba(255, 107, 53, 0.1), rgba(255, 215, 0, 0.1));
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            padding: 12px 20px;
            text-align: center;
            font-size: 0.8em;
            color: #ffd700;
            position: relative;
            overflow: hidden;
            animation: tickerGlow 4s ease infinite;
        }
        @keyframes tickerGlow {
            0%, 100% { border-color: rgba(255, 215, 0, 0.2); }
            50% { border-color: rgba(255, 215, 0, 0.5); }
        }
        .ticker-text {
            animation: fadeInOut 5s ease infinite;
        }
        @keyframes fadeInOut {
            0%, 10% { opacity: 0; transform: translateY(10px); }
            20%, 80% { opacity: 1; transform: translateY(0); }
            90%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        /* Pipes decoration */
        .pipe-left, .pipe-right {
            position: fixed;
            bottom: 0;
            width: 60px;
            height: 120px;
            z-index: 0;
        }
        .pipe-left { left: 10px; }
        .pipe-right { right: 10px; }
        .pipe-body {
            width: 50px;
            height: 100px;
            background: linear-gradient(90deg, #1a8a1a, #2ecc2e, #1a8a1a);
            margin: 0 auto;
            border-radius: 0 0 5px 5px;
        }
        .pipe-top {
            width: 60px;
            height: 20px;
            background: linear-gradient(90deg, #1a8a1a, #2ecc2e, #1a8a1a);
            border-radius: 5px 5px 0 0;
            border: 2px solid #0d6b0d;
        }

        .no-data {
            text-align: center;
            color: #555;
            font-size: 0.8em;
            padding: 40px;
        }

        /* Neon glow effect for active emotion */
        .emotion-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7em;
            background: rgba(255, 100, 100, 0.15);
            border: 1px solid rgba(255, 100, 100, 0.4);
            color: #ff6b6b;
            animation: neonPulse 2s ease infinite;
        }
        @keyframes neonPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 100, 100, 0.2); }
            50% { box-shadow: 0 0 15px rgba(255, 100, 100, 0.4); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 215, 0, 0.3); border-radius: 3px; }
    </style>
</head>
<body>
    <!-- Star background -->
    <div class="stars" id="stars"></div>

    <!-- Pipe decorations -->
    <div class="pipe-left"><div class="pipe-top"></div><div class="pipe-body"></div></div>
    <div class="pipe-right"><div class="pipe-top"></div><div class="pipe-body"></div></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>&#x1F3C6; PARTY LEADERBOARD &#x1F3C6;</h1>
            <div class="subtitle">Mario AI — Live Stats</div>
            <div class="party-time" id="party-time">Loading...</div>
        </div>

        <!-- Main content -->
        <div class="main-content">
            <!-- Left: Category cards -->
            <div class="left-panel" id="categories">
                <div class="no-data">Connecting to server...</div>
            </div>

            <!-- Right: Visitor rankings -->
            <div class="visitors-panel" id="visitors-panel">
                <h2>&#x2B50; TOP VISITORS &#x2B50;</h2>
                <div id="visitor-list">
                    <div class="no-data">No visitors yet...</div>
                </div>
            </div>
        </div>

        <!-- Ticker bar -->
        <div class="ticker-bar">
            <span class="ticker-text" id="ticker">&#x2726; Waiting for party data...</span>
        </div>
    </div>

    <script>
        const API_URL = `${location.protocol}//${location.host}/leaderboard`;
        let tickerStats = [];
        let tickerIndex = 0;

        // Generate star background
        function generateStars() {
            const container = document.getElementById('stars');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = star.style.height = (Math.random() * 3 + 1) + 'px';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.animationDuration = (Math.random() * 2 + 2) + 's';
                container.appendChild(star);
            }
        }

        function createCategoryCard(icon, label, value, detail, accentColor) {
            const card = document.createElement('div');
            card.className = 'category-card';
            card.style.setProperty('--accent', accentColor);
            card.innerHTML = `
                <span class="icon">${icon}</span>
                <span class="label">${label}</span>
                <div class="value">${value}</div>
                ${detail ? `<div class="detail">${detail}</div>` : ''}
            `;
            return card;
        }

        function updateLeaderboard(data) {
            // Party time
            const pd = data.party_duration || {};
            const h = pd.hours || 0;
            const m = pd.minutes || 0;
            document.getElementById('party-time').innerHTML =
                `Party Duration: ${h}h ${m}m &nbsp;|&nbsp; ${data.current_time || ''} &nbsp;|&nbsp; ` +
                `<span class="emotion-badge">Mood: ${data.current_emotion || 'happy'}</span>`;

            // Category cards
            const panel = document.getElementById('categories');
            panel.innerHTML = '';

            const mv = data.most_visits || {};
            if (mv.name) {
                panel.appendChild(createCategoryCard(
                    '&#x1F451;', 'Most Visits', mv.name,
                    `${mv.count || 0} visits`, '#ffd700'));
            }

            const ls = data.longest_stay || {};
            if (ls.name) {
                panel.appendChild(createCategoryCard(
                    '&#x23F1;', 'Longest Stay', ls.name,
                    `${ls.minutes || 0} minutes`, '#00bfff'));
            }

            const gc = data.game_champion || {};
            if (gc.name) {
                panel.appendChild(createCategoryCard(
                    '&#x1F3AF;', 'Game Champion', gc.name,
                    `Score: ${gc.score || 0}`, '#ff6b6b'));
            }

            if (data.most_chatty) {
                panel.appendChild(createCategoryCard(
                    '&#x1F4AC;', 'Most Chatty', data.most_chatty,
                    null, '#6bff6b'));
            }

            const fm = data.funniest_moment || {};
            if (fm.name) {
                panel.appendChild(createCategoryCard(
                    '&#x1F923;', 'Funniest Moment', fm.name,
                    fm.text ? `"${fm.text.substring(0, 50)}..."` : null, '#ffff6b'));
            }

            const md = data.most_dramatic || {};
            if (md.name) {
                panel.appendChild(createCategoryCard(
                    '&#x1F3AD;', 'Most Dramatic', md.name,
                    `${md.count || 0} dramatic moments`, '#ff6bff'));
            }

            panel.appendChild(createCategoryCard(
                '&#x1F31F;', 'Total Visitors', String(data.unique_visitors || 0),
                `${data.total_visits || 0} total visits`, '#c0c0ff'));

            // Visitor list
            const visitors = data.visitors || [];
            const listEl = document.getElementById('visitor-list');
            const titles = data.guest_titles || {};

            if (visitors.length === 0) {
                listEl.innerHTML = '<div class="no-data">No visitors yet — party is just getting started!</div>';
            } else {
                listEl.innerHTML = visitors.map((v, i) => {
                    const rankClass = i < 3 ? `rank-${i + 1}` : '';
                    const medal = i === 0 ? '&#x1F947;' : i === 1 ? '&#x1F948;' : i === 2 ? '&#x1F949;' : `#${i + 1}`;
                    const title = titles[v.name] || '';
                    return `
                        <div class="visitor-row">
                            <span class="visitor-rank ${rankClass}">${medal}</span>
                            <span class="visitor-name">
                                ${v.name || 'Unknown'}
                                ${title ? `<br><span class="visitor-title">${title}</span>` : ''}
                            </span>
                            <span class="visitor-count">${v.visit_count || 0} visits</span>
                        </div>
                    `;
                }).join('');
            }

            // Ticker
            tickerStats = data.ticker_stats || [];
            if (tickerStats.length > 0) {
                tickerIndex = tickerIndex % tickerStats.length;
            }
        }

        // Ticker rotation
        function rotateTicker() {
            if (tickerStats.length === 0) return;
            tickerIndex = (tickerIndex + 1) % tickerStats.length;
            const el = document.getElementById('ticker');
            el.style.animation = 'none';
            el.offsetHeight; // trigger reflow
            el.style.animation = '';
            el.textContent = '\u2726 ' + tickerStats[tickerIndex];
        }

        // Fetch and update
        async function fetchLeaderboard() {
            try {
                const resp = await fetch(API_URL);
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const data = await resp.json();
                updateLeaderboard(data);
            } catch (err) {
                console.error('Leaderboard fetch failed:', err);
                document.getElementById('party-time').textContent =
                    'Connection lost — retrying...';
            }
        }

        // Init
        generateStars();
        fetchLeaderboard();
        setInterval(fetchLeaderboard, 10000);
        setInterval(rotateTicker, 5000);
    </script>
</body>
</html>
