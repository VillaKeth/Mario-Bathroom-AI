<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mario AI — Party Report Card</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);color:#eee;min-height:100vh;padding:20px}
.container{max-width:700px;margin:0 auto}
h1{text-align:center;font-size:2em;margin-bottom:4px;background:linear-gradient(90deg,#e94560,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:#888;font-size:.9em;margin-bottom:24px}
.loading{text-align:center;color:#888;padding:40px;font-size:1.2em}
.stats-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin-bottom:24px}
.stat{background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:12px 20px;text-align:center;min-width:120px}
.stat .num{font-size:1.8em;font-weight:bold;color:#ffd700}
.stat .lbl{font-size:.7em;color:#888;text-transform:uppercase;letter-spacing:1px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.award{background:linear-gradient(135deg,#16213e,#1a1a3e);border:1px solid #e94560;border-radius:14px;padding:16px;text-align:center;transition:transform .2s}
.award:hover{transform:scale(1.03)}
.award-icon{font-size:2.2em;display:block;margin-bottom:6px}
.award-title{font-size:.85em;color:#e94560;font-weight:bold;text-transform:uppercase;letter-spacing:.5px}
.award-detail{font-size:.9em;color:#ddd;margin-top:4px}
.section{background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:16px;margin-bottom:16px}
.section h2{font-size:1.1em;color:#e94560;margin-bottom:10px}
.section ul{list-style:none;padding:0}
.section li{padding:4px 0;border-bottom:1px solid #0f3460}
.section li:last-child{border:none}
.section table{width:100%;border-collapse:collapse}
.section th,.section td{text-align:left;padding:6px 10px;border-bottom:1px solid #0f3460}
.section th{color:#ffd700;font-size:.8em;text-transform:uppercase}
.vip{border-color:#ffd700;background:linear-gradient(135deg,#2a1a00,#16213e)}
.error-box{background:#2d1b1b;border:1px solid #d50000;border-radius:8px;padding:14px;text-align:center;color:#ff6b6b;display:none}
.footer{text-align:center;color:#555;font-size:.75em;margin-top:30px}
</style>
</head>
<body>
<div class="container">
  <h1>🍄 Mario AI Party Report 🍄</h1>
  <p class="subtitle" id="subtitle">Loading report...</p>
  <div class="loading" id="loading">⏳ Compiling party stats...</div>
  <div class="error-box" id="error"></div>
  <div id="content" style="display:none">
    <div class="stats-bar" id="stats-bar"></div>
    <div class="awards" id="awards"></div>
    <div id="sections"></div>
  </div>
  <div class="footer">Generated by Mario AI Party Bot 🎮</div>
</div>

<script>
async function loadReport() {
  const loading = document.getElementById('loading');
  const error = document.getElementById('error');
  const content = document.getElementById('content');
  try {
    const res = await fetch('/api/report');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    if (json.status === 'error') throw new Error(json.message);
    const d = json.report || json;
    renderReport(d);
    loading.style.display = 'none';
    content.style.display = 'block';
  } catch (e) {
    loading.style.display = 'none';
    error.style.display = 'block';
    error.textContent = 'Could not load report: ' + e.message;
  }
}

function renderReport(d) {
  document.getElementById('subtitle').textContent = 'Party Duration: ' + d.party_duration_hours + ' hours';

  const bar = document.getElementById('stats-bar');
  const stats = [
    [d.total_guests, 'Guests'],
    [d.total_interactions, 'Interactions'],
    [d.total_audio_minutes, 'Audio Min'],
    [d.avg_response_time + 's', 'Avg Response'],
    [d.error_count, 'Errors']
  ];
  bar.innerHTML = stats.map(s =>
    '<div class="stat"><div class="num">' + s[0] + '</div><div class="lbl">' + s[1] + '</div></div>'
  ).join('');

  const awardsEl = document.getElementById('awards');
  const awards = [
    ['🏆', 'Party Duration', d.party_duration_hours + ' hours of fun!'],
    ['👥', 'Total Guests', d.total_guests + ' guests joined'],
    ['💬', 'Interactions', d.total_interactions + ' conversations'],
    ['🎮', 'Most Popular Game', d.most_popular_game || 'None played'],
    ['😂', 'Funniest Moment', (d.funniest_moment || 'N/A').substring(0, 80)]
  ];
  if (d.top_gossip_topics && d.top_gossip_topics.length > 0) {
    const t = d.top_gossip_topics[0];
    awards.push(['🗣️', 'Hottest Topic', '"' + t.topic + '" (' + t.count + 'x)']);
  }
  if (d.birthday_person_interactions && d.birthday_person_interactions.name) {
    const v = d.birthday_person_interactions;
    awards.push(['🎂', 'Birthday Star', v.name + ' — ' + v.interaction_count + ' interactions']);
  }
  awardsEl.innerHTML = awards.map(a =>
    '<div class="award"><span class="award-icon">' + a[0] + '</span>' +
    '<div class="award-title">' + a[1] + '</div>' +
    '<div class="award-detail">' + a[2] + '</div></div>'
  ).join('');

  const sections = document.getElementById('sections');
  let html = '';

  if (d.top_gossip_topics && d.top_gossip_topics.length > 0) {
    html += '<div class="section"><h2>🗣️ Hot Topics</h2><ul>' +
      d.top_gossip_topics.map(t => '<li>' + t.topic + ' (' + t.count + 'x)</li>').join('') +
      '</ul></div>';
  }

  if (d.phase_timeline && d.phase_timeline.length > 0) {
    const phases = d.phase_timeline.map(p => p.phase + ' (hr ' + p.started_at_hour + ')').join(' → ');
    html += '<div class="section"><h2>🌙 Night Timeline</h2><p>' + phases + '</p></div>';
  }

  if (d.birthday_person_interactions && d.birthday_person_interactions.name) {
    const v = d.birthday_person_interactions;
    html += '<div class="section vip"><h2>🎂 Birthday Star: ' + v.name + '</h2>' +
      '<p>Mario chatted with them <b>' + v.interaction_count + '</b> times!</p></div>';
  }

  if (d.tts_stats && Object.keys(d.tts_stats).length > 0) {
    let rows = '';
    for (const [eng, st] of Object.entries(d.tts_stats)) {
      if (typeof st === 'object' && st !== null) {
        const rate = st.success_rate || st.successes || '?';
        rows += '<tr><td>' + eng + '</td><td>' + rate + '</td></tr>';
      }
    }
    if (rows) {
      html += '<div class="section"><h2>🔊 TTS Engines</h2>' +
        '<table><tr><th>Engine</th><th>Success Rate</th></tr>' + rows + '</table></div>';
    }
  }

  sections.innerHTML = html;
}

loadReport();
</script>
</body>
</html>
